# Mode Coverage Tracker
# Records which execution mode + workflow combinations have been proven by live runs.
# Updated after each proving run. Source of truth for automation system coverage.

mode_coverage:
  - mode: yolo_execution
    workflow_id: fast-local-diagnostic
    last_run: 2026-05-16
    run_log_path: artifacts/run_log.md (feature branch yolo/fast-local-diagnostic/2026-05-16)
    steps_completed: 2
    steps_total: 2
    validators_exercised:
      - level_1: validate-repo.py
      - level_2: validate-artifact.py (repository_sensemaking_brief)
      - level_2: validate-artifact.py (prompt_handoff)
      - level_3: validate-brief.py
      - level_3: validate-prompt-handoff.py
    gates_exercised: false
    gates_note: bypassed_by_yolo
    hardening_triggered: none
    notes: "Two TDD cycles occurred (UNKNOWN_WEAKNESS_TYPE, NO_LOGIC_TRACE). Both were single-occurrence data issues, not repeatable failure boundaries. No structural hardening warranted."

  - mode: guided_execution
    workflow_id: docs-contract-reconciliation
    last_run: 2026-05-16
    run_log_path: artifacts/guided_execution_completion_log.md (feature branch feature/guided-completion)
    steps_completed: 3
    steps_total: 3
    validators_exercised:
      - level_2: validate-artifact.py (repository_sensemaking_brief, from prior run)
      - level_2: validate-artifact.py (docs_contract_reconciliation_report)
      - level_2: validate-artifact.py (prompt_handoff)
      - level_3: validate-prompt-handoff.py
    gates_exercised: true
    gates_note: "All 3 gates exercised with approved_by_user. First live gate exercise in the system. Gate 1 (review_drift_diagnosis) continued, Gate 2 (review_reconciliation_patch) continued, Gate 3 (review_next_prompt) completion."
    hardening_triggered: none
    notes: "Completed the guided execution that paused on 2026-05-14. All 3 gates recorded gate_result, approved_at, and approved_by. Proves the full gate lifecycle."

  - mode: plan_only
    workflow_id: fast-local-diagnostic
    last_run: 2026-05-16
    run_log_path: artifacts/plan_only_run_log.md
    steps_completed: 1
    steps_total: 1
    validators_exercised:
      - level_2: validate-artifact.py (workflow_orchestration_plan)
      - level_3: validate-plan.py
    gates_exercised: false
    gates_note: not_applicable_plan_only
    hardening_triggered: none
    notes: "First live validate-plan.py invocation. Plan artifact produced with complete Section 11. All 9 plan validation categories passed. No mutation — no feature branch needed."

  - mode: prompt_chain
    workflow_id: fast-local-diagnostic
    last_run: 2026-05-16
    run_log_path: artifacts/prompt_chain_run_log.md
    steps_completed: 1
    steps_total: 1
    validators_exercised:
      - level_2: validate-artifact.py (repository_sensemaking_brief)
      - level_2: validate-artifact.py (prompt_handoff)
      - level_3: validate-brief.py
      - level_3: validate-prompt-handoff.py
    gates_exercised: false
    gates_note: not_applicable_prompt_chain
    hardening_triggered: none
    notes: "First live prompt chain. Copy-pasteable prompts produced for both workflow steps. All 4 validators passed."

  - mode: autonomous_execution
    workflow_id: fast-local-diagnostic
    last_run: 2026-05-16
    run_log_path: artifacts/autonomous_execution_run_log.md (feature branch feature/autonomous-proving)
    steps_completed: 2
    steps_total: 2
    validators_exercised:
      - level_1: validate-repo.py
      - level_2: validate-artifact.py (repository_sensemaking_brief)
      - level_2: validate-artifact.py (prompt_handoff)
      - level_3: validate-brief.py
      - level_3: validate-prompt-handoff.py
    gates_exercised: true
    gates_note: "Both gates exercised with automated_approval. User provided autonomous-execution opt-in at session start. Gates recorded gate_result, approved_at, and approved_by."
    hardening_triggered: none
    notes: "First autonomous execution. Opt-in gate mechanism verified: gates halt automatically without per-step human intervention. validate-output.py used as validator dispatcher."

# Automation System Tools
# These are tools that are proven but not mode-workflow combinations.

system_tools:
  - tool: validate-run-log.py
    status: proven
    last_verified: 2026-05-16
    notes: "Validates run log structure, gate recording, pre-flight documentation, and path hygiene. All 5 run logs validated successfully."
    run_logs_validated:
      - artifacts/run_log.md (yolo_execution)
      - artifacts/plan_only_run_log.md (plan_only)
      - artifacts/prompt_chain_run_log.md (prompt_chain)
      - artifacts/guided_execution_completion_log.md (guided_execution)
      - artifacts/autonomous_execution_run_log.md (autonomous_execution)

  - tool: analyze-run-failures.py
    status: proven
    last_verified: 2026-05-16
    notes: "Builds failure ledger from run logs. Detects repeatable failure boundaries (same error code across 2+ independent runs). All current failures are single-occurrence."
    repeatable_boundaries_detected: 0

  - tool: validate-output.py
    status: proven_as_normal_path
    last_verified: 2026-05-16
    notes: "Dispatcher that reads artifact-contracts.yaml and runs generic + specialized validators. Proven as the normal validator invocation path. 4 artifact types validated through dispatcher."
    artifacts_validated:
      - repository_sensemaking_brief
      - prompt_handoff
      - workflow_orchestration_plan
      - docs_contract_reconciliation_report

# Validator Live Invocation Coverage
validator_live_coverage:
  validate_repo_py:
    fixture_tested: excluded
    live_invocations:
      - yolo_execution (pre-flight)
      - guided_execution (pre-flight)
      - plan_only (pre-flight)
      - prompt_chain (pre-flight)
      - autonomous_execution (pre-flight)
  validate_artifact_py:
    fixture_tested: true
    live_invocations:
      - yolo_execution (both steps)
      - guided_execution (steps 1, 2, 3)
      - plan_only (step 0)
      - prompt_chain (cross-check)
      - autonomous_execution (both steps)
  validate_brief_py:
    fixture_tested: true
    live_invocations:
      - yolo_execution (step 1, inc. TDD cycle)
      - prompt_chain (cross-check)
      - autonomous_execution (step 1)
  validate_plan_py:
    fixture_tested: true
    live_invocations:
      - plan_only (step 0)
      - autonomous_execution (via plan validation)
  validate_prompt_handoff_py:
    fixture_tested: true
    live_invocations:
      - yolo_execution (step 2)
      - guided_execution (step 3)
      - prompt_chain (cross-check)
      - autonomous_execution (step 2)
  validate_skill_improvement_plan_py:
    fixture_tested: true
    live_invocations: []
    notes: "Live invocation requires a skill_improvement_plan artifact, which requires a usage_research_report input. Not yet triggered."
  validate_usage_research_report_py:
    fixture_tested: true
    live_invocations: []
    notes: "Live invocation requires a usage_research_report artifact from a usage research session. Not yet triggered."
