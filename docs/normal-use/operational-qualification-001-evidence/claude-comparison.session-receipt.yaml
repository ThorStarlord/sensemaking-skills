open_questions:
  - id: Q-1
    question: Is a coach managing several students an intended customer or channel for CME, or only an observation instrument for the single-player thesis?
    source: owner_intent
    blocking: true
    options:
      - option: Coach as observation operator only
        consequence: No new authority layer; coach runs existing per-student local flows; record friction as post-V1 observation evidence.
      - option: Coach as product segment or channel
        consequence: Reopens product thesis and segment; requires coach-assessment and coach-assignment authority layers, consent model, and an ADR before any build.
      - option: Decline for now
        consequence: Keep the single-player thesis; record the request as external evidence only.
