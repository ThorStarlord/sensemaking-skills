execution_modes:
  - id: plan_only
    description: "Generate workflow plan, stop before execution"
    user_interaction: "None; automated"
    gates_honored: false

  - id: prompt_chain
    description: "Generate prompts for each step, stop before execution"
    user_interaction: "None; automated"
    gates_honored: false

  - id: guided_execution
    description: "Execute with user review at each gate"
    user_interaction: "User reviews and approves at every gate"
    gates_honored: true
    default: true

  - id: autonomous_execution
    description: "Execute with auto-approval for passing validations"
    user_interaction: "User reviews final artifacts only"
    gates_honored: true
    auto_approval_criteria: "validation_passed and no_severity_warnings"

  - id: yolo_execution
    description: "Execute without gates or user review"
    user_interaction: "None; fully automated"
    gates_honored: false
    warning: "Use only in fully trusted, isolated environments"

artifact_ids:
  # Core Diagnostic Artifacts
  - id: user_intent
    description: "Raw user problem statement or request"
    produced_by: user
    consumed_by: [problem-framer, repo-sensemaker]
    artifact_type: diagnostic

  - id: user_intent_amendment
    description: "User clarification or amendment to original intent"
    produced_by: orchestration-runner
    consumed_by: [workflow-planner, repo-sensemaker]
    artifact_type: diagnostic

  - id: problem_frame
    description: "Structured problem statement (problem under the problem)"
    produced_by: problem-framer
    consumed_by: [unknowns-mapper, repo-sensemaker]
    artifact_type: diagnostic

  - id: unknowns_map
    description: "Map of unknowns blocking progress"
    produced_by: unknowns-mapper
    consumed_by: [repo-sensemaker, prompt-handoff]
    artifact_type: diagnostic

  - id: repository_sensemaking_brief
    description: "Fog diagnosis and routing decision"
    produced_by: repo-sensemaker
    consumed_by: [workflow-planner, prompt-handoff, sensemaking-docs-reconciler]
    artifact_type: diagnostic
    routing_critical: true

  - id: workflow_orchestration_plan
