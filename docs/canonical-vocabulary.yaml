# Canonical Vocabulary Registry
#
# This file defines the authoritative set of enumerated values used throughout the sensemaking system.
# All skills, validators, and routing logic MUST use values from this registry.
#
# Validators accept aliases (e.g., `ui` for `ui_fog`) but normalize to the canonical form before
# storing artifacts. Downstream consumers can always expect canonical forms.

fog_types:
  - id: product_fog
    aliases: [product]
    description: "Confusion about product vision, roadmap, requirements, or user value proposition"
    examples:
      - "I'm unsure what we're building"
      - "The requirements are conflicting"
      - "We don't know what users actually need"
    routing_indicator: "Use when business logic, strategy, or requirements are unclear"

  - id: ui_fog
    aliases: [ui, ux]
    description: "Confusion about user interfaces, user experience, or interaction design"
    examples:
      - "The UI doesn't feel right but I can't articulate why"
      - "The information architecture is confusing"
      - "Users are struggling to find features"
    routing_indicator: "Use when visual, interaction, or information design is the core problem"

  - id: architecture_fog
    aliases: [architecture, system, infrastructure]
    description: "Confusion about system architecture, design patterns, structure, or infrastructure"
    examples:
      - "The codebase is hard to navigate"
      - "I don't understand the module boundaries"
      - "The tech stack choices aren't clear"
    routing_indicator: "Use when code organization, design patterns, or system structure are unclear"

  - id: docs_fog
    aliases: [docs, documentation]
    description: "Confusion caused by missing, outdated, or unclear documentation"
    examples:
      - "There's no onboarding guide"
      - "The API docs don't match the code"
      - "Decision history isn't recorded"
    routing_indicator: "Use when documentation gaps are the primary blocker"

  - id: integration_fog
    aliases: [integration, api, service]
    description: "Confusion about integrations, external APIs, or service boundaries"
    examples:
      - "The API contract is unclear"
      - "The webhook mechanism is poorly documented"
      - "Third-party dependencies have surprising behavior"
    routing_indicator: "Use when external systems or integration points are unclear"

fog_type_decision_tree:
  - step: 1
    question: "Is the confusion about what to build or why?"
    answer: "product_fog"

  - step: 2
    question: "Is the confusion about how it looks or how users interact with it?"
    answer: "ui_fog"

  - step: 3
    question: "Is the confusion about code organization, design patterns, or architecture?"
    answer: "architecture_fog"

  - step: 4
    question: "Is the confusion specifically caused by missing/wrong documentation?"
    answer: "docs_fog"

  - step: 5
    question: "Is the confusion about external systems, APIs, or integrations?"
    answer: "integration_fog"

routing_fields:
  - field: primary_fog_type
    type: enum
    values: [product_fog, ui_fog, architecture_fog, docs_fog, integration_fog]
    required: true
    description: "The dominant fog type identified in the repository"
    example: "ui_fog"

  - field: secondary_fog_types
    type: list(enum)
    values: [product_fog, ui_fog, architecture_fog, docs_fog, integration_fog]
    required: false
    description: "Other fog types present but less critical"
    example: ["docs_fog", "architecture_fog"]

  - field: recommended_workflow_id
    type: enum
    values:
      # Diagnostic & Orchestration
      - fast-path-workflow
      - full-fog-workflow
      - fast-local-diagnostic
      - full-local-sensemaking
      # Implementation
      - implementation-workflow
      - product-implementation-workflow
      - ui-implementation-workflow
      - docs-implementation-workflow
      # Strategy & Discovery
      - product-discovery-sprint
      - product-strategy-sprint
      - ui-diagnostic-workflow
      # Autonomous & Preflight
      - autonomous-sprint-preflight
      - product-autonomous-sprint
      - experimental-autonomous-sprint
      # Documentation & Maintenance
      - docs-contract-reconciliation
      - docs-architecture
      - skill-maintenance-loop
      - product-to-issues
      # Setup
      - setup-sensemaking-repo
    required: true
    description: "The workflow best suited to address this fog (must reference an existing workflow_id)"
    example: "fast-path-workflow"

  - field: routing_decision_method
    type: enum
    values:
      - diagnosis_primary_soft_context
      - diagnosis_mixed_tiebreak_to_user_intent
      - user_explicit_override
      - escalation_recommended_accepted
      - escalation_recommended_rejected
    required: true
    description: "How the routing decision was made (audit trail: what reasoning led to this workflow selection)"
    example: "diagnosis_primary_soft_context"

  - field: selected_workflow
    type: string
    required: true
    description: "Human-readable confirmation of which workflow to run"
    example: "Use fast-path-workflow to diagnose UI fog"

  - field: diagnosis_conflict
    type: boolean
    required: false
    description: "True if codebase fog differs significantly from user-implied fog"
    example: true

  - field: escalation_recommended
    type: boolean
    required: false
    description: "True if fog is complex enough to recommend human involvement"
    example: false

