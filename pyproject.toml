[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensemaking-skills"
version = "0.2.0"
description = "Agent-native framework for repository diagnosis and workflow orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dimmi Andreus", email = "dimmi.andreus1@gmail.com"}
]
keywords = ["agent", "ai", "diagnosis", "workflow", "orchestration", "repository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ThorStarlord/sensemaking-skills"
Documentation = "https://github.com/ThorStarlord/sensemaking-skills#readme"
Repository = "https://github.com/ThorStarlord/sensemaking-skills"
"Bug Tracker" = "https://github.com/ThorStarlord/sensemaking-skills/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
sensemaking = ["skills/**/*", "examples/**/*", "docs/**/*"]
