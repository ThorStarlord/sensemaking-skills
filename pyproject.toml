[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensemaking-skills"
version = "0.2.1"
description = "Agent-native framework for repository diagnosis and workflow orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.18,<5.0",
    "rfc8785>=0.1.4,<0.2",
]
license = {text = "MIT"}
authors = [
    {name = "Dimmi Andreus", email = "dimmi.andreus1@gmail.com"}
]
keywords = ["agent", "ai", "diagnosis", "workflow", "orchestration", "repository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ThorStarlord/sensemaking-skills"
Documentation = "https://github.com/ThorStarlord/sensemaking-skills#readme"
Repository = "https://github.com/ThorStarlord/sensemaking-skills"
"Bug Tracker" = "https://github.com/ThorStarlord/sensemaking-skills/issues"

[project.scripts]
sensemaking-skills = "sensemaking_skills.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensemaking_skills = ["skills/**/*", "examples/**/*", "docs/**/*"]
"sensemaking_skills.campaign_validation.schemas" = ["*.json"]
