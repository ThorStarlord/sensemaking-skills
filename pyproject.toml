[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensemaking-skills"
version = "1.0.0rc3.dev0"
description = "Agent-native Campaign control layer and repository sensemaking toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0,<7.0",
]
license = "MIT"
authors = [
    {name = "Dimmi Andreus", email = "dimmi.andreus1@gmail.com"}
]
keywords = ["agent", "ai", "diagnosis", "campaign", "sensemaking", "repository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ThorStarlord/sensemaking-skills"
Documentation = "https://github.com/ThorStarlord/sensemaking-skills#readme"
Repository = "https://github.com/ThorStarlord/sensemaking-skills"
"Bug Tracker" = "https://github.com/ThorStarlord/sensemaking-skills/issues"

[project.scripts]
sensemaking-skills = "sensemaking_skills.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = [
    "sensemaking_skills",
    "sensemaking_skills.campaign_semantics*",
    "sensemaking_skills.campaigns*",
    "sensemaking_skills.commands*",
    "sensemaking_skills.defaults*",
    "sensemaking_skills.reasoning*",
    "sensemaking_skills.semantic_architecture*",
    "sensemaking_skills.skills*",
]
exclude = [
    "sensemaking_skills.campaign_accounting*",
    "sensemaking_skills.campaign_validation*",
    "sensemaking_skills.exploratory_authorization*",
    "sensemaking_skills.exploratory_execution*",
    "sensemaking_skills.defaults.__pycache__",
    "sensemaking_skills.skills.__pycache__",
]

[tool.setuptools.package-data]
sensemaking_skills = ["skills/**/*", "skill_trees/**/*", "examples/**/*", "docs/**/*", "defaults/*.yaml"]
