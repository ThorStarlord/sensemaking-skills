# DEPRECATED (2026-08-09): this is the legacy copy of the artifact contracts.
# The canonical, authoritative file is
# skills/workflow-planner/references/artifact-contracts.yaml -- every live
# consumer (scripts, tests, docs) has been repointed there as part of the
# contract/wiring reconciliation slice. No code should read this file.
#
# It is kept (not deleted) only because it still contains required_sections/
# required_machine_fields for prd, issue_list, agent_brief, and code_patch
# (INFRA-004) that were never ported into the canonical file -- see the
# xfail-marked tests in tests/test_artifact_contracts_pm_engineering.py.
# Porting that content is deliberately out of scope for this slice. Once
# ported (or once this content is confirmed obsolete), delete this file.
#
# Artifact Contracts: Sensemaking Pipeline
# Machine-readable contracts for all artifact types produced/consumed by skills

artifacts:
  # ============================================================================
  # SPECIFICATION PIPELINE (problem → discovery → prd)
  # ============================================================================

  - id: problem_frame
    produced_by: problem-framer
    consumed_by:
      - unknowns-mapper
      - repo-sensemaker
    required_sections:
      - raw_fog
      - problem_under_the_problem
      - object_under_pressure
      - failure_mode
      - success_condition
      - what_must_be_true
      - next_artifact
    verification:
      generic_validator: "python scripts/validate-artifact.py problem_frame {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: unknowns_map
    produced_by: unknowns-mapper
    consumed_by:
      - repo-sensemaker
      - prompt-handoff
    required_sections:
      - knowns
      - unknowns
      - assumptions
      - risks
      - research_paths
      - stopping_rule
    verification:
      generic_validator: "python scripts/validate-artifact.py unknowns_map {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: repository_sensemaking_brief
    produced_by: repo-sensemaker
    consumed_by:
      - workflow-orchestrator
      - prompt-handoff
      - sensemaking-docs-reconciler
    required_sections:
      - repository_goal
      - current_shape
      - strong_signals
      - missing_pieces
      - improvement_opportunities
      - weakest_boundary
      - evidence
      - evidence_excerpts
      - why_this_boundary_matters
      - candidate_next_steps
      - recommended_next_step
      - recommended_workflow
      - machine_readable_handoff
      - ready_to_copy_prompt
    required_machine_fields:
      - recommended_workflow_id
      - recommended_execution_mode
      - weakest_boundary
      - required_inputs
    verification:
      generic_validator: "python scripts/validate-artifact.py repository_sensemaking_brief {artifact_path}"
      specialized_validators:
        - "python scripts/validate-brief.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: strategic_repository_analysis
    path: "artifacts/strategic_repository_analysis.md"
    produced_by: strategic-repository-analysis
    consumed_by:
      - user
      - workflow-planner
      - prompt-handoff
      - architectural-review
    description: "Level-3 repository evolution analysis: current system model, capability state, construction paths, qualitative comparison, decision-changing uncertainty, and strategic disposition"
    required_sections:
      - governing_intent_and_scope
      - current_system_model
      - capability_and_limitation_map
      - strategic_frontier
      - candidate_construction_paths
      - qualitative_path_comparison
      - decision_changing_uncertainty
      - strategic_synthesis
      - warranted_direction
      - authority_and_claim_boundaries
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - target_repository
      - target_source_identity
      - governing_intent
      - capability_states
      - strategic_frontier
      - construction_paths
      - path_comparison
      - decision_changing_uncertainty
      - strategic_disposition
      - selected_path_id
      - candidate_repository_responsibility
      - smallest_warranted_intervention
      - implementation_authority_established_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    recommended_machine_fields:
      - analysis_ref
      - continuity
      - decision_assumptions
      - governing_authority_refs
      - candidate_path_transition_ref
    notes:
      - "Strategic analysis is semantic-agent output; the validator does not choose, score, rank, or authorize a path."
      - "analysis_ref, continuity, decision_assumptions, governing_authority_refs, path_transitions, and candidate_path_transition_ref are additive Strategic Continuity fields; existing qualified analyses remain valid without them."
      - "continuity is semantic-agent authored; deterministic commands may project or compare it but may not infer it."
      - "Construction paths are coherent repository-evolution trajectories, not backlogs."
      - "Optional path_transitions are stable conceptual transition references for reconstruction; they are not roadmap tasks, schedules, progress fields, or automatic next actions."
      - "Numeric path scores/weights/ranking fields are forbidden; comparison is qualitative."
      - "implementation_authority_established_by_artifact and semantic_truth_established must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py strategic_repository_analysis {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-repository-analysis.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: strategic_reconciliation
    path: "artifacts/strategic_reconciliation.md"
    produced_by: strategic-repository-reconciliation
    consumed_by:
      - user
      - strategic-repository-analysis
      - owner-decision-capsule
      - thesis-review-packet
    description: "Semantic reconciliation of returned evidence against a prior strategic repository analysis"
    required_sections:
      - prior_decision_and_scope
      - returned_evidence
      - claim_updates
      - assumption_updates
      - path_continuation
      - strategic_implication
      - authority_and_claim_boundaries
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - target_repository
      - prior_analysis_ref
      - current_source_identity
      - returned_evidence
      - claim_updates
      - assumption_updates
      - path_disposition
      - prior_path_id
      - current_path_id
      - strategic_effect
      - candidate_next_responsibility
      - implementation_authority_established_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    notes:
      - "Returned evidence is semantically interpreted by the active agent; the validator never mutates strategy."
      - "Optional path_transition_effect may reconcile a declared conceptual transition without turning it into project status."
      - "candidate_next_responsibility does not establish implementation authority."
    verification:
      generic_validator: "python scripts/validate-artifact.py strategic_reconciliation {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-companion.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: owner_decision_capsule
    path: "artifacts/owner_decision_capsule.md"
    produced_by: owner-decision-capsule
    consumed_by:
      - user
      - strategic-repository-analysis
    description: "Owner-reserved decision packet with credible options, tradeoffs, reversibility, deferral, and authority consequences"
    required_sections:
      - decision_needed
      - why_repository_evidence_cannot_resolve_it
      - credible_options
      - tradeoffs_reversibility_and_deferral
      - authority_effects
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - decision_id
      - target_repository
      - decision_statement
      - repository_can_resolve
      - options
      - owner_decision_made_by_artifact
      - implementation_authority_established_by_artifact
      - created_at
      - immutable
    notes:
      - "The capsule presents an owner-reserved decision and does not select an option."
      - "owner_decision_made_by_artifact and implementation_authority_established_by_artifact must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py owner_decision_capsule {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-companion.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: thesis_review_packet
    path: "artifacts/thesis_review_packet.md"
    produced_by: thesis-review-packet
    consumed_by:
      - user
      - strategic-repository-analysis
    description: "Level-4 review packet for a challenged governing product commitment without ratifying the thesis transition"
    required_sections:
      - challenged_commitment
      - thesis_tension
      - evidence
      - affected_level3_work
      - candidate_level4_dispositions
      - downstream_reconciliation
      - authority_boundary
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - target_repository
      - level4_commitment_ref
      - challenge_statement
      - evidence_refs
      - affected_responsibilities
      - candidate_dispositions
      - downstream_reconciliation
      - owner_ratification_required
      - thesis_revision_ratified_by_artifact
      - implementation_authority_established_by_artifact
      - created_at
      - immutable
    notes:
      - "The packet supports Level-4 review; it cannot ratify REAFFIRM/REINTERPRET/REVISE/RETIRE/SUPERSEDE."
    verification:
      generic_validator: "python scripts/validate-artifact.py thesis_review_packet {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-companion.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: external_evidence_packet
    path: "artifacts/external_evidence_packet.md"
    produced_by: external-evidence-packet
    consumed_by:
      - user
      - repo-sensemaker
      - strategic-repository-analysis
      - strategic-repository-reconciliation
    description: "Bounded provenance and currentness packet for decision-relevant evidence outside repository authority"
    required_sections:
      - question_and_scope
      - sources
      - claims_supported
      - currentness_limits
      - provenance
      - authority_and_claim_boundaries
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - target_decision_ref
      - retrieved_at
      - sources
      - claims
      - repository_fact_established_by_artifact
      - semantic_truth_established
      - implementation_authority_established_by_artifact
      - created_at
      - immutable
    notes:
      - "External evidence does not become repository fact or timeless semantic truth."
      - "The packet does not perform external retrieval itself; the active agent uses authorized source surfaces."
    verification:
      generic_validator: "python scripts/validate-artifact.py external_evidence_packet {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-companion.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: multi_repository_strategic_analysis
    path: "artifacts/multi_repository_strategic_analysis.md"
    produced_by: multi-repository-strategic-analysis
    consumed_by:
      - user
      - workflow-planner
      - prompt-handoff
      - strategic-repository-reconciliation
    description: "Level-3 strategic analysis of an explicitly selected repository set, including capability ownership, boundary tensions, coherent allocation/construction paths, qualitative comparison, and disposition"
    required_sections:
      - governing_intent_scope_and_authority
      - current_multi_repository_system_model
      - capability_ownership_and_overlap_map
      - explicit_relationships_and_cross_repository_evidence
      - boundary_tensions
      - candidate_boundary_allocation_paths
      - qualitative_path_comparison
      - decision_changing_uncertainty
      - strategic_synthesis_and_warranted_direction
      - authority_and_claim_boundaries
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - analysis_ref
      - governing_intent
      - target_repositories
      - explicit_relations
      - capability_ownership
      - boundary_tensions
      - construction_paths
      - path_comparison
      - decision_changing_uncertainty
      - strategic_disposition
      - selected_path_id
      - candidate_repository_responsibility
      - affected_target_aliases
      - automatic_repository_discovery_performed
      - target_scope_expanded_by_artifact
      - implementation_authority_established_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    notes:
      - "Every repository in scope must be explicitly selected and represented in target_repositories."
      - "Existing Campaign relation classes may be reused as evidence, but this artifact does not mutate multi-target state."
      - "Capability overlap is not mechanically classified as a defect."
      - "Construction/allocation paths are qualitative strategic alternatives, not backlogs or transaction plans."
      - "automatic_repository_discovery_performed, target_scope_expanded_by_artifact, implementation_authority_established_by_artifact, and semantic_truth_established must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py multi_repository_strategic_analysis {artifact_path}"
      specialized_validators:
        - "python scripts/validate-multi-repository-strategic-analysis.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: change_impact_analysis
    path: "artifacts/change_impact_analysis.md"
    produced_by: change-impact-analysis
    consumed_by:
      - user
      - workflow-planner
      - prompt-handoff
      - output-reconciler
      - repair-verifier
      - strategic-repository-reconciliation
    description: "Evidence-grounded affected-surface analysis around a bounded contemplated or completed change, including verification/reconciliation/authority consequences and bounded follow-up responsibilities"
    required_sections:
      - change_scope_and_authority
      - impact_evidence
      - affected_surfaces
      - cross_repository_impact
      - claim_and_verification_consequences
      - bounded_follow_up_responsibilities
      - closure_effect
      - authority_and_claim_boundaries
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - analysis_ref
      - target_repository
      - target_source_identity
      - change
      - impact_items
      - cross_repository_impacts
      - claim_consequences
      - followup_responsibilities
      - closure_effect
      - automatic_repository_discovery_performed
      - change_authorized_by_artifact
      - followup_execution_authorized_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    notes:
      - "Impact materiality is semantic-agent judgment; reference occurrence does not establish material impact."
      - "The artifact may nominate bounded follow-up responsibilities but does not create a backlog or grant execution authority."
      - "Cross-repository impacts may cover only explicitly selected/authorized scope; automatic_repository_discovery_performed must remain false."
      - "change_authorized_by_artifact, followup_execution_authorized_by_artifact, and semantic_truth_established must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py change_impact_analysis {artifact_path}"
      specialized_validators:
        - "python scripts/validate-change-impact-analysis.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: discovery_findings
    produced_by: discovery
    consumed_by:
      - opportunity-tree
      - prompt-handoff
    verification:
      generic_validator: "python scripts/validate-artifact.py discovery_findings {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: domain_alignment_report
    produced_by: grill-with-docs
    consumed_by:
      - to-prd
      - prompt-handoff
    verification:
      generic_validator: "python scripts/validate-artifact.py domain_alignment_report {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  # ============================================================================
  # PM/ENGINEERING PIPELINE (prd → issues → brief → code)
  # Enhanced with detailed required_sections and required_machine_fields per INFRA-004
  # ============================================================================

  - id: prd
    produced_by: to-prd
    consumed_by:
      - to-issues
      - prompt-handoff
      - sensemaking-docs-reconciler
    required_sections:
      - executive_summary
      - user_goal
      - goal_preservation_and_expansion
      - features
      - out_of_scope
      - acceptance_criteria
      - non_functional_requirements
      - machine_readable_handoff
    required_machine_fields:
      - prd_id
      - date
      - status
      - source_intent_ref
      - user_goal_preserved_as
      - scope_expansion_proposed
      - scope_expansion_status
    verification:
      generic_validator: "python scripts/validate-artifact.py prd {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: issue_list
    produced_by: to-issues
    consumed_by:
      - triage
      - workflow-orchestrator
    required_sections:
      - prd_consumed
      - scope_status
      - issues_generated
      - release_scope
      - out_of_scope
      - machine_readable_handoff
    per_issue:
      - issue_id
      - type
      - title
      - description
      - acceptance_criteria
      - effort
      - priority
      - scope
      - dependencies
      - parallelizable
    required_machine_fields:
      - parent_prd_id
      - total_issues
      - total_effort_estimate_days
      - created_date
      - user_goal_preserved_as
      - escalation_required
    verification:
      generic_validator: "python scripts/validate-artifact.py issue_list {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: agent_brief
    produced_by: triage
    consumed_by:
      - tdd
      - workflow-orchestrator
      - prompt-handoff
    required_sections:
      - agent_brief_id
      - task
      - context
      - instructions
      - acceptance_criteria
      - expected_output
      - machine_readable_handoff
    required_machine_fields:
      - parent_issue_id
      - effort_estimate
      - required_skills
      - created_date
      - source_intent_ref
    verification:
      generic_validator: "python scripts/validate-artifact.py agent_brief {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: code_patch
    produced_by: tdd
    consumed_by:
      - verification-loop
      - workflow-orchestrator
      - handoff
    required_sections:
      - files_created
      - files_modified
      - test_summary
      - machine_readable_handoff
    required_machine_fields:
      - parent_brief_id
      - test_count
      - test_pass_count
      - test_fail_count
      - created_date
    verification:
      generic_validator: "python scripts/validate-artifact.py code_patch {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

