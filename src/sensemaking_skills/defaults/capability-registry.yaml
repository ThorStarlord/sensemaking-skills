# P6 capability metadata for deterministic campaign inspection.
#
# This file is a catalog/contract overlay, not a router. `accepted_responsibility_types`
# are explicit declarations that the active coding agent may inspect after it has
# already classified the warranted responsibility. Catalog membership, availability,
# and authority remain separate facts.
schema_version: "1"

capabilities:
  - id: repo-sensemaker
    kind: skill
    source: skills/repo-sensemaker/SKILL.md
    accepted_responsibility_types: [repository_diagnosis]
    output_artifact: repository_sensemaking_brief
    completion_conditions: [a repository_sensemaking_brief is returned to the campaign agent]
    mutates_repository: false
    authority: authorized_autonomously
    availability: external
    availability_reason: agent-native Skill; harness-specific installed availability is deferred to P10
    returns_control: true

  - id: workflow-planner
    kind: skill
    source: skills/workflow-planner/SKILL.md
