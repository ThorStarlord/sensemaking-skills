open_questions:
  - id: Q-1
    question: Should knowledge-query recording continue, and if it does, who records what a query returned?
    source: owner_intent
    blocking: false
    options:
      - option: Keep agent-written query receipts as they are
        consequence: No contract change. The reader shows gaps, but lists stay selected by each session and cannot support any statement about retrieval.
      - option: Have the query emit or append its mechanical entry
        consequence: Retrieval becomes observed and cheap to record. Needs decisions on the 120-character subject cap, on what hit_count means per operation, and on ADR 0032.
      - option: Stop requiring query receipts
        consequence: Less ceremony per session. ASSUMPTION-1 of the governing analysis stays unobservable except through staged independent sessions.
    durable_ref: docs/adr/0032-session-and-query-receipts.md
