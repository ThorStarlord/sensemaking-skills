findings:
  - id: F-1
    statement: STATUS names whether accreted knowledge is reached and changes later decisions as PATH-1's decision-changing uncertainty, and the governing analysis expects ordinary work to produce the evidence. Query receipts are the only record of retrieval, and the reader read only their misses.
    epistemic_status: OBSERVED
    evidence_refs:
      - STATUS.md
      - artifacts/history/2026-10-23-strategic-repository-analysis.md
      - scripts/summarize-receipts.py
    disposition: handed_off
  - id: F-2
    statement: At 53b667c1 the last query receipt dates from 2026-10-30. Sixteen later-dated non-merge commits changed reviewed knowledge, and 8 of 21 Steward-naming sessions left no query receipt, 3 of them after it. No receipt or report found mentions this. The reader now prints these facts.
    epistemic_status: OBSERVED
    evidence_refs:
      - .sensemaking/receipts/2026-10-30-console-ascii-report-output.query.yaml
      - scripts/summarize-receipts.py
    disposition: resolved
  - id: F-3
    statement: A staleness flag from source drift was rejected. Of 42 records with a resolvable revision anchor at 53b667c1, between 23 and 36 show a changed cited source, depending on whether added files and authority paths count. Every variant is a majority, so the flag discriminates little.
    epistemic_status: OBSERVED
    evidence_refs:
      - .sensemaking/knowledge/possibilities.json
      - skills/repository-semantic-steward/references/recall.md
    disposition: no_action
  - id: F-4
    statement: Retrieval tallies were built and withdrawn. The claim IDs a receipt lists are chosen by its session - 15 of 94 query entries with a positive hit_count list fewer IDs than that count - so a tally measures recording habits. The reviewer moved a headline from 101 to 135 with one broad entry.
    epistemic_status: OBSERVED
    evidence_refs:
