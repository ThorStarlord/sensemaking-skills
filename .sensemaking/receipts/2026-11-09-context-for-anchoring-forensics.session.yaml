findings:
  - id: F-1
    statement: context-for selects only through owned_paths owners and applicable rules. It follows no capability implemented_by link and no evidence citation. The code matches the documented contract, so this is a capability gap, not a contract defect.
    epistemic_status: OBSERVED
    evidence_refs:
      - src/sensemaking_skills/semantic_architecture/knowledge_architecture.py
      - docs/semantic-architecture/persistent-knowledge-cli.md
    disposition: open
  - id: F-2
    statement: For knowledge_store.py and knowledge_retrieval.py, context-for returns no constraint or decision and only the console ASCII guard as verification. The same index holds 3 invariants, 3 decisions and 2 verification records on cap:semantic-queries, which this owner implements.
    epistemic_status: OBSERVED
    evidence_refs:
      - .sensemaking/knowledge/stewardship.json
      - src/sensemaking_skills/semantic_architecture/knowledge_store.py
    disposition: open
  - id: F-3
    statement: Commit 06941828 (PR 594) removed the store files from component:semantic-knowledge-plane owned_paths. The tested_by links stayed on that component, so the path lost its only route to tests/test_semantic_knowledge.py. Replay of current code over both record states shows the change.
    epistemic_status: OBSERVED
    evidence_refs:
      - .sensemaking/knowledge/architecture.json
    disposition: open
  - id: F-4
    statement: A category gap is emitted only when the category is empty. rule:console-output-ascii covers src/sensemaking_skills/** and scripts/** and is tested_by one guard, so no file under those paths can report verification as NOT_ASSESSED.
    epistemic_status: DERIVED
    evidence_refs:
      - src/sensemaking_skills/semantic_architecture/knowledge_architecture.py
      - .sensemaking/knowledge/architecture.json
    disposition: open
  - id: F-5
    statement: On main a test file returns no context. With probe edits, workspace-impact listed 19 records citing the two changed files, including inv:bounded-query-disclosure, while context-for flagged 4 for the store and 0 for the test. No query lists records citing an unchanged path.
    epistemic_status: OBSERVED
    evidence_refs:
      - src/sensemaking_skills/semantic_architecture/knowledge_retrieval.py
      - src/sensemaking_skills/semantic_architecture/knowledge_store.py
    disposition: open
  - id: F-6
    statement: PR 795 head 718ea34f gives verified-component context for 9 of 14 cited test files. For tests/test_semantic_knowledge.py it returns the plane component and index-build context, not component:knowledge-store or inv:bounded-query-disclosure, with no gap for the capability-linked record.
    epistemic_status: OBSERVED
    evidence_refs:
      - .sensemaking/knowledge/stewardship.json
      - tests/test_semantic_knowledge.py
    disposition: handed_off
  - id: F-7
    statement: Source fingerprints are taken at index build. Ten of fourteen committed query receipts have indexed_ref equal to current_head and record 21 builds against 1 audit, so drift since a record was authored is rarely examined. An audit from 22d15d94 worked as documented.
    epistemic_status: OBSERVED
    evidence_refs:
      - src/sensemaking_skills/semantic_architecture/knowledge_sources.py
      - skills/repository-semantic-steward/references/recall.md
    disposition: no_action
  - id: F-8
    statement: The PATH CLI resolves to an editable install of the stale local main checkout. On the same index it omits the constraints category for worktree_context.py, exits 0 and prints the same version string as current source.
    epistemic_status: OBSERVED
    evidence_refs:
      - skills/repository-semantic-steward/SKILL.md
      - src/sensemaking_skills/semantic_architecture/knowledge_architecture.py
    disposition: handed_off
  - id: F-9
    statement: Refuted hypothesis - the CLI does not crash on or corrupt non-ASCII record text on a cp1252 pipe. cli.py escapes unencodable characters as JSON escapes. Residual - redirected JSON is in the console code page, so a strict UTF-8 reader fails when a record holds an encodable non-ASCII character.
    epistemic_status: OBSERVED
    evidence_refs:
      - src/sensemaking_skills/cli.py
      - src/sensemaking_skills/semantic_cli.py
    disposition: no_action
open_questions:
  - id: Q-1
    question: Should path-scoped context reach knowledge held on a capability the owner implements, or stay ownership-only with authors anchoring each record by hand?
    source: owner_intent
    blocking: false
    options:
      - option: Keep ownership-only selection and anchor records by hand
        consequence: No output contract change. Each ownership edit can strand links again, as PR 594 did, and nothing detects it.
      - option: Add a disclosure pointer for unlinked capability or citing records
        consequence: Additive gap entry naming record IDs without treating them as context. Changes the context-for output contract and needs sequencing with PR 795.
      - option: Follow implemented_by as a labelled hop
        consequence: The stranded invariants, decisions and tests appear as context. Risks over-attribution when one capability has several implementing components.
    durable_ref: null
