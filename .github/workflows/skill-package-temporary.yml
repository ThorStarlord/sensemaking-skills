name: Temporary Skill Package

on:
  pull_request:
    paths:
      - "skills/strategic-sensemaking-loop/**"
      - ".github/workflows/skill-package-temporary.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Validate and package Skill
        shell: bash
        run: |
          python - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          import yaml

          root = Path("skills/strategic-sensemaking-loop")
          skill = root / "SKILL.md"
          content = skill.read_text(encoding="utf-8")
          if not content.startswith("---"):
              raise SystemExit("No YAML frontmatter found")
          match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          if not match:
              raise SystemExit("Invalid frontmatter format")
          frontmatter = yaml.safe_load(match.group(1))
          if not isinstance(frontmatter, dict):
              raise SystemExit("Frontmatter must be a mapping")
          if set(frontmatter) != {"name", "description"}:
              raise SystemExit("Frontmatter must contain only name and description")
          name = frontmatter.get("name")
          description = frontmatter.get("description")
          if not isinstance(name, str) or not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name):
              raise SystemExit("Invalid Skill name")
          if not isinstance(description, str) or not description.strip() or len(description) > 1024:
              raise SystemExit("Invalid Skill description")
          required = [
              root / "agents" / "openai.yaml",
              root / "references" / "resume-and-routing-v1.md",
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Missing required bundled file: {path}")

          out = Path("skill.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root.parent))
          if out.stat().st_size > 25 * 1024 * 1024:
              raise SystemExit("skill.zip exceeds 25 MiB")
          print(f"Packaged {out} ({out.stat().st_size} bytes)")
          PY

      - name: Upload exact Skill package
        uses: actions/upload-artifact@v4
        with:
          name: strategic-sensemaking-loop-skill
          path: skill.zip
          if-no-files-found: error
