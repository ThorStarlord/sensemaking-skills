name: Actual cognitive integration stewardship (execution branch only)
on:
  push:
    branches: [claude/cognitive-integration-actual-execution-20261127]
permissions:
  contents: read
jobs:
  actual-preflight:
    if: github.ref == 'refs/heads/claude/cognitive-integration-actual-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "be4b6929a0f98cad609e32a79781b99680cf8566"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
          sensemaking-skills --version
      - name: Preflight real integration knowledge and actual application
        run: |
          set -euo pipefail
          C=artifacts/history/2026-11-27-cognitive-integration-knowledge-DRAFT.json
          CDEST=.sensemaking/knowledge/cognitive-capability-integration.json
          E=.sensemaking/proposals/execution-substitution-method-application.json
          EDEST=.sensemaking/knowledge/execution-substitution-method-application.json
          test ! -e "$CDEST" && test ! -e "$EDEST" && test ! -e "$E"
          test "$(git hash-object "$C")" = df23ffed05dd6166bd2f220146facfc401e27d6b
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$C" \
            --destination "$CDEST" --json | tee "$RUNNER_TEMP/actual-concept-detached.json"
          sensemaking-skills semantic method record --repo . \
            --episode artifacts/history/2026-11-27-execution-substitution-method-application.json \
            --output "$E" --draft-only --json | tee "$RUNNER_TEMP/actual-application-producer.json"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$E" \
            --destination "$EDEST" --json | tee "$RUNNER_TEMP/actual-application-detached.json"
          test ! -e "$CDEST" && test ! -e "$EDEST"
          cp "$C" "$CDEST"
          cp "$E" "$EDEST"
          cmp "$C" "$CDEST"
          cmp "$E" "$EDEST"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$CDEST" --json \
            | tee "$RUNNER_TEMP/actual-concept-final-path.json"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$EDEST" --json \
            | tee "$RUNNER_TEMP/actual-application-final-path.json"
          echo "CONCEPT_BLOB=$(git hash-object "$CDEST")"
          echo "APPLICATION_BLOB=$(git hash-object "$EDEST")"
          echo "APPLICATION_BASE64=$(base64 -w0 "$EDEST")"
          cp "$EDEST" "$RUNNER_TEMP/actual-application-pack.json"
          rm -- "$CDEST" "$EDEST" "$E"
          test -z "$(git status --porcelain)"
          echo "ACTUAL_STEWARDSHIP_PREFLIGHT=PASS"
      - name: Retain actual proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-cognitive-integration-stewardship
          path: ${{ runner.temp }}/actual-*.json
          if-no-files-found: warn
          retention-days: 14
