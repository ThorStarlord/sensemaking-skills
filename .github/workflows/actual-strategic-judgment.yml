name: Actual detached decision stewardship (execution branch only)
on:
  push:
    branches: [claude/strategic-judgment-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/strategic-judgment-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: "da8699c811e404b36e426381f380acd432bd33d2"
      TESTED: "26a00e84df457d7f2fd929a8086d00adeb758618"
      BASE: "051b872e5ebdd9b119469275d9bd81dbb496decc"
      PACK: ".sensemaking/knowledge/detached-decision-stewardship.json"
      REVIEW: ".sensemaking/knowledge/focused-evolution-value-review.json"
      EPISODE: "artifacts/history/2026-11-28-focused-evolution-decision-review.json"
      DRAFT: "artifacts/history/actual-focused-evolution-replay.json"
      REVIEW_SHA256: "0448550b5f4d94bd93a62b9617ac697766ad064a878e6528e6652f5c2a82a7a3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate reviewed bytes and recover actual decision and value feedback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/decision_review.py src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$TESTED:$path")"
          done
          test "$(git rev-parse "$SOURCE:.sensemaking/knowledge/focused-possibility-evolution.json")" = "$(git rev-parse "$BASE:.sensemaking/knowledge/focused-possibility-evolution.json")"
          test "$(sha256sum "$REVIEW" | cut -d' ' -f1)" = "$REVIEW_SHA256"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$REVIEW" --json > "$RUNNER_TEMP/review.json"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/feedback-check.json"
          sensemaking-skills semantic decision record --repo . --episode "$EPISODE" --draft-only --output "$DRAFT" --json > "$RUNNER_TEMP/replay.json"
          cmp "$REVIEW" "$DRAFT"
          rm "$DRAFT"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:focused-possibility-evolution --limit 80 --json > "$RUNNER_TEMP/decision-context.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:detached-decision-stewardship --limit 80 --json > "$RUNNER_TEMP/feedback-context.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          def load(n): return json.loads((p/(n+".json")).read_text())
          a,b=load("review"),load("feedback-check")
          assert a["valid"] and b["valid"] and not a["action_authorized"] and not b["action_authorized"]
          assert a["claims_checked"]==1 and a["relations_checked"]==4
          assert b["claims_checked"]==4 and b["relations_checked"]==7
          old=json.loads(subprocess.check_output(["git","show",os.environ["TESTED"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          pred=next(c for c in old["claims"] if c["kind"]=="hypothesis")
          assert pred==next(c for c in new["claims"] if c["id"]==pred["id"])
          assert old["relations"]==new["relations"][:len(old["relations"])]
          q=load("decision-context")
          e=next(x for x in q["possibility_ecology"]["value_feedback"]["entries"] if x["possibility_id"]=="poss:focused-possibility-evolution")
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          assert e["review_total"]==1 and e["predictions"][0]["standing"]=="PARTIALLY_OBSERVED"
          review=e["reviews"][0]["record"]
          attrs=review["attributes"]
          assert review["id"]=="decision:review-focused-evolution-value-20261128"
          assert attrs["disposition"]=="retain_with_limitation" and attrs["source_revision"]==os.environ["BASE"]
          assert attrs["method_ref"]=="lesson:separate-construction-from-learning-qualification-gates"
          assert attrs["assessment_refs"]==["observation:focused-possibility-evolution-20261128"]
          f=load("feedback-context")
          eco=f["possibility_ecology"]
          assert f["target_ref"]==os.environ["SOURCE"] and not f["action_authorized"]
          assert eco["focus"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          v=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:detached-decision-stewardship")
          c=next(x for x in v["predictions"] if x["prediction"]["id"]==pred["id"])
          assert c["standing"]=="PARTIALLY_OBSERVED" and c["assessment_total"]==1
          assert c["prediction"]["attributes"]["value_frame"]==pred["attributes"]["value_frame"]
          assert load("replay")["detached_draft"] and not load("replay")["inside_active_knowledge"]
          print("REVIEWED_DECISION="+json.dumps({"exact_detached_digest":os.environ["REVIEW_SHA256"],"replay_bytes_equal":True,"review_claims":a["claims_checked"],"review_relations":a["relations_checked"],"feedback_claims":b["claims_checked"],"feedback_relations":b["relations_checked"],"retrieved_review":review["id"],"review_disposition":attrs["disposition"],"original_focused_pack_unchanged":True,"original_prediction_preserved":True,"original_relations_preserved":True,"method_ref":attrs["method_ref"],"standing":c["standing"],"assessments":c["assessment_total"]}))
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-reviewed-detached-decision-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
