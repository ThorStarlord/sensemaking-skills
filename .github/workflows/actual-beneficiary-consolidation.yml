name: Actual target preflight feedback (execution branch only)
on:
  push:
    branches: [claude/beneficiary-consolidation-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/beneficiary-consolidation-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: "f350aee6c42b4b0b9ed96c830b6505bc66e81728"
      TESTED: "ab056850f053c2165613a1bc6ee1ec8abb2d391d"
      BASE: "aec0ff2eaed29c79d65ac2867aeb59fd58cd7495"
      PACK: ".sensemaking/knowledge/target-rooted-proposal-preflight.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate retained actual feedback and exact-source re-entry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test "$(git rev-parse "$SOURCE:src/sensemaking_skills/semantic_cli.py")" = "$(git rev-parse "$TESTED:src/sensemaking_skills/semantic_cli.py")"
          test "$(git rev-parse "$SOURCE:src/sensemaking_skills/semantic_architecture/stewardship_validation.py")" = "$(git rev-parse "$BASE:src/sensemaking_skills/semantic_architecture/stewardship_validation.py")"
          ROOT="$PWD"
          mkdir "$RUNNER_TEMP/unrelated"
          (cd "$RUNNER_TEMP/unrelated" && sensemaking-skills semantic knowledge-proposal-check --repo "$ROOT" --proposal "$PACK" --json) > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:target-rooted-proposal-preflight --limit 80 --json > "$RUNNER_TEMP/context.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"preflight.json").read_text())
          assert a["valid"] and not a["action_authorized"]
          assert a["claims_checked"]==4 and a["relations_checked"]==6
          old=json.loads(subprocess.check_output(["git","show",os.environ["TESTED"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          pred=next(c for c in old["claims"] if c["kind"]=="hypothesis")
          assert pred==next(c for c in new["claims"] if c["id"]==pred["id"])
          assert old["relations"]==new["relations"][:len(old["relations"])]
          q=json.loads((p/"context.json").read_text())
          eco=q["possibility_ecology"]
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          assert eco["focus"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          entry=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:target-rooted-proposal-preflight")
          c=next(x for x in entry["predictions"] if x["prediction"]["id"]==pred["id"])
          assert c["standing"]=="PARTIALLY_OBSERVED" and c["assessment_total"]==1
          assert c["prediction"]["attributes"]["value_frame"]==pred["attributes"]["value_frame"]
          print("REVIEWED_TARGET_FEEDBACK="+json.dumps({"claims":a["claims_checked"],"relations":a["relations_checked"],"original_prediction_preserved":True,"original_relations_preserved":True,"tested_cli_unchanged":True,"inspector_unchanged":True,"relative_preflight_from_unrelated_directory":True,"standing":c["standing"],"assessments":c["assessment_total"]}))
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-reviewed-target-preflight-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
