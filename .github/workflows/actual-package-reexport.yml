name: Actual reviewed package-interface feedback (execution branch only)
on:
  push:
    branches: [claude/package-reexport-evidence-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/package-reexport-evidence-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: "efa0e1688b3a79a390e6bc13dfbb9011c0ddc4f8"
      TESTED: "d0ddf702ecb4d821a003ed90be026fd6d8b94420"
      PACK: ".sensemaking/knowledge/package-interface-source-understanding.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify final reviewed pack and exact-source recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/semantic_architecture/source_relationships.py src/sensemaking_skills/semantic_architecture/verification_plan.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$TESTED:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:package-interface-source-understanding --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"preflight.json").read_text())
          assert a["valid"] and not a["action_authorized"]
          assert a["claims_checked"]==4 and a["relations_checked"]==7
          old=json.loads(subprocess.check_output(["git","show",os.environ["TESTED"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          pred=next(c for c in old["claims"] if c["kind"]=="hypothesis")
          assert pred==next(c for c in new["claims"] if c["id"]==pred["id"])
          assert old["relations"]==new["relations"][:len(old["relations"])]
          q=json.loads((p/"feedback.json").read_text())
          eco=q["possibility_ecology"]
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          assert eco["focus"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          entry=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:package-interface-source-understanding")
          c=next(x for x in entry["predictions"] if x["prediction"]["id"]==pred["id"])
          assert c["standing"]=="PARTIALLY_OBSERVED" and c["assessment_total"]==1
          assert c["prediction"]["attributes"]["value_frame"]==pred["attributes"]["value_frame"]
          print("REVIEWED_PACKAGE_INTERFACE_FEEDBACK="+json.dumps({"claims":a["claims_checked"],"relations":a["relations_checked"],"original_prediction_preserved":True,"original_relations_preserved":True,"tested_source_unchanged":True,"standing":c["standing"],"assessments":c["assessment_total"]}))
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-reviewed-package-interface-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
