name: Actual architectural evolution (execution branch only)
on:
  push:
    branches: [claude/architectural-evolution-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/architectural-evolution-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "09cca6928f49512d76d2d50d07c292460f0e67dd"
      CANDIDATE: "88c70753c98cbf196701d289b5520512aa136122"
      PACK: ".sensemaking/knowledge/paired-architectural-source-routes.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify reviewed knowledge and recover original prediction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          DIR=src/sensemaking_skills/semantic_architecture
          for path in "$DIR/source_access.py" "$DIR/source_relationships.py" src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$CANDIDATE:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:paired-architectural-source-routes --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] and not c["action_authorized"]
          assert c["claims_checked"]==4 and c["relations_checked"]==7
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          old=json.loads(subprocess.check_output(["git","show",os.environ["CANDIDATE"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          assert old["claims"][1]==new["claims"][1] and old["relations"]==new["relations"][:len(old["relations"])]
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          eco=q["possibility_ecology"]
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:paired-architectural-source-routes")
          f=e["predictions"][0]
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          candidate=next(x for x in eco["candidates"] if x["id"]=="poss:paired-architectural-source-routes")
          assert candidate["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          assert f["prediction"]["attributes"]["value_frame"]==old["claims"][1]["attributes"]["value_frame"]
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"original_prediction_preserved":True,"exact_tested_source":True,"realization":candidate["realization"]["value"]}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-architectural-evolution-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
