name: Actual focused possibility evolution and conditional reuse (execution branch only)
on:
  push:
    branches: [claude/focused-possibility-evolution-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/focused-possibility-evolution-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "2f04a8c39b9dcc693e012713d390ceff14d34de7"
      TESTED: "efbf05ecfbb9eb9e7d6152cf7dcdd6da3a821385"
      BASE: "75247e50e343f77b1e1cff2f124421bfa83c6852"
      PACK: ".sensemaking/knowledge/focused-possibility-evolution.json"
      METHOD: ".sensemaking/knowledge/fixed-target-comparison-method-application.json"
      EPISODE: "artifacts/history/2026-11-28-fixed-target-comparison-method-application.json"
      DRAFT: "artifacts/history/actual-fixed-target-application-detached.json"
      LESSON: "lesson:conditional-method-2026-11-28-fixed-target-comparison"
      OBSERVATION: "observation:method-episode-2026-11-28-fixed-target-comparison-application"
      FOCUS: "poss:focused-possibility-evolution"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact source, actual method materialization and retained feedback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/semantic_architecture/knowledge_retrieval.py src/sensemaking_skills/semantic_architecture/knowledge_store.py src/sensemaking_skills/workspace_knowledge.py src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$TESTED:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/pack.json"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$METHOD" --json > "$RUNNER_TEMP/method-pack.json"
          # Reproduce the observation from the actual episode in a disposable checkout
          # of the reviewed candidate without the existing output pack. The producer
          # rejects duplicate identifiers, including in other tracked packs.
          git worktree add --detach "$RUNNER_TEMP/method-replay" "$SOURCE"
          git -C "$RUNNER_TEMP/method-replay" rm -- "$METHOD"
          sensemaking-skills semantic method record --repo "$RUNNER_TEMP/method-replay" --episode "$EPISODE" --draft-only --output "$DRAFT" --json > "$RUNNER_TEMP/materialization.json"
          cmp "$RUNNER_TEMP/method-replay/$DRAFT" "$METHOD"
          git worktree remove --force "$RUNNER_TEMP/method-replay"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject "$FOCUS" --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          sensemaking-skills semantic method context --repo . --ref "$SOURCE" --question "How should I compare old and new implementations when the target checkout and workspace context must remain fixed?" --limit 25 --json > "$RUNNER_TEMP/method.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          def read(n): return json.loads((p/(n+".json")).read_text())
          a,b=read("pack"),read("method-pack")
          assert a["valid"] and b["valid"] and not a["action_authorized"] and not b["action_authorized"]
          assert a["claims_checked"]==4 and a["relations_checked"]==6
          assert b["claims_checked"]==1 and b["relations_checked"]==1
          prior=json.loads(subprocess.check_output(["git","show",os.environ["TESTED"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          pid="conseq:focused-possibility-evolution-value"
          pred=next(x for x in prior["claims"] if x["id"]==pid)
          assert pred==next(x for x in new["claims"] if x["id"]==pid)
          assert prior["relations"]==new["relations"][:len(prior["relations"])]
          q=read("feedback")
          eco=q["possibility_ecology"]
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          assert eco["focus"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]==os.environ["FOCUS"])
          f=next(x for x in e["predictions"] if x["prediction"]["id"]==pid)
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          assert f["prediction"]["attributes"]["value_frame"]==pred["attributes"]["value_frame"]
          replay=read("materialization")
          assert replay["created"] and replay["disposition"]=="apply" and replay["detached_draft"]
          assert not replay["method_learning_demonstrated"] and replay["proposed_claim_ids"]==[os.environ["OBSERVATION"]]
          m=read("method")
          c=next(x for x in m["method_candidates"] if x["id"]==os.environ["LESSON"])
          obs=next(x for x in c["later_related_records"] if x["id"]==os.environ["OBSERVATION"])
          attrs=obs["record"]["attributes"]
          assert obs["source_read_status"]=="INDEXED_RECORD" and attrs["method_disposition"]=="apply"
          assert attrs["procedure_before"]==attrs["procedure_after"]==c["procedure"]
          assert attrs["prior_lesson_id"]==os.environ["LESSON"]
          assert c["applicability_to_present_task"]=="NOT_ESTABLISHED"
          print("REVIEWED_EVOLUTION_AND_METHOD="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"original_prediction_preserved":True,"original_relations_preserved":True,"exact_tested_source":True,"capability_claims":a["claims_checked"],"capability_relations":a["relations_checked"],"method_claims":b["claims_checked"],"method_relations":b["relations_checked"],"materialized_application_bytes_equal":True,"later_observation":obs["id"],"method_disposition":attrs["method_disposition"],"unchanged_procedure":True,"applicability":c["applicability_to_present_task"]}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-focused-evolution-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
