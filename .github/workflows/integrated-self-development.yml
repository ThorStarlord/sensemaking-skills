name: Integrated self-development (execution branch only)
on:
  push:
    branches: [claude/integrated-self-development-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/integrated-self-development-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "cb184ceff4248bf17e2397f8ad11679d2795acd1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Review exact reconciled knowledge and recover changed possibilities
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-proposal-check --repo . \
            --proposal .sensemaking/knowledge/possibilities.json --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation possibility-ecology --subject goal:domain-general-cognitive-development \
            --limit 150 --json > "$RUNNER_TEMP/reconciled-landscape.json"
          sensemaking-skills semantic workspace-changes --repo . \
            --base-ref "abd1845f558296a7e09f733f3f62a54da1abd396" --ref "$SOURCE" --include-possibility-evolution --limit 150 --json > "$RUNNER_TEMP/possibility-evolution.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          check=json.loads((root/"preflight.json").read_text())
          assert check["valid"] is True and check["action_authorized"] is False
          print("PREFLIGHT="+json.dumps({k:check[k] for k in ("valid","claims_checked","relations_checked","existing_endpoints_checked")}))
          q=json.loads((root/"reconciled-landscape.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and q["action_authorized"] is False
          byid={c["id"]:c for c in q["claims"]}
          dg=byid["poss:domain-general-sensemaking"]
          syn=byid["poss:cross-episode-possibility-synthesis"]
          dim=dg["attributes"]["dimensions"]
          assert dim["alignment"]["value"]=="ALIGNED"
          assert dim["alignment"]["history"][-1]["value"]=="COUNTERFACTUAL"
          assert dim["realization"]["value"]=="NOT_ASSESSED"
          assert dg["attributes"]["disposition_history"][-1]["value"]=="EXPLORATORY"
          assert syn["attributes"]["dimensions"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          assert syn["attributes"]["dimensions"]["realization"]["history"][-1]["assessed_ref"]=="274e585c0a594c25235f12f34074effa1837b631"
          assert any(r["subject"]==dg["id"] and r["predicate"]=="candidate_opportunity_for" and r["object"]=="goal:domain-general-cognitive-development" for r in q["relations"])
          print("RECONCILED_ALIGNMENT="+json.dumps(dim["alignment"]))
          print("SYNTHESIS_REALIZATION="+json.dumps(syn["attributes"]["dimensions"]["realization"]))
          changes=json.loads((root/"possibility-evolution.json").read_text())
          print("CHANGE_KEYS="+json.dumps(list(changes)))
          evo=changes.get("possibility_evolution",{})
          print("EVOLUTION_KEYS="+json.dumps(list(evo)))
          print("EVOLUTION_SUMMARY="+json.dumps({k:v for k,v in evo.items() if not isinstance(v,list)})[:3000])
          def walk(o):
              if isinstance(o,dict):
                  if o.get("claim_id") in (dg["id"],syn["id"]) or o.get("id") in (dg["id"],syn["id"]):
                      print("CHANGED_POSSIBILITY="+json.dumps(o)[:4000])
                  else:
                      for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(evo)
          print("ACTUAL_RECONCILED_DEVELOPMENTAL_CONTEXT=PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Retain real query outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-self-development-context
          path: ${{ runner.temp }}/*.json
          retention-days: 14
