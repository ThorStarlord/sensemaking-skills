name: Actual conditional method retention (execution branch only)
on:
  push:
    branches: [claude/dtr-real-preflight-execution]
permissions:
  contents: read
jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "44d48bedf32cb677bb03d524b3dea4c586b0b643"
      REPOSITORY_ID: "ThorStarlord/sensemaking-skills"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact integrated source and verify reviewed bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
          test "$(git hash-object .sensemaking/knowledge/execution-substitution-method.json)" = 7820cf160cb367fc1febd8388f40a8e002c1949a
      - name: Build reviewed knowledge at exact clean canonical commit
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-build --repo . \
            --repository "$REPOSITORY_ID" --target-ref "$EXPECTED_REVISION" \
            --db "$RUNNER_TEMP/actual-method.sqlite" --include-repository-structure --json \
            | tee "$RUNNER_TEMP/actual-method-build.json"
          test -z "$(git status --porcelain)"
      - name: Retrieve actual conditional method and prior lesson
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-query --db "$RUNNER_TEMP/actual-method.sqlite" \
            --repository "$REPOSITORY_ID" --target-ref "$EXPECTED_REVISION" \
            --operation explain --subject lesson:conditional-method-2026-11-27-equivalent-execution-substitution --json \
            | tee "$RUNNER_TEMP/actual-method-explain.json"
      - name: Recover method context from actual decision question
        run: |
          set -euo pipefail
          sensemaking-skills semantic method context --repo . --ref "$EXPECTED_REVISION" \
            --question "Required canonical mechanical gate cannot execute in active environment; authorized equivalent execution context versus deferring blocked responsibility" --json \
            > "$RUNNER_TEMP/actual-method-context.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"actual-method-context.json").read_text())
          print("METHOD_CONTEXT_SUMMARY="+json.dumps({"target_ref":p.get("target_ref"),"candidate_ids":[c.get("id") for c in p.get("method_candidates",[])],"candidate_status":[{"id":c.get("id"),"applicability":c.get("applicability_to_present_task")} for c in p.get("method_candidates",[])],"semantic_truth_established":p.get("semantic_truth_established"),"action_authorized":p.get("action_authorized")}))
          PY
      - name: Retain actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-integrated-conditional-method-consumption
          path: ${{ runner.temp }}/actual-method-*.json
          if-no-files-found: warn
          retention-days: 14
