name: DTR actual proposal and history consumption (execution branch only)

on:
  push:
    branches:
      - claude/dtr-real-preflight-execution

permissions:
  contents: read

jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "6acfc86aca3efbf94c55c515c4c741bdd8a623cb"
      PRIOR_REVISION: "cf57ed488c5c2d1589409bc641632980d522e205"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual source at the exact integrated revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          git status --porcelain
      - name: Actual retained DTR proposal preflight, no repository mutation
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-proposal-check --repo . \
            --proposal artifacts/history/2026-11-27-dtr-knowledge-proposal-DRAFT.json \
            --destination .sensemaking/knowledge/developmental-trajectory-reasoning.json \
            --json | tee "$RUNNER_TEMP/dtr-proposal-preflight.json"
          test ! -e .sensemaking/knowledge/developmental-trajectory-reasoning.json
      - name: Actual first-use possibility evolution across committed revisions
        run: |
          set -euo pipefail
          sensemaking-skills semantic workspace-changes --repo . \
            --base-ref "$PRIOR_REVISION" --ref "$EXPECTED_REVISION" \
            --json --include-possibility-evolution --limit 100 \
            > "$RUNNER_TEMP/dtr-opportunity-evolution.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dtr-opportunity-evolution.json").read_text())
          projection = data.get("possibility_evolution", {})
          opportunities = projection.get("opportunities", {})
          print(json.dumps({"target_ref": data.get("target_ref"), "opportunity_count_before": projection.get("opportunity_count_before"), "opportunity_count_after": projection.get("opportunity_count_after"), "counts": opportunities.get("counts"), "truncated": projection.get("truncated"), "first_use_records": [r for group in ("added", "removed", "changed") for r in opportunities.get(group, []) if r.get("id") == "poss:verified-first-use-handoff"], "explicit_limits": projection.get("explicit_limits")}, indent=2))
          PY
      - name: Ordinary final-path preflight in disposable runner only
        run: |
          set -euo pipefail
          DRAFT=artifacts/history/2026-11-27-dtr-knowledge-proposal-DRAFT.json
          DEST=.sensemaking/knowledge/developmental-trajectory-reasoning.json
          test ! -e "$DEST"
          cp "$DRAFT" "$DEST"
          cmp "$DRAFT" "$DEST"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$DEST" --json \
            | tee "$RUNNER_TEMP/dtr-final-path-preflight.json"
          rm -- "$DEST"
          git status --porcelain
      - name: Preserve actual command output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-dtr-consumer-output
          path: ${{ runner.temp }}/dtr-*.json
          if-no-files-found: warn
          retention-days: 14
