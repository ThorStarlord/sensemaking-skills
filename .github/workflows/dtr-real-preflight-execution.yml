name: Actual strategic creativity consumer (execution branch only)
on:
  push:
    branches: [claude/dtr-real-preflight-execution]
permissions:
  contents: read
jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "0de725ee2b79f5ef1d21a08e4e4a049f8aca52d7"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact integrated product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Recover actual returning engagement context
        run: |
          set -euo pipefail
          sensemaking-skills handoff --repo . --output "$RUNNER_TEMP/real-handoff" \
            --skill-path skills/using-sensemaking --expected-source-ref "$EXPECTED_REVISION" \
            --question "Recover prior speculative and reviewed product understanding for the next valuable development" --json \
            > "$RUNNER_TEMP/actual-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"actual-handoff.json").read_text())
          ci=p["continuity"]["inventory"]
          print("HANDOFF_SUMMARY="+json.dumps({"inventory_keys": sorted(ci), "knowledge_total":ci["knowledge_files"]["total"],"history_total":ci["strategic_history"]["total"],"history_truncated":ci["strategic_history"]["truncated"],"historical_dtr_draft_exists":Path("artifacts/history/2026-11-27-dtr-knowledge-proposal-DRAFT.json").is_file(),"draft_listed":any("dtr-knowledge-proposal-DRAFT.json" in str(v) for v in ci.values()),"synthesis_listed":any("detached-possibility-stewardship-synthesis.json" in str(v) for v in ci.values()),"source_expectation":p["source_expectation"]["status"]}))
          PY
      - name: Actual assumption contrast for creative development choice
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scenarios.json" <<'JSON'
          {"scenarios":[{"id":"base"},{"id":"no-later-recall","negated":["hyp:later-sessions-consult-knowledge"]},{"id":"no-agent-control","negated":["con:agent-owns-semantic-control"]}]}
          JSON
          sensemaking-skills semantic possibility contrast --repo . --ref "$EXPECTED_REVISION" \
            --subject goal:domain-general-cognitive-development --scenarios "$RUNNER_TEMP/scenarios.json" --limit 50 --json \
            > "$RUNNER_TEMP/actual-contrast.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"actual-contrast.json").read_text())
          print("CONTRAST_SUMMARY="+json.dumps({"target_ref":p["target_ref"],"coverage":p["coverage"],"scenarios":[{"id":r["id"],"counts":r["counts"],"affected":[c["claim_id"] for c in r["affected"]],"unassessed":[c["claim_id"] for c in r["unassessed"]]} for r in p["scenario_results"]],"shared_assumptions":[{"id":x["assumption_id"],"candidates":x["candidate_ids"],"assessment":x["assessment"]} for x in p["shared_assumptions"]]}))
          PY
      - name: Retain actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-strategic-creativity-inputs
          path: ${{ runner.temp }}/actual-*.json
          if-no-files-found: warn
          retention-days: 14
