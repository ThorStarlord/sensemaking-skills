name: Actual conditional method retention (execution branch only)
on:
  push:
    branches: [claude/dtr-real-preflight-execution]
permissions:
  contents: read
jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "76d510fda3b28efd484197a6e9ebc5439d0615bc"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source and tracked episode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Materialize actual conditional method episode and preflight
        run: |
          set -euo pipefail
          DEST=.sensemaking/knowledge/execution-substitution-method.json
          test ! -e "$DEST"
          sensemaking-skills semantic method record --repo . \
            --episode artifacts/history/2026-11-27-execution-substitution-method-episode.json \
            --output "$DEST" --json | tee "$RUNNER_TEMP/actual-method-producer.json"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$DEST" --json \
            | tee "$RUNNER_TEMP/actual-method-preflight.json"
          cp "$DEST" "$RUNNER_TEMP/actual-method-pack.json"
          echo "METHOD_GIT_BLOB=$(git hash-object "$DEST")"
          echo "METHOD_BASE64=$(base64 -w0 "$DEST")"
          rm -- "$DEST"
          test -z "$(git status --porcelain)"
      - name: Retain actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-conditional-method-proposal
          path: ${{ runner.temp }}/actual-method-*.json
          if-no-files-found: warn
          retention-days: 14
