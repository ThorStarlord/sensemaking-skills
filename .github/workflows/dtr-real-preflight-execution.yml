name: DTR actual proposal and history consumption (execution branch only)

on:
  push:
    branches:
      - claude/dtr-real-preflight-execution

permissions:
  contents: read

jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "5152fa3819d07aea93b52fcff45efea9e084ad15"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact current product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Materialize actual retained synthesis
        run: |
          set -euo pipefail
          sensemaking-skills semantic possibility record --repo . \
            --episode artifacts/history/2026-11-27-detached-possibility-stewardship-synthesis.json \
            --draft-only --output .sensemaking/proposals/detached-possibility-stewardship.json --json \
            | tee "$RUNNER_TEMP/dtr-synthesis-producer.json"
          test ! -e .sensemaking/knowledge/detached-possibility-stewardship.json
          cp .sensemaking/proposals/detached-possibility-stewardship.json "$RUNNER_TEMP/dtr-synthesis-original.json"
      - name: Apply explicit agent-authored realization reconciliation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(".sensemaking/proposals/detached-possibility-stewardship.json")
          pack = json.loads(path.read_text(encoding="utf-8"))
          assert len(pack["claims"]) == 1 and pack["claims"][0]["id"] == "poss:detached-possibility-stewardship"
          claim = pack["claims"][0]
          attrs = claim["attributes"]
          assert attrs["dimensions"]["realization"]["value"] == "HYPOTHETICAL"
          evidence = "artifacts/history/2026-11-27-dtr-actual-consumption-and-promotion.md"
          claim["evidence_refs"].append("file:" + evidence)
          attrs["dimensions"]["realization"] = {
              "value": "PARTIALLY_IMPLEMENTED",
              "establishment": "observed",
              "basis": "PR 990 implements detached output and logical-destination preflight. At 6acfc86a, actual run 46009940905 passed detached and ordinary final-path checks for the retained DTR draft; PR 992 integrated the identical blob. Run 46010254201 built and queried reviewed DTR at exact canonical 5152fa38. This run materialized the actual earlier synthesis outside active knowledge. Independent consumer benefit and comparative efficiency are unestablished.",
              "observation_ref": evidence,
          }
          attrs["disposition_history"].append({
              "value": "SELECTED",
              "date": "2026-11-27",
              "authority": "agent construction selection under the owner's delegated mission",
              "source": "artifacts/history/2026-11-27-developmental-synthesis-detached-stewardship.md",
              "rationale": "The actual retained DTR draft motivated the bounded combination of existing possibility producer and reviewed semantic stewardship. PR 990 selected and built the mechanism; actual later use supports partial realization, not a new architecture or automatic promotion.",
          })
          attrs["revisit_when"] = "A later independent authorized agent recovers a detached draft and reviews or rejects it in normal product work, or the source boundary changes: file:src/sensemaking_skills/semantic_architecture/stewardship_validation.py or file:src/sensemaking_skills/possibility_synthesis.py."
          attrs["counterevidence"] = "An isolated checkout plus ordinary in-place preflight already suffices. The local host still needs compatible execution elsewhere. No observed accidental promotion or measured time saving. Retaining speculative drafts can impose maintenance cost."
          attrs["claim_ceiling"] = "Actual source-grounded synthesis, detached producer and preflight, same-agent authorized DTR review and integration, and exact-commit build/query. No independent consumer, better decisions, measured comparative benefit, longitudinal cognitive improvement or transfer is established."
          path.write_text(json.dumps(pack, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Canonical detached preflight of reconciled actual possibility
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-proposal-check --repo . \
            --proposal .sensemaking/proposals/detached-possibility-stewardship.json \
            --destination .sensemaking/knowledge/detached-possibility-stewardship.json --json \
            | tee "$RUNNER_TEMP/dtr-synthesis-preflight.json"
      - name: Ordinary final-path check and preserve reviewed candidate bytes
        run: |
          set -euo pipefail
          DRAFT=.sensemaking/proposals/detached-possibility-stewardship.json
          DEST=.sensemaking/knowledge/detached-possibility-stewardship.json
          test ! -e "$DEST"
          cp "$DRAFT" "$DEST"
          cmp "$DRAFT" "$DEST"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$DEST" --json \
            | tee "$RUNNER_TEMP/dtr-synthesis-final-preflight.json"
          cp "$DRAFT" "$RUNNER_TEMP/dtr-synthesis-reconciled.json"
          echo "DRAFT_GIT_BLOB=$(git hash-object "$DRAFT")"
          echo "DRAFT_BASE64=$(base64 -w0 "$DRAFT")"
          rm -- "$DEST" "$DRAFT"
          test -z "$(git status --porcelain)"
      - name: Preserve actual command output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-detached-possibility-synthesis
          path: ${{ runner.temp }}/dtr-*.json
          if-no-files-found: warn
          retention-days: 14
