name: DTR actual proposal and history consumption (execution branch only)

on:
  push:
    branches:
      - claude/dtr-real-preflight-execution

permissions:
  contents: read

jobs:
  actual-consumer:
    if: github.ref == 'refs/heads/claude/dtr-real-preflight-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: "0de725ee2b79f5ef1d21a08e4e4a049f8aca52d7"
      REPOSITORY_ID: "ThorStarlord/sensemaking-skills"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EXPECTED_REVISION }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact integrated product and verify reviewed bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
          test "$(git hash-object .sensemaking/knowledge/developmental-trajectory-reasoning.json)" = d10dc4633259b6e12f09a2bf9350ed32a2147d5a
          test "$(git hash-object .sensemaking/knowledge/detached-possibility-stewardship.json)" = 4041cec6275417fc4919c7377920fea2e087bafb
      - name: Build final reviewed semantic knowledge at exact clean canonical commit
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-build --repo . \
            --repository "$REPOSITORY_ID" --target-ref "$EXPECTED_REVISION" \
            --db "$RUNNER_TEMP/dtr-final.sqlite" --include-repository-structure --json \
            | tee "$RUNNER_TEMP/dtr-final-build.json"
          test -z "$(git status --porcelain)"
      - name: Recover DTR and actual synthesized possibility
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-query --db "$RUNNER_TEMP/dtr-final.sqlite" \
            --repository "$REPOSITORY_ID" --target-ref "$EXPECTED_REVISION" \
            --operation explain --subject cap:developmental-trajectory-reasoning --json \
            | tee "$RUNNER_TEMP/dtr-final-dtr-query.json"
          sensemaking-skills semantic knowledge-query --db "$RUNNER_TEMP/dtr-final.sqlite" \
            --repository "$REPOSITORY_ID" --target-ref "$EXPECTED_REVISION" \
            --operation explain --subject poss:detached-possibility-stewardship --json \
            | tee "$RUNNER_TEMP/dtr-final-possibility-query.json"
      - name: Preserve actual command output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reviewed-dtr-and-synthesis
          path: ${{ runner.temp }}/dtr-*.json
          if-no-files-found: warn
          retention-days: 14
