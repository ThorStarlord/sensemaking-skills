name: Actual prospective source and knowledge co-design (execution branch only)
on:
  push:
    branches: [claude/prospective-codesign-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/prospective-codesign-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "d1fccc17eba09cc75597d01da9ea18c624f0949d"
      BASE: "c1f95ed50a0791a57faa4e96bba2e6415df446e8"
      CANDIDATE: "44d2d695dc94e5cbf013292c201eb06e4a47bf15"
      PACK: ".sensemaking/knowledge/comparative-prospective-construction.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check reviewed synthesis and exact tested implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/patch_rehearsal.py src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "a175b9d925ae724030146e7dfc1061cc4da94ee7:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal .sensemaking/knowledge/prospective-source-knowledge-codesign.json --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:prospective-source-knowledge-codesign --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] and c["action_authorized"] is False
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and q["action_authorized"] is False
          eco=q["possibility_ecology"]
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:prospective-source-knowledge-codesign")
          f=e["predictions"][0]
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          assert eco["candidates"][0]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"realization":eco["candidates"][0]["realization"]["value"],"exact_tested_source":True}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual co-design evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-prospective-codesign
          path: ${{ runner.temp }}/*.json
          retention-days: 14
