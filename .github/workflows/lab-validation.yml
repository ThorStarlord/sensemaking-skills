name: Lab Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "requirements-lab.txt"
      - "src/sensemaking_skills/campaign_validation/**"
      - "src/sensemaking_skills/campaign_accounting/**"
      - "src/sensemaking_skills/exploratory_authorization/**"
      - "src/sensemaking_skills/exploratory_execution/**"
      - "scripts/execution_infra/**"
      - "tests/campaign_validation/**"
      - "!tests/campaign_validation/test_installed_wheel_*.py"
      - "tests/campaign_accounting/**"
      - "tests/campaign_preparation/**"
      - "tests/execution_infra_tests/**"
      - "tests/test_exploratory_*.py"
      - "tests/test_two_lane_schema_contracts.py"
      - "experiments/**"
      - "docs/experiments/**"
      - ".github/workflows/lab-validation.yml"
  push:
    branches: [main]
    paths:
      - "requirements-lab.txt"
      - "src/sensemaking_skills/campaign_validation/**"
      - "src/sensemaking_skills/campaign_accounting/**"
      - "src/sensemaking_skills/exploratory_authorization/**"
      - "src/sensemaking_skills/exploratory_execution/**"
      - "scripts/execution_infra/**"
      - "tests/campaign_validation/**"
      - "!tests/campaign_validation/test_installed_wheel_*.py"
      - "tests/campaign_accounting/**"
      - "tests/campaign_preparation/**"
      - "tests/execution_infra_tests/**"
      - "tests/test_exploratory_*.py"
      - "tests/test_two_lane_schema_contracts.py"
      - "experiments/**"
      - "docs/experiments/**"
      - ".github/workflows/lab-validation.yml"

jobs:
  retained-lab-linux:
    name: Retained research lab (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core metadata and source-only lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "click>=8.1.0" "PyYAML>=6.0,<7.0" -r requirements-lab.txt

      - name: Two-Lane and exploratory lab suites
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            tests/campaign_validation \
            --ignore-glob="tests/campaign_validation/test_installed_wheel_*.py" \
            tests/test_two_lane_schema_contracts.py \
            tests/test_exploratory_digests.py \
            tests/test_exploratory_lane_derivation.py \
            tests/test_exploratory_capability_lifecycle.py \
            tests/campaign_accounting \
            tests/campaign_preparation \
            tests/execution_infra_tests \
            -q

      - name: Assert lab tests did not create operative experiment state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::lab tests dirtied tracked repository state"
            exit 1
          }
          test ! -e "experiments/campaigns/EXP-0001-stage1-auteur-autonomy-pilot/ledger.jsonl" || exit 1
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/ledger.jsonl" || exit 1

  retained-lab-windows:
    name: Retained lab path confinement (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core metadata and source-only lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "click>=8.1.0" "PyYAML>=6.0,<7.0" -r requirements-lab.txt

      - name: Historical Windows confinement proofs
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/campaign_accounting/test_artifact_path_confinement.py -q
          python -m pytest tests/campaign_accounting/test_artifact_path_confinement_windows.py -q
