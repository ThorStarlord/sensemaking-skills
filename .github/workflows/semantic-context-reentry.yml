      - name: Read committed source-overlap review packet for the actual PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PR changes are relative to merge-base, NOT the moving main tip.
          # Otherwise a diverged head wrongly includes changes made on main.
          git fetch --no-tags --depth=64 origin "$REVIEW_BASE" "$REVIEW_HEAD"
          if ! REVIEW_START="$(git merge-base "$REVIEW_BASE" "$REVIEW_HEAD")"; then
            git fetch --no-tags --unshallow origin
            REVIEW_START="$(git merge-base "$REVIEW_BASE" "$REVIEW_HEAD")"
          fi
          test -n "$REVIEW_START"
          export REVIEW_START
          sensemaking-skills semantic workspace-review-context \
            --repo . --repository ThorStarlord/sensemaking-skills \
            --base-ref "$REVIEW_BASE" --ref "$REVIEW_HEAD" --pr-merge-base \
            --index-dir "$RUNNER_TEMP/committed-review-index" \
            --max-paths 8 --limit 25 --json > "$RUNNER_TEMP/review-context.json"
          # Opt-in prospective review uses the identical committed Git scope;
          # no candidate is automatically selected or semantically reclassified.
          sensemaking-skills semantic workspace-review-context \
            --repo . --repository ThorStarlord/sensemaking-skills \
            --base-ref "$REVIEW_BASE" --ref "$REVIEW_HEAD" --pr-merge-base \
            --include-candidates --index-dir "$RUNNER_TEMP/committed-review-index" \
            --max-paths 8 --limit 25 --json > "$RUNNER_TEMP/candidate-review.json"
          # Same PR baseline for authored knowledge changes, not the moving base tip.
          sensemaking-skills semantic workspace-changes \
            --repo . --repository ThorStarlord/sensemaking-skills \
            --base-ref "$REVIEW_BASE" --ref "$REVIEW_HEAD" --pr-merge-base \
            --index-dir "$RUNNER_TEMP/committed-review-index" \
            --limit 25 --json > "$RUNNER_TEMP/pr-semantic-changes.json"
          REVIEW_PACKET="$RUNNER_TEMP/review-context.json" \
          CHANGE_PACKET="$RUNNER_TEMP/pr-semantic-changes.json" \
          CANDIDATE_PACKET="$RUNNER_TEMP/candidate-review.json" python - <<'PY'
          import json
          import os
          import subprocess

          with open(os.environ['REVIEW_PACKET'], encoding='utf-8') as stream:
              packet = json.load(stream)
          with open(os.environ['CHANGE_PACKET'], encoding='utf-8') as stream:
              changes = json.load(stream)
          with open(os.environ['CANDIDATE_PACKET'], encoding='utf-8') as stream:
              candidate_review = json.load(stream)
          comparison = changes['workspace_comparison']
          scope = packet['review_scope']
          overlap = packet['committed_evidence_reinspection']
          assert comparison['base_ref'] == packet['base_ref']
          assert comparison['target_ref'] == packet['target_ref']
          assert comparison['base_tip_ref'] == os.environ['REVIEW_BASE']
          assert comparison['comparison_mode'] == 'pr_merge_base'
          assert comparison['merge_base_calculated'] is True
          assert comparison['git_ancestry_assessed'] is True
          assert changes['workspace_base_index']['indexed_ref'] == packet['base_ref']
          assert changes['semantic_truth_established'] is False
          assert changes['action_authorized'] is False
          assert packet['base_ref'] == os.environ['REVIEW_START']
          assert packet['target_ref'] == os.environ['REVIEW_HEAD']
          assert scope['base_tip_ref'] == os.environ['REVIEW_BASE']
          assert scope['comparison_mode'] == 'pr_merge_base'
          assert scope['merge_base_calculated'] is True
          assert scope['git_ancestry_assessed'] is True
          assert overlap['source_ref'] == packet['base_ref']
          assert overlap['compared_ref'] == packet['target_ref']
          assert overlap['changed_path_total'] == scope['source_overlap_paths_assessed']
          assert len(packet['contexts']) == min(
              scope['changed_paths_with_valid_context'], scope['max_paths'],
          )
          assert overlap['affected_record_total'] >= len(overlap['affected_records'])
          assert overlap['uncited_changed_path_total'] >= len(overlap['uncited_changed_paths'])
          assert all('committed_change_relevance' in item['context'] for item in packet['contexts'])
          assert packet['semantic_truth_established'] is False
          assert packet['action_authorized'] is False

          assert 'candidate_reinspection' not in packet['product_outline']
          assert 'candidate_opportunities' not in packet['product_outline']['goals'][0]
          assert candidate_review['base_ref'] == packet['base_ref']
          assert candidate_review['target_ref'] == packet['target_ref']
          assert candidate_review['review_scope']['candidate_source_overlap_assessed'] is True
          assert candidate_review['semantic_truth_established'] is False
          assert candidate_review['action_authorized'] is False
          prospect = candidate_review['product_outline']
          summary = prospect['candidate_reinspection']
          assert summary['candidate_edges_omitted'] == (
              prospect['omitted_counts']['candidate_opportunity_edges']
              + prospect['omitted_counts']['indirect_candidate_opportunity_edges']
          )
          visible = [
              item for goal in prospect['goals']
              for key in ('candidate_opportunities', 'indirect_candidate_opportunities')
              for item in goal.get(key, [])
          ]
          assert summary['visible_candidate_edge_total'] == len(visible)
          assert summary['changed_source_candidate_edge_total'] == sum(
              item['committed_change_reinspection']['reinspection_candidate']
              for item in visible
          )
          assert summary['semantic_change_established'] is False
          chosen = next(
              item for item in visible
              if item['claim_id'] == 'poss:construction-time-possibility-reconciliation'
          )
          source_review = chosen['committed_change_reinspection']
          # PR #848 touched this candidate's supporting doc. Later PRs may not.
          # Check the recorded overlap against THIS PR's exact committed diff.
          changed = set(
              subprocess.check_output([
                  'git', 'diff', '--no-ext-diff', '--no-textconv',
                  '--no-renames', '--ignore-submodules=all', '--name-only', '-z',
                  packet['base_ref'], packet['target_ref'], '--',
              ]).decode('utf-8', errors='replace').split('\0')
          ) - {''}
          cited = set(source_review['changed_cited_paths'])
          containers = set(source_review['changed_record_containers'])
          supporting = set(source_review['changed_supporting_paths'])
          assert cited <= changed
          assert cited == containers | supporting
          assert not containers & supporting
          assert source_review['reinspection_candidate'] == bool(cited)
          supported_path = 'docs/semantic-architecture/persistent-knowledge-cli.md'
          assert (supported_path in supporting) == (supported_path in changed)
          assert source_review['unfingerprinted_record_count'] == 0
          assert source_review['semantic_change_established'] is False
          print(json.dumps({
              'consumer': 'committed-prospective-reinspection',
              'source_ref': candidate_review['base_ref'],
              'target_ref': candidate_review['target_ref'],
              'visible_candidate_edges': summary['visible_candidate_edge_total'],
              'source_overlap_candidate_edges': summary['changed_source_candidate_edge_total'],
              'candidate_omissions': summary['candidate_edges_omitted'],
              'independent_agent_benefit_established': False,
          }, sort_keys=True))
          print(json.dumps({
              'consumer': 'committed-source-evidence-review',
              'source_ref': packet['base_ref'],
              'pr_base_tip': os.environ['REVIEW_BASE'],
              'target_ref': packet['target_ref'],
              'changed_paths': scope['changed_paths_total'],
              'uncited_changed_paths': overlap['uncited_changed_path_total'],
              'affected_reviewed_records': overlap['affected_record_total'],
              'truncated': packet['truncated'],
              'review_packet_valid': True,
              'semantic_delta_baseline_aligned': True,
              'agent_benefit_established': False,
          }, sort_keys=True))
          PY
