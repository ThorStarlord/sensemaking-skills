          import json
          import os
          import pathlib
          import subprocess

          def load(name):
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
              with path.open(encoding="utf-8") as stream:
                  return json.load(stream)

          def cli(*args):
              return subprocess.run(
                  ["sensemaking-skills", *args],
                  capture_output=True,
                  text=True,
              )

          def close_fixture(name, decision_commit, source_revision, disposition="CONFIRMED"):
              path = pathlib.Path(".sensemaking") / f"{name}.json"
              data = {
                  "trial_id": "anchored-close",
                  "actor": "hosted-mechanical-check",
                  "source_revision": source_revision,
                  "decision_commit": decision_commit,
                  "observed_outcome": "negative fixture",
                  "disposition": disposition,
                  "evidence_refs": ["file:README.md"],
                  "claim_ceiling": "negative fixture only",
              }
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              subprocess.run(["git", "add", "--", str(path)], check=True)
              return path

