          retained = load("method-trial-retained.json")
          legacy = load("method-trial-legacy.json")
          assert opened["code"] == "SEMANTIC_METHOD_TRIAL_OPENED"
          assert opened["review_state"] == "UNREVIEWED_DRAFT"
          assert opened["method_effect_established"] is False
          assert len(opened["trial_digest"]) == 64
          assert opened["evidence_paths_not_in_source_revision"] == [os.environ["EPISODE"]]
          assert retained["closed"] is True
          assert retained["trial_decision"]["id"] == os.environ["RETAINED"]
          assert retained["result"]["disposition"] == "CONFIRMED"
          assert retained["trial_digest_match"] == "MATCH"
          assert retained["result_digest_match"] == "MATCH"
          assert retained["trial_chronology"] == "VERIFIED"
          assert retained["predecision_commitment_preserved"] is True
          assert retained["method_effect_established"] is False
          assert retained["semantic_truth_established"] is False
          assert retained["action_authorized"] is False
          assert legacy["closed"] is True
          assert legacy["trial_digest_match"] == "NOT_ASSESSED"
          assert legacy["predecision_commitment_preserved"] is False

          truncated = cli(
              "semantic", "method", "trial", "show", "--repo", ".", "--ref",
              os.environ["REF"], "--trial", os.environ["RETAINED"], "--limit", "1",
          )
          assert truncated.returncode != 0
          assert "truncated" in (truncated.stdout + truncated.stderr).lower()

          duplicate = cli(
              "semantic", "method", "trial", "close", "--repo", ".",
              "--episode", os.environ["RESULT_EPISODE"],
              "--output", ".sensemaking/knowledge/ci-trial-duplicate.json",
          )
          assert duplicate.returncode != 0
          assert "already exists" in (duplicate.stdout + duplicate.stderr)

          decision_commit = retained["result"]["decision_commit"]
          fixtures = []
          same = close_fixture("ci-trial-same-revision", os.environ["REF"], os.environ["REF"])
          fixtures.append(same)
          result = cli(
              "semantic", "method", "trial", "close", "--repo", ".",
              "--episode", same.as_posix(), "--output", ".sensemaking/knowledge/ci-trial-same.json",
          )
          assert result.returncode != 0
          assert "must be later" in (result.stdout + result.stderr)

          ancestor = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          older = close_fixture("ci-trial-non-descendant", os.environ["REF"], ancestor)
          fixtures.append(older)
          result = cli(
              "semantic", "method", "trial", "close", "--repo", ".",
              "--episode", older.as_posix(), "--output", ".sensemaking/knowledge/ci-trial-older.json",
          )
          assert result.returncode != 0
          assert "must descend" in (result.stdout + result.stderr)

          adapted = close_fixture(
              "ci-trial-adapted", decision_commit, os.environ["REF"], "ADAPTED",
          )
          fixtures.append(adapted)
          result = cli(
              "semantic", "method", "trial", "close", "--repo", ".",
              "--episode", adapted.as_posix(), "--output", ".sensemaking/knowledge/ci-trial-adapted.json",
