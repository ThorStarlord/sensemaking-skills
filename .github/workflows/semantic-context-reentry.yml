      - name: Review actual checkout changes before commit (mechanical consumer)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Use a disposable change to the checked-out real repository. The
          # staged file is restored to HEAD bytes in the worktree, so Git's
          # ordinary working diff alone would miss its changed INDEX entry.
          TARGET="docs/cli-reference.md"
          UNTRACKED=".sensemaking/precommit-review-ci-only.txt"
          cp "$TARGET" "$RUNNER_TEMP/precommit-original.md"
          printf '\nCI stage-only index entry\n' >> "$TARGET"
          git add -- "$TARGET"
          cp "$RUNNER_TEMP/precommit-original.md" "$TARGET"
          printf 'temporary untracked path\n' > "$UNTRACKED"
          REF="$(git rev-parse HEAD)"
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --include-worktree \
            --max-paths 32 --limit 25 --json \
            > "$RUNNER_TEMP/precommit-worktree-review.json"
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --max-paths 32 --limit 25 \
            --json > "$RUNNER_TEMP/precommit-committed-only.json"
          # One context slot: a staged source edit must outrank an untracked
          # path that sorts before it. Alphabetical selection used to give the
          # slot to the untracked file.
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --include-worktree \
            --max-paths 1 --limit 25 --json \
            > "$RUNNER_TEMP/precommit-priority-review.json"
          # Explicit path scope must inspect only the named staged and
          # untracked paths, without applying --max-paths selection.
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --include-worktree \
            --path "$TARGET" --path "$UNTRACKED" --json \
            > "$RUNNER_TEMP/explicit-review.json"
          MISSING="src/does-not-exist-ci-only.py"
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --include-worktree \
            --path "$MISSING" --json > "$RUNNER_TEMP/missing-review.json"
          IGNORED=".pytest_cache/precommit-ci-ignored.txt"
          mkdir -p .pytest_cache
          printf 'ignored\n' > "$IGNORED"
          sensemaking-skills semantic workspace-review-context \
            --base-ref "$REF" --ref "$REF" --repo . --include-worktree \
            --path "$IGNORED" --json > "$RUNNER_TEMP/ignored-review.json"
          REVIEW="$RUNNER_TEMP/precommit-worktree-review.json" \
          COMMITTED="$RUNNER_TEMP/precommit-committed-only.json" \
          PRIORITY="$RUNNER_TEMP/precommit-priority-review.json" \
          EXPLICIT="$RUNNER_TEMP/explicit-review.json" \
          MISSING_REVIEW="$RUNNER_TEMP/missing-review.json" \
          IGNORED_REVIEW="$RUNNER_TEMP/ignored-review.json" \
          MISSING="$MISSING" IGNORED="$IGNORED" \
          TARGET="$TARGET" UNTRACKED="$UNTRACKED" REF="$REF" python - <<'PY'
          import json
          import os
          with open(os.environ["REVIEW"], encoding="utf-8") as stream:
              result = json.load(stream)
          with open(os.environ["COMMITTED"], encoding="utf-8") as stream:
              only_committed = json.load(stream)
          with open(os.environ["PRIORITY"], encoding="utf-8") as stream:
              priority = json.load(stream)
          target, untracked = os.environ["TARGET"], os.environ["UNTRACKED"]
          assert result["code"] == "SEMANTIC_WORKTREE_REVIEW_CONTEXT"
          assert result["target_ref"] == result["base_ref"] == os.environ["REF"]
          assert result["review_scope"]["review_mode"] == "committed_plus_worktree"
          assert result["review_scope"]["combined_representable_path_count"] == 2
          assert result["review_scope"]["worktree_changed_paths_total"] == 2
          assert result["review_scope"]["working_changes_indexed"] is False
          assert result["committed_evidence_reinspection"]["changed_path_total"] == 0
          assert result["working_evidence_reinspection"]["changed_path_total"] == 2
          paths = {item["path"]: item for item in result["contexts"]}
          assert set(paths) == {target, untracked}, paths
          assert all(item["change_modes"] == ["worktree"] for item in paths.values())
          assert all("change_relevance" in item["context"] for item in paths.values())
          assert all("committed_change_relevance" not in item["context"]
                     for item in paths.values())
          assert result["workspace_context"]["uncommitted_changes_not_indexed"] is True
          assert result["semantic_truth_established"] is False
          assert result["action_authorized"] is False
          assert only_committed["code"] == "SEMANTIC_COMMITTED_REVIEW_CONTEXT"
          assert only_committed["contexts"] == []
          assert only_committed["committed_evidence_reinspection"]["changed_path_total"] == 0
          priority_scope = priority["review_scope"]
          assert priority_scope["selection_order"] == [
              "committed", "staged", "unstaged", "untracked",
          ], priority_scope
          assert priority_scope["selected_paths"] == [target], priority_scope
          assert priority_scope["omitted_path_count"] == 1, priority_scope
          with open(os.environ["EXPLICIT"], encoding="utf-8") as stream:
              explicit = json.load(stream)
          explicit_scope = explicit["review_scope"]
          assert explicit_scope["review_mode"] == "explicit_paths_plus_worktree"
          assert explicit_scope["scope_mode"] == "explicit_paths"
          assert explicit_scope["max_paths_applied"] is False
          assert explicit_scope["selected_paths"] == [target, untracked]
          assert explicit_scope["changed_requested_paths"] == sorted([target, untracked])
          assert explicit_scope["unchanged_requested_paths"] == []
          assert explicit_scope["omitted_path_count"] == 0
          assert explicit_scope["worktree_changed_paths_total"] == 2
          assert explicit_scope["other_changes_assessed"] is False
          explicit_contexts = {item["path"]: item for item in explicit["contexts"]}
          assert set(explicit_contexts) == {target, untracked}
          assert all(item["change_modes"] == ["worktree"]
                     for item in explicit_contexts.values())
          assert any("Explicit-path review inspects only the requested paths" in limit
                     for limit in explicit["explicit_limits"])
          with open(os.environ["MISSING_REVIEW"], encoding="utf-8") as stream:
              missing = json.load(stream)
          missing_scope = missing["review_scope"]
          missing_path = os.environ["MISSING"]
          assert missing_scope["not_found_requested_paths"] == [missing_path]
          assert missing_scope["unchanged_requested_paths"] == []
          assert missing_scope["changed_requested_paths"] == []
          assert missing_scope["selected_paths"] == [missing_path]
          with open(os.environ["IGNORED_REVIEW"], encoding="utf-8") as stream:
              ignored = json.load(stream)
          ignored_scope = ignored["review_scope"]
          ignored_path = os.environ["IGNORED"]
          assert ignored_scope["ignored_requested_paths"] == [ignored_path]
          assert ignored_scope["unchanged_requested_paths"] == []
          assert ignored_scope["not_found_requested_paths"] == []
          assert ignored_scope["changed_requested_paths"] == []
          assert ignored_scope["selected_paths"] == [ignored_path]
          print("Live precommit review includes staged-only and untracked paths; no cognitive claim.")
          print("One context slot goes to the staged edit, not the earlier-sorting untracked path.")
          print("Explicit review scope inspects only the requested paths; others are NOT_ASSESSED.")
          print("A nonexistent requested path is reported as not found, not unchanged.")
          print("An ignored working-tree path is reported as ignored, not unchanged.")
          PY
          git reset -q -- "$TARGET"
          rm -- "$UNTRACKED"
          rm -f -- "$IGNORED"
          test -z "$(git status --porcelain)"
