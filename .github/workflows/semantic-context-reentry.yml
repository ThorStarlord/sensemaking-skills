name: Semantic Context Re-entry

# A real exact-commit knowledge-build -> knowledge-query consumer for the
# source-to-decision links repaired in PRs #691-#693. This does not measure
# agent cognition, establish semantic truth, or authorize implementation.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.sensemaking/knowledge/**'
      - 'src/sensemaking_skills/semantic_architecture/**'
      - 'src/sensemaking_skills/semantic_cli.py'
      - 'src/sensemaking_skills/method_adaptation.py'
      - 'src/sensemaking_skills/decision_review.py'
      - 'src/sensemaking_skills/workspace_knowledge.py'
      - 'src/sensemaking_skills/workflow_availability.py'
      - 'skills/strategic-repository-analysis/**'
      - 'skills/repository-semantic-steward/**'
      - '.github/workflows/semantic-context-reentry.yml'

permissions:
  contents: read

jobs:
  source-pinned-context:
    name: Source-pinned context consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Method-trial show verifies decision/result ancestry, which needs
          # the decision commit and its path to the result revision.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install this exact repository revision
        run: python -m pip install -e .
      - name: Re-enter reviewed methodological experience (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          sensemaking-skills semantic method context \
            --question "method adaptation construction qualification gates" \
            --repo . --ref "$REF" --json > "$RUNNER_TEMP/method-context.json"
          sensemaking-skills semantic method record --help > /dev/null
          METHOD_RESULT="$RUNNER_TEMP/method-context.json" METHOD_REF="$REF" python - <<'PY'
          import json
          import os
          with open(os.environ["METHOD_RESULT"], encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["code"] == "SEMANTIC_METHOD_CONTEXT"
          assert result["target_ref"] == os.environ["METHOD_REF"]
          assert result["semantic_truth_established"] is False
          assert result["action_authorized"] is False
          methods = {item["id"]: item for item in result["method_candidates"]}
          precedent = methods["lesson:separate-construction-from-learning-qualification-gates"]
          assert precedent["procedure"]
          assert precedent["applicability_to_present_task"] == "NOT_ESTABLISHED"
          assert precedent["authority_ref"]
          assert any(row["id"] == "observation:construction-gate-application-20261118"
                     for row in precedent["later_related_records"])
          assert any(row["id"] == "decision:review-2026-11-22-local-memory-consequence-review"
                     for row in precedent["later_related_records"])
          assert precedent["recall_conditions"]["scope"] != "NOT_RECORDED"
          assert precedent["recall_conditions"]["claim_ceiling"] != "NOT_RECORDED"
          assert any(row["id"] == "observation:pr898-construction-qualification-selection-20261117"
                     and row["predicate"] == "learned_from"
                     for row in precedent["source_records"])
          assert precedent["procedure_change"]["method_before"] == "NOT_RECORDED"
          assert precedent["related_records_complete"] is True
          adaptation = methods.get("lesson:method-adaptation-check-procedure-not-only-outcome")
          assert adaptation is not None
          assert adaptation["recall_conditions"]["counterevidence"] != "NOT_RECORDED"
          assert adaptation["recall_conditions"]["original_outcome"] != "NOT_RECORDED"
          assert any(row["id"] == "observation:method-adaptation-closure-overreach-20261119"
                     and row["predicate"] == "learned_from"
                     for row in adaptation["source_records"])
          episode = next(row for row in adaptation["later_related_records"]
                         if row["id"] == "observation:method-episode-2026-11-22-decision-review-standing-method")
          assert episode["record"]["attributes"]["decision_ref"] == (
              "decision:method-adaptation-classification-20261122"
          )
          assert adaptation["related_records_complete"] is True
          assert result["lesson_corpus_truncated"] is False
          print("Reviewed method context is consumer-readable; agent method learning not evaluated.")
          PY
      - name: Exercise method-context provenance completeness (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sensemaking_skills.method_adaptation import method_context

          lesson = {
              "id": "lesson:ci-provenance-contract",
              "kind": "lesson",
              "statement": "CI provenancecontract method.",
              "authority_kind": "document",
              "authority_ref": "docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md",
              "evidence_refs": [
                  "file:docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md"
              ],
              "epistemic_status": "declared",
              "attributes": {"method": "Use provenancecontract for mechanical verification only."},
          }
          incident = {
              "id": "incident:ci-provenance-source",
              "kind": "incident",
              "statement": "CI incident source.",
              "authority_kind": "document",
              "authority_ref": "docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md",
              "evidence_refs": [
                  "file:docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md"
              ],
              "epistemic_status": "declared",
              "attributes": {},
          }
          relation = {
              "id": "rel:ci-provenance-contract-learned-from",
              "subject": "lesson:ci-provenance-contract",
              "predicate": "learned_from",
              "object": "incident:ci-provenance-source",
              "evidence_refs": [
                  "file:docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md"
              ],
              "epistemic_status": "declared",
          }
          initial = {
              "claims": [lesson, incident],
              "repository": "ci-provenance-contract",
              "target_ref": "0" * 40,
          }

          def indexed_explain(_):
              return {"claims": [lesson, incident], "relations": [relation], "truncated": False}

          indexed = method_context("provenancecontract", initial, indexed_explain, limit=1)
          candidate = indexed["method_candidates"][0]
          assert candidate["related_records_complete"] is True
          assert any(
              row["id"] == "incident:ci-provenance-source" and row["kind"] == "incident"
              for row in candidate["source_records"]
          )

          def truncated_explain(_):
              return {"claims": [], "relations": [], "truncated": True}

          truncated = method_context("provenancecontract", initial, truncated_explain, limit=1)
          assert truncated["method_candidates"][0]["related_records_complete"] is False
          print("Method-context provenance completeness contract is enforced; no cognitive claim.")
          PY
      - name: Product-outline selection context includes method precedents (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          sensemaking-skills semantic workspace-query --repo . --ref "$REF" \
            --operation product-outline --include-candidates \
            --method-question "method adaptation construction qualification gates" --json \
            > "$RUNNER_TEMP/product-method-context.json"
          PRODUCT_RESULT="$RUNNER_TEMP/product-method-context.json" PRODUCT_REF="$REF" python - <<'PY'
          import json
          import os
          with open(os.environ["PRODUCT_RESULT"], encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["code"] == "SEMANTIC_KNOWLEDGE_QUERY"
          assert result["target_ref"] == os.environ["PRODUCT_REF"]
          assert result["semantic_truth_established"] is False
          assert result["action_authorized"] is False
          assert result["product_outline"]["goals"]
          methods = {item["id"]: item for item in result["method_precedents"]["method_candidates"]}
          precedent = methods["lesson:separate-construction-from-learning-qualification-gates"]
          assert precedent["applicability_to_present_task"] == "NOT_ESTABLISHED"
          assert precedent["recall_conditions"]["scope"] != "NOT_RECORDED"
          assert result["method_precedents"]["action_authorized"] is False
          print("Product-outline method precedents are consumer-readable; no selection.")
          PY
      - name: Exercise method source-path and draft producer contracts (no learning claim)
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          sensemaking-skills semantic method context \
            --question "Which decision procedure helps with this responsibility?" \
            --path docs/adr/0035-sensemaking-continuous-learning.md \
            --repo . --ref "$REF" --json > "$RUNNER_TEMP/method-path-context.json"
          METHOD_PATH_RESULT="$RUNNER_TEMP/method-path-context.json" METHOD_REF="$REF" python - <<'PY'
          import json
          import os
          with open(os.environ["METHOD_PATH_RESULT"], encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["target_ref"] == os.environ["METHOD_REF"]
          candidate = next(item for item in result["method_candidates"]
                           if item["id"] == "lesson:separate-construction-from-learning-qualification-gates")
          routes = [reason for entry in candidate["matched_paths"]
                    for reason in entry["routes"]]
          assert "AUTHORED_SOURCE_REF" in routes
          assert candidate["applicability_to_present_task"] == "NOT_ESTABLISHED"
          assert result["action_authorized"] is False
          PY

          # A disposable, explicitly non-evidential fixture validates the
          # write-side contract. It is not an autonomous learning episode and
          # MUST NOT be committed, indexed as history, or cited as learning.
          EPISODE=".sensemaking/method-contract-ci-fixture.json"
          PROPOSAL=".sensemaking/knowledge/method-contract-ci-fixture.json"
          METHOD_REF="$REF" METHOD_EPISODE="$EPISODE" python - <<'PY'
          import json
          import os
          payload = {
              "episode_id": "ci-contract-fixture",
              "actor": "CI mechanical contract fixture; not an autonomous learning agent",
              "source_revision": os.environ["METHOD_REF"],
              "decision": "Check the optional write-side method-record interface, not a genuine method decision",
              "disposition": "reject",
              "procedure_before": "",
              "procedure_after": "",
              "observed_result": "Synthetic input for mechanical verification only; no method was independently chosen",
              "scope": "CI producer contract, never cognitive learning evidence",
              "conditions": "",
              "counterevidence": "NOT_ASSESSED",
              "revisit_when": "",
              "claim_ceiling": "No genuine episode, decision-time reuse, learned method or improved competence",
              "evidence_refs": ["file:docs/normal-use/2026-11-17-construction-vs-qualification-selection-lesson.md"],
              "prior_lesson_id": "lesson:separate-construction-from-learning-qualification-gates",
              "decision_ref": "decision:review-2026-11-22-local-memory-consequence-review",
          }
          with open(os.environ["METHOD_EPISODE"], "w", encoding="utf-8") as stream:
              json.dump(payload, stream)
          PY
          git add "$EPISODE"
          sensemaking-skills semantic method record \
            --repo . --episode "$EPISODE" --output "$PROPOSAL" --json \
            > "$RUNNER_TEMP/method-record-output.json"
          METHOD_RECORD="$RUNNER_TEMP/method-record-output.json" \
          METHOD_PROPOSAL="$PROPOSAL" METHOD_EPISODE="$EPISODE" python - <<'PY'
          import json
          import os
          with open(os.environ["METHOD_RECORD"], encoding="utf-8") as stream:
              result = json.load(stream)
          with open(os.environ["METHOD_PROPOSAL"], encoding="utf-8") as stream:
              proposal = json.load(stream)
          assert result["created"] is True
          assert result["review_state"] == "UNREVIEWED_DRAFT"
          assert result["semantic_truth_established"] is False
          assert result["method_learning_demonstrated"] is False
          assert result["evidence_paths_not_in_source_revision"] == [os.environ["METHOD_EPISODE"]]
          assert len(proposal["claims"]) == 1
          assert proposal["claims"][0]["kind"] == "observation"
          assert proposal["claims"][0]["epistemic_status"] == "declared"
          assert proposal["claims"][0]["attributes"]["decision_ref"] == (
              "decision:review-2026-11-22-local-memory-consequence-review"
          )
          assert any(
              row["predicate"] == "references"
              and row["object"] == "lesson:separate-construction-from-learning-qualification-gates"
              for row in proposal["relations"]
          )
          assert any(
              row["predicate"] == "references"
              and row["object"] == "decision:review-2026-11-22-local-memory-consequence-review"
              for row in proposal["relations"]
          )
          PY
          sensemaking-skills semantic knowledge-proposal-check \
            --repo . --proposal "$PROPOSAL" --json > /dev/null
          git reset -q -- "$EPISODE"
          rm -- "$EPISODE" "$PROPOSAL"
          test -z "$(git status --porcelain)"
          echo "Temporary method proposal validated and discarded; no learning episode retained."
      - name: Exercise decision-review producer contract (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          EPISODE=".sensemaking/decision-review-contract-ci-fixture.json"
          PROPOSAL=".sensemaking/knowledge/decision-review-contract-ci-fixture.json"
          REVIEW_REF="$REF" REVIEW_EPISODE="$EPISODE" python - <<'PY'
          import json
          import os
          payload = {
              "review_id": "ci-contract-fixture",
              "actor": "CI mechanical contract fixture; not an autonomous review agent",
              "source_revision": os.environ["REVIEW_REF"],
              "source_option": "arch:git-reviewed-local-memory",
              "disposition": "reaffirm",
              "basis": "Synthetic input for mechanical verification only; not a genuine decision review.",
              "conditions": "CI producer contract, never cognitive evidence.",
              "counterevidence": "NOT_ASSESSED",
              "claim_ceiling": "No genuine decision review, decision influence or improved judgment.",
              "evidence_refs": ["file:.sensemaking/knowledge/prospective-reasoning.json"],
              "consequence_refs": ["conseq:persistence-requires-write-authority"],
              "assessment_refs": ["observation:consequence-assessment-persistence-authority-20261028"],
              "method_ref": "lesson:separate-construction-from-learning-qualification-gates",
          }
          with open(os.environ["REVIEW_EPISODE"], "w", encoding="utf-8") as stream:
              json.dump(payload, stream)
          PY
          git add "$EPISODE"
          sensemaking-skills semantic decision record \
            --repo . --episode "$EPISODE" --output "$PROPOSAL" --json \
            > "$RUNNER_TEMP/decision-review-output.json"
          DECISION_RECORD="$RUNNER_TEMP/decision-review-output.json" \
          DECISION_PROPOSAL="$PROPOSAL" DECISION_EPISODE="$EPISODE" python - <<'PY'
          import json
          import os
          with open(os.environ["DECISION_RECORD"], encoding="utf-8") as stream:
              result = json.load(stream)
          with open(os.environ["DECISION_PROPOSAL"], encoding="utf-8") as stream:
              proposal = json.load(stream)
          assert result["created"] is True
          assert result["review_state"] == "UNREVIEWED_DRAFT"
          assert result["decision_influence_established"] is False
          assert result["action_authorized"] is False
          assert result["evidence_paths_not_in_source_revision"] == [os.environ["DECISION_EPISODE"]]
          assert len(proposal["claims"]) == 1
          assert proposal["claims"][0]["kind"] == "decision"
          assert proposal["claims"][0]["attributes"]["review_of"] == "arch:git-reviewed-local-memory"
          assert proposal["claims"][0]["attributes"]["disposition"] == "reaffirm"
          assert any(row["predicate"] == "learned_from"
                     and row["object"] == "lesson:separate-construction-from-learning-qualification-gates"
                     for row in proposal["relations"])
          PY
          sensemaking-skills semantic knowledge-proposal-check \
            --repo . --proposal "$PROPOSAL" --json > /dev/null
          git reset -q -- "$EPISODE"
          rm -- "$EPISODE" "$PROPOSAL"
          test -z "$(git status --porcelain)"
          echo "Temporary decision review proposal validated and discarded; no review retained."
      - name: Verify decision-review effective assessment standing (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from sensemaking_skills.decision_review import record_decision_review


          def git(root, *args, check=True):
              result = subprocess.run(
                  ["git", *args], cwd=root, capture_output=True, text=True
              )
              if check and result.returncode:
                  raise AssertionError(result.stdout + result.stderr)
              return result.stdout.strip()


          def exercise(root, label, revision, option, consequence, assessment, evidence):
              episode_rel = "artifacts/history/standing-" + label + ".json"
              output_rel = ".sensemaking/knowledge/standing-" + label + ".json"
              episode = Path(root) / episode_rel
              episode.parent.mkdir(parents=True, exist_ok=True)
              payload = {
                  "review_id": "standing-" + label,
                  "actor": "CI mechanical standing fixture; not an autonomous review agent",
                  "source_revision": revision,
                  "source_option": option,
                  "disposition": "reaffirm",
                  "basis": "Synthetic input for mechanical verification only.",
                  "conditions": "Never cognitive evidence.",
                  "counterevidence": "NOT_ASSESSED",
                  "claim_ceiling": "No genuine decision review or decision influence.",
                  "evidence_refs": evidence,
                  "consequence_refs": [consequence],
                  "assessment_refs": [assessment],
              }
              episode.write_text(
                  json.dumps(payload, indent=2) + "\n", encoding="utf-8", newline="\n"
              )
              git(root, "add", episode_rel)
              try:
                  try:
                      record_decision_review(root, episode_rel, output_rel)
                  except ValueError as exc:
                      return False, str(exc)
                  return True, "created"
              finally:
                  git(root, "reset", "-q", "--", episode_rel, check=False)
                  episode.unlink(missing_ok=True)
                  (Path(root) / output_rel).unlink(missing_ok=True)

          # Real repository case: authored NOT_OBSERVED but relation-superseded.
          root = Path.cwd()
          rev = git(root, "rev-parse", "HEAD")
          option = "arch:git-reviewed-local-memory"
          consequence = "conseq:candidate-recall-in-later-discovery"
          evidence = ["file:.sensemaking/knowledge/prospective-reasoning.json"]
          old = "observation:consequence-assessment-candidate-recall-20261028"
          correction = "observation:consequence-assessment-candidate-recall-correction-20261028"
          unrelated = "observation:consequence-assessment-persistence-authority-20261028"
          assert exercise(root, "real-old", rev, option, consequence, old, evidence)[0] is False
          assert exercise(root, "real-active", rev, option, consequence, correction, evidence)[0] is True
          assert exercise(root, "real-unrelated", rev, option, consequence, unrelated, evidence)[0] is False

          # Disposable repository for legacy status, cross-consequence edges,
          # cycles and exact source-revision semantics.
          probe = Path(tempfile.mkdtemp(prefix="smk-standing-"))
          try:
              (probe / ".sensemaking" / "knowledge").mkdir(parents=True)
              (probe / "docs").mkdir()
              (probe / "docs" / "probe.md").write_text(
                  "Disposable standing-semantics fixture.\n", encoding="utf-8"
              )

              def claim(cid, kind, attributes):
                  return {
                      "id": cid,
                      "kind": kind,
                      "statement": "Probe claim.",
                      "authority_kind": "document",
                      "authority_ref": "docs/probe.md",
                      "evidence_refs": ["file:docs/probe.md"],
                      "epistemic_status": "declared",
                      "attributes": attributes,
                  }

              def relation(rid, subject, predicate, obj):
                  return {
                      "id": rid,
                      "subject": subject,
                      "predicate": predicate,
                      "object": obj,
                      "evidence_refs": ["file:docs/probe.md"],
                      "epistemic_status": "declared",
                  }

              claims = [
                  claim("arch:probe-option", "alternative", {
                      "concept": "ArchitectureOption",
                      "preference": {"status": "PROVISIONAL"},
                  }),
                  claim("conseq:probe-a", "hypothesis", {"source_option": "arch:probe-option"}),
                  claim("conseq:probe-b", "hypothesis", {"source_option": "arch:probe-option"}),
                  claim("observation:probe-old", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "NOT_OBSERVED",
                  }),
                  claim("observation:probe-active", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "NOT_YET_OBSERVABLE",
                  }),
                  claim("observation:probe-legacy", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "SUPERSEDED",
                  }),
                  claim("observation:probe-other", "observation", {
                      "consequence_ref": "conseq:probe-b", "assessment_status": "OBSERVED_CONSISTENT",
                  }),
                  claim("observation:probe-cross-source", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "PARTIALLY_OBSERVED",
                  }),
                  claim("observation:probe-cross-target", "observation", {
                      "consequence_ref": "conseq:probe-b", "assessment_status": "OBSERVED_CONSISTENT",
                  }),
                  claim("observation:probe-cycle-1", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "OBSERVED_CONSISTENT",
                  }),
                  claim("observation:probe-cycle-2", "observation", {
                      "consequence_ref": "conseq:probe-a", "assessment_status": "NOT_OBSERVED",
                  }),
              ]
              relations = [
                  relation("rel:probe-" + item["id"].split(":", 1)[1] + "-refs",
                           item["id"], "references", item["attributes"]["consequence_ref"])
                  for item in claims[3:]
              ]
              pack = probe / ".sensemaking" / "knowledge" / "probe.json"
              pack.write_text(
                  json.dumps({"schema_version": 2, "claims": claims, "relations": relations},
                             indent=2) + "\n",
                  encoding="utf-8", newline="\n",
              )
              git(probe, "init", "-q")
              git(probe, "config", "user.email", "probe@example.invalid")
              git(probe, "config", "user.name", "Probe")
              git(probe, "add", "-A")
              git(probe, "commit", "-q", "-m", "rev1")
              rev1 = git(probe, "rev-parse", "HEAD")

              relations2 = relations + [
                  relation("rel:probe-active-supersedes-old",
                           "observation:probe-active", "supersedes", "observation:probe-old"),
                  relation("rel:probe-cross-supersedes-source",
                           "observation:probe-cross-target", "supersedes",
                           "observation:probe-cross-source"),
                  relation("rel:probe-cycle-1-supersedes-2",
                           "observation:probe-cycle-1", "supersedes", "observation:probe-cycle-2"),
                  relation("rel:probe-cycle-2-supersedes-1",
                           "observation:probe-cycle-2", "supersedes", "observation:probe-cycle-1"),
              ]
              pack.write_text(
                  json.dumps({"schema_version": 2, "claims": claims, "relations": relations2},
                             indent=2) + "\n",
                  encoding="utf-8", newline="\n",
              )
              git(probe, "add", "-A")
              git(probe, "commit", "-q", "-m", "rev2")
              rev2 = git(probe, "rev-parse", "HEAD")
              probe_evidence = ["file:docs/probe.md"]
              assert exercise(probe, "old-at-rev1", rev1, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-old", probe_evidence)[0] is True
              assert exercise(probe, "old-at-rev2", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-old", probe_evidence)[0] is False
              assert exercise(probe, "active-correction", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-active", probe_evidence)[0] is True
              assert exercise(probe, "legacy-authored", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-legacy", probe_evidence)[0] is False
              assert exercise(probe, "cross-consequence", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-cross-source", probe_evidence)[0] is True
              assert exercise(probe, "cycle-member-1", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-cycle-1", probe_evidence)[0] is True
              assert exercise(probe, "cycle-member-2", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-cycle-2", probe_evidence)[0] is True
              assert exercise(probe, "unrelated", rev2, "arch:probe-option",
                              "conseq:probe-a", "observation:probe-other", probe_evidence)[0] is False
          finally:
              shutil.rmtree(probe, ignore_errors=True)

          assert git(root, "status", "--porcelain") == ""
          print("Effective assessment standing is enforced at the review source revision; no review retained.")
          PY
      - name: Build and inspect the real committed graph
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$REF" = "$EXPECTED"
          DB="$RUNNER_TEMP/sensemaking-graph.sqlite"
          for pack in .sensemaking/knowledge/*.json; do
            sensemaking-skills semantic knowledge-proposal-check \
              --repo . --proposal "$pack" --json > /dev/null
          done
          sensemaking-skills semantic knowledge-build \
