          from sensemaking_skills.semantic_architecture.knowledge_store import query_knowledge

          source = Path(os.environ["INDEX"])
          revision = os.environ["SOURCE_SHA"]
          args = {
              "repository": "ThorStarlord/sensemaking-skills",
              "target_ref": revision,
              "operation": "snapshot",
          }
          valid = query_knowledge(source, **args)
          assert valid["digest"] and valid["counts"]["claims"] > 0

          # The original exact-commit index remains untouched. Alter only a
          # disposable copy to confirm the public query fails closed.
          corrupted = source.with_name("altered-derived-graph.sqlite")
          shutil.copy2(source, corrupted)
          with sqlite3.connect(corrupted) as conn:
              row = conn.execute(
                  "SELECT id,payload FROM claims WHERE repository=? AND target_ref=? "
                  "ORDER BY id LIMIT 1",
                  (args["repository"], revision),
              ).fetchone()
              assert row
              record = json.loads(row[1])
              record["statement"] += " [altered cached payload]"
              conn.execute(
                  "UPDATE claims SET statement=?,payload=? "
                  "WHERE repository=? AND target_ref=? AND id=?",
                  (record["statement"], json.dumps(record), args["repository"], revision, row[0]),
              )
          attempt = subprocess.run(
              [
                  "sensemaking-skills", "semantic", "knowledge-query",
                  "--db", str(corrupted), "--repository", args["repository"],
                  "--target-ref", revision, "--operation", "snapshot", "--json",
              ],
              text=True, capture_output=True, check=False,
          )
          assert attempt.returncode != 0
          assert "indexed snapshot digest mismatch" in attempt.stderr
          print(json.dumps({
              "consumer": "derived-index-digest-integrity",
              "source_ref": revision,
              "original_claim_count": valid["counts"]["claims"],
              "original_index_unchanged": True,
              "altered_copy_query_rejected": True,
              "git_source_authenticity_established": False,
              "semantic_truth_established": False,
          }, sort_keys=True))
          PY

      - name: Check opt-in source fingerprint continuity on committed sources
        shell: bash
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          PROBE_DB="$RUNNER_TEMP/opt-in-probe-index.sqlite"
          sensemaking-skills semantic knowledge-build \
            --repo . --repository ThorStarlord/sensemaking-skills \
            --target-ref "$REF" --db "$PROBE_DB" \
            --include-python-imports --max-imports 100 \
            --include-js-module-imports --max-js-imports 100 \
            --include-manifest-dependencies --max-manifest-dependencies 100 \
            --json > "$RUNNER_TEMP/opt-in-probe-build.json"
          PROBE_DB="$PROBE_DB" PROBE_REF="$REF" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sqlite3

          expected = {
              "probe:python-imports-v1": "python_import",
              "probe:js-module-imports-v1": "js_module_import",
              "probe:manifest-dependencies-v1": "manifest_dependency",
          }
          edge_scopes = {
              "import syntax, not runtime or architecture": "python_import",
              "static ES module syntax; not runtime or architecture": "js_module_import",
              "declared dependency only; installation/import not established": "manifest_dependency",
          }
          observed = {
              "python_import": {"claim": 0, "relation": 0},
              "js_module_import": {"claim": 0, "relation": 0},
              "manifest_dependency": {"claim": 0, "relation": 0},
          }
          original_js_edges = []
          with sqlite3.connect(os.environ["PROBE_DB"]) as connection:
              for table in ("claims", "relations"):
                  for (raw,) in connection.execute(
                      f"SELECT payload FROM {table} WHERE target_ref=?",
                      (os.environ["PROBE_REF"],),
                  ):
                      record = json.loads(raw)
                      group = (
                          expected.get(record.get("authority_ref"))
                          if table == "claims"
                          else edge_scopes.get(record.get("attributes", {}).get("scope"))
                      )
                      if group is None:
                          continue
                      fingerprints = record["attributes"].get("source_sha256")
                      assert isinstance(fingerprints, dict) and fingerprints, record["id"]
                      for path, original_hash in fingerprints.items():
                          assert original_hash == hashlib.sha256(
                              Path(path).read_bytes()
                          ).hexdigest(), (record["id"], path)
                      kind = "claim" if table == "claims" else "relation"
                      observed[group][kind] += 1
                      if group == "js_module_import" and kind == "relation":
                          original_js_edges.append(record)

          fixture = "experiments/post-hardening-adjudication-probe-v1/packets/strong-ui-fog/fixture/src/index.js"
          matched = [edge for edge in original_js_edges if edge["source_ref"] == f"file:{fixture}"]
          assert len(matched) == 1, matched
          assert matched[0]["evidence_refs"] == [f"file:{fixture}:line:1"]
          # A module specifier belongs to an importer, not a global module name.
          expected_target = "js-module-specifier:" + hashlib.sha256(
              fixture.encode("utf-8") + bytes([0]) + b"./views/AppView.js"
          ).hexdigest()[:24]
          assert matched[0]["object"] == expected_target, matched[0]
          assert "import { mount } from" in Path(fixture).read_text(encoding="utf-8")
          with sqlite3.connect(os.environ["PROBE_DB"]) as connection:
              target = connection.execute(
                  "SELECT payload FROM claims WHERE target_ref=? AND id=?",
                  (os.environ["PROBE_REF"], matched[0]["object"]),
              ).fetchone()
          assert target and json.loads(target[0])["statement"] == (
              "Static JS/TS module specifier: ./views/AppView.js"
          )

          assert all(count > 0 for values in observed.values()
                     for count in values.values()), observed
          print(json.dumps({
              "consumer": "opt-in-probe-original-source-fingerprints",
              "source_ref": os.environ["PROBE_REF"],
              "observation_counts": observed,
              "source_bytes_match_pinned_fingerprints": True,
              "later_source_drift_assessed": False,
              "independent_agent_benefit_established": False,
          }, sort_keys=True))
          PY

