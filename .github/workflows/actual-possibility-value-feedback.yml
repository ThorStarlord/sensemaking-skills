name: Actual possibility value feedback (execution branch only)
on:
  push:
    branches: [claude/possibility-value-feedback-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/possibility-value-feedback-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "5320745b167acb9c08ae9f191dc3093862ae7b37"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Recover complete reviewed prediction assessment and decision at exact source
        run: |
          set -euo pipefail
          REVIEW=".sensemaking/knowledge/detached-stewardship-value-review.json"
          echo "914a2d8331b5c60dbbb1febe32c4bdfe64efaf0748395868be15e61629d2fbc1  $REVIEW" | sha256sum -c -
          for pack in possibility-value-feedback-detached-stewardship detached-stewardship-value-review experience-grounded-possibility-evaluation; do
            sensemaking-skills semantic knowledge-proposal-check --repo . --proposal ".sensemaking/knowledge/$pack.json" --json > "$RUNNER_TEMP/$pack-check.json"
          done
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation possibility-ecology --subject goal:domain-general-cognitive-development \
            --method-question "How should construction and qualification gates inform evaluating a valuable possibility after actual outcomes?" \
            --include-method-trials --limit 150 --json > "$RUNNER_TEMP/complete-family.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation possibility-ecology --subject poss:detached-possibility-stewardship \
            --limit 80 --json > "$RUNNER_TEMP/complete-focused.json"
          sensemaking-skills handoff --repo . --output "$RUNNER_TEMP/actual-handoff" \
            --skill-path skills/using-sensemaking --expected-source-ref "$SOURCE" \
            --resume-from .sensemaking/receipts/2026-11-27-integrated-self-development.session.yaml \
            --question "Use prior value evidence in actual self-development." --json > "$RUNNER_TEMP/handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          read=lambda n:json.loads((p/n).read_text())
          for file in p.glob("*-check.json"):
              q=json.loads(file.read_text())
              assert q["valid"] is True and q["action_authorized"] is False
              print("PACK_CHECK="+json.dumps({"pack":file.name,**{k:q[k] for k in ("valid","claims_checked","relations_checked","existing_endpoints_checked")}}))
          for name in ("complete-family.json","complete-focused.json"):
              q=read(name)
              assert q["target_ref"]==os.environ["SOURCE"] and q["action_authorized"] is False
              f=q["possibility_ecology"]["value_feedback"]
              row=next(x for x in f["entries"] if x["possibility_id"]=="poss:detached-possibility-stewardship")
              assert row["predictions"][0]["standing"]=="PARTIALLY_OBSERVED"
              assert row["review_total"]==1 and row["review_omitted"]==0
              review=row["reviews"][0]["record"]
              assert review["id"]=="decision:review-detached-stewardship-value-20261127"
              assert review["attributes"]["disposition"]=="retain_with_limitation"
              assert review["attributes"]["method_ref"]=="lesson:separate-construction-from-learning-qualification-gates"
              assert review["attributes"]["assessment_refs"]==["observation:detached-stewardship-value-20261127"]
              print("COMPLETE_FEEDBACK="+json.dumps({"query":name,"visible_candidates":f["visible_candidate_total"],"with_predictions":f["candidates_with_predictions"],"unassessed":f["candidates_without_predictions"],"standing":row["predictions"][0]["standing"],"decision":review["id"],"method":review["attributes"]["method_ref"],"review_total":row["review_total"]}))
              if name=="complete-family.json":
                  print("METHOD_PRECEDENTS="+json.dumps([c["id"] for c in q["method_precedents"]["method_candidates"]]))
                  assert any(c["id"]=="poss:experience-grounded-possibility-evaluation" for c in q["claims"])
          h=read("handoff.json")
          assert h["continuity"]["selected_receipts"][0]["validation"]=="VALID"
          print("PRIOR_RECEIPT_VALID=PASS")
          print("COMPLETE_VALUE_FEEDBACK=PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-possibility-value-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
