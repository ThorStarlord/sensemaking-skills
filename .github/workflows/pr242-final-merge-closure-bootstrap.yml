          Path("tests/test_artifact_contract_agreement.py").write_text(r'''"""Artifact-contract agreement for the repository sensemaking brief.

The generic validator owns declared machine-field shape; the specialized brief
validator owns the conditional outcome/workflow semantic invariant:
- ACTION -> valid workflow required;
- explicit NO_REPOSITORY_CHANGE_WARRANTED -> workflow absent/null;
- missing workflow alone never implies NO_CHANGE.
"""
import json
import os
import subprocess
import sys
import tempfile
import unittest

import yaml

REPO_ROOT = os.path.abspath(os.path.join(os.path.dirname(__file__), ".."))
SCRIPTS = os.path.join(REPO_ROOT, "scripts")


def _run_script(name, args):
    return subprocess.run(
        [sys.executable, os.path.join(SCRIPTS, name)] + args,
        capture_output=True,
        text=True,
        cwd=REPO_ROOT,
    )


def _brief(machine_lines):
    return (
        "# Repository Sensemaking Brief\n\n"
        "## 13. Machine-readable handoff\n\n```yaml\n"
        + "\n".join(machine_lines) + "\n```\n"
    )


def _base_lines():
    return [
        "artifact_id: repository_sensemaking_brief",
        "schema_version: 1",
        "source_intent_ref: artifacts/01-orchestration-run/00-user-intent.md",
        "user_implied_fog_type: architecture_fog",
        "primary_fog_type: architecture_fog",
        "diagnosis_conflict: false",
        "escalation_recommended: false",
        "evidence:\n  - \"a.py:1 x\"",
        "recommended_execution_mode: guided_execution",
        "weakest_boundary: version-drift",
        "weakness_type: Contract Mismatch",
        "weakness_type_explanation: null",
        "required_inputs:\n  - repository_state",
        "created_at: \"2026-08-29T00:00:00Z\"",
        "immutable: true",
        "representation_sufficiency:\n  status: sufficient",
    ]


def _action_with_workflow():
    lines = _base_lines()
    lines.insert(8, "recommended_workflow_id: architecture-implementation-workflow")
    lines.append("outcome: ACTION_REQUIRED")
    return _brief(lines)


def _action_missing_workflow():
    lines = _base_lines()
    lines.append("outcome: ACTION_REQUIRED")
    return _brief(lines)


def _action_null_workflow():
    lines = _base_lines()
    lines.insert(8, "recommended_workflow_id: null")
    lines.append("outcome: ACTION_REQUIRED")
    return _brief(lines)


def _no_change(*, workflow_marker="absent"):
    lines = _base_lines()
    if workflow_marker == "null":
        lines.insert(8, "recommended_workflow_id: null")
    elif workflow_marker == "non-null":
        lines.insert(8, "recommended_workflow_id: architecture-implementation-workflow")
    lines.append("outcome: NO_REPOSITORY_CHANGE_WARRANTED")
    return _brief(lines)


class TestContractAgreement(unittest.TestCase):
    def _generic(self, text):
        with tempfile.TemporaryDirectory() as d:
            p = os.path.join(d, "brief.md")
            with open(p, "w", encoding="utf-8") as f:
                f.write(text)
            r = _run_script("validate-artifact.py", ["repository_sensemaking_brief", p])
            return r.returncode, (r.stdout or r.stderr)

    def _specialized(self, text):
        with tempfile.TemporaryDirectory() as d:
            p = os.path.join(d, "brief.md")
            with open(p, "w", encoding="utf-8") as f:
                f.write(text)
            r = _run_script("validate-brief.py", [p, "--repo-root", REPO_ROOT, "--json"])
            try:
                payload = json.loads(r.stdout)
            except Exception:
                payload = {"valid": False, "errors": [{"message": (r.stdout or r.stderr)[:500]}]}
            return r.returncode, payload

    @staticmethod
    def _messages(payload):
        return "\n".join(e.get("message", "") for e in payload.get("errors", []))

    def _exercise_both(self, text):
        generic = self._generic(text)
        specialized = self._specialized(text)
        return generic, specialized

    def test_normal_action_valid_workflow_has_no_workflow_contract_error(self):
        (g_ec, g_out), (_, s) = self._exercise_both(_action_with_workflow())
        self.assertNotIn("missing required machine field: recommended_workflow_id",
                         (g_out or "").lower())
        messages = self._messages(s)
        self.assertNotIn("MISSING_WORKFLOW_ID", messages)
        self.assertNotIn("HALLUCINATED_WORKFLOW_ID", messages)
        self.assertNotIn("NO_CHANGE_WORKFLOW_CONFLICT", messages)

    def test_action_missing_workflow_fails_specialized_contract(self):
        self._generic(_action_missing_workflow())  # exercise generic shape validator too
        _, s = self._specialized(_action_missing_workflow())
        self.assertIn("MISSING_WORKFLOW_ID", self._messages(s))

    def test_action_null_workflow_fails_specialized_contract(self):
        self._generic(_action_null_workflow())
        _, s = self._specialized(_action_null_workflow())
        self.assertIn("MISSING_WORKFLOW_ID", self._messages(s))

    def test_explicit_no_change_absent_workflow_is_allowed(self):
        (_, g_out), (_, s) = self._exercise_both(_no_change(workflow_marker="absent"))
        self.assertNotIn("missing required machine field: recommended_workflow_id",
                         (g_out or "").lower())
        messages = self._messages(s)
        self.assertNotIn("MISSING_WORKFLOW_ID", messages)
        self.assertNotIn("NO_CHANGE_WORKFLOW_CONFLICT", messages)

    def test_explicit_no_change_null_workflow_is_allowed(self):
        self._generic(_no_change(workflow_marker="null"))
        _, s = self._specialized(_no_change(workflow_marker="null"))
        messages = self._messages(s)
        self.assertNotIn("MISSING_WORKFLOW_ID", messages)
        self.assertNotIn("NO_CHANGE_WORKFLOW_CONFLICT", messages)

    def test_explicit_no_change_non_null_workflow_is_rejected(self):
        self._generic(_no_change(workflow_marker="non-null"))
        _, s = self._specialized(_no_change(workflow_marker="non-null"))
        self.assertIn("NO_CHANGE_WORKFLOW_CONFLICT", self._messages(s))

    def test_missing_workflow_alone_never_implies_no_change(self):
        self._generic(_action_missing_workflow())
        _, s = self._specialized(_action_missing_workflow())
        messages = self._messages(s)
        self.assertIn("MISSING_WORKFLOW_ID", messages)
        self.assertNotIn("NO_CHANGE_WORKFLOW_CONFLICT", messages)

    def test_programmatic_fields_are_declared_in_machine_contract(self):
        with open(os.path.join(
            REPO_ROOT, "skills", "workflow-planner", "references", "artifact-contracts.yaml"
        ), encoding="utf-8") as f:
            contracts = yaml.safe_load(f)
        brief = next(a for a in contracts["artifacts"]
                     if a.get("id") == "repository_sensemaking_brief")
        fields = set(brief.get("required_machine_fields", [])) | set(
            brief.get("recommended_machine_fields", []))
        self.assertIn("representation_sufficiency", fields)
        self.assertIn("outcome", fields)
        self.assertIn("recommended_workflow_id", fields)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          # -----------------------------------------------------------------
