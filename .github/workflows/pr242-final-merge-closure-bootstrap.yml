          # -----------------------------------------------------------------
          replace_once(
              "scripts/workflow-runtime.py",
              """            # Guarded so warrant_enabled=False runs are unchanged, and a warrant\n            # error never aborts brief production (log-and-continue).\n""",
              """            # Guarded so warrant_enabled=False runs are unchanged. Once enabled,\n            # inability to compute the warrant fails closed through the same\n            # INCONCLUSIVE terminal gate; it can never permit routing/NO_CHANGE.\n""",
          )

          replace_once(
              "scripts/workflow-runtime.py",
              """                record_obj = self._run_seam_warrant(output_artifact, skill)\n                if record_obj is not None:\n""",
              """                record_obj = self._run_seam_warrant(output_artifact, skill)\n                if record_obj is None:\n                    # Defense in depth: this is an APPLICABLE warrant-enabled\n                    # repo-sensemaker brief step. If the seam cannot produce a\n                    # record at all, treat the operational failure as\n                    # INCONCLUSIVE rather than falling through to NO_CHANGE or\n                    # ordinary routing. Non-applicable skills never enter this\n                    # branch.\n                    result[\"warrant\"] = \"INCONCLUSIVE\"\n                    result[\"warrant_record\"] = {\n                        \"warrant\": \"INCONCLUSIVE\",\n                        \"representation_materialized\": False,\n                        \"error\": (\n                            \"MODEL_WARRANT_COMPUTATION_UNAVAILABLE: enabled \"\n                            \"warrant seam returned no record\"\n                        ),\n                    }\n                    return self._terminal_inconclusive_gate(result, step_num)\n                if record_obj is not None:\n""",
          )

          replace_once(
              "scripts/workflow-runtime.py",
              """        same-episode probe-report identity is NOT preserved by the\n        runtime (no registered artifact path) and is therefore NOT invented here;\n        absent probe-report evidence stays UNKNOWN (no absent->FALSE).\n        Safe-by-construction: lazy import; any failure returns None so routing is\n        never aborted by warrant computation itself.\n""",
              """        same-episode probe-report identity IS preserved by the runtime via the\n        runtime-owned expected_probe_report_path and is consumed only when its\n        target revision is authoritative; otherwise probe evidence stays UNKNOWN\n        (no absent->FALSE). Safe-by-construction: lazy import; an applicable seam\n        failure returns a fail-closed INCONCLUSIVE record when possible, and\n        execute_step treats an unexpected None as INCONCLUSIVE defense-in-depth.\n        A different skill/artifact remains non-applicable and returns None.\n""",
          )

          replace_once(
              "scripts/workflow-runtime.py",
              """        except Exception as exc:  # never break the seam\n            print(f\"  ~ [WARRANT] warrant gate unavailable at seam: {exc}\")\n            return None\n""",
              """        except Exception as exc:\n            print(f\"  ~ [WARRANT] warrant gate unavailable at seam: {exc}\")\n            # Once the seam is applicable and enabled, an operational failure\n            # must fail closed. Prefer the existing serializable WarrantRecord;\n            # execute_step also treats an unexpected None as INCONCLUSIVE so an\n            # import/runtime failure can never become an action bypass.\n            try:\n                from sensemaking_skills.reasoning.warrant_gate import WarrantRecord\n                return WarrantRecord(\n                    warrant=\"INCONCLUSIVE\",\n                    target_repository=getattr(self, \"target_repo\", self.repo_root),\n                    target_revision=self._current_target_revision(),\n                    user_goal=self.user_goal_hint(),\n                    representation_materialized=False,\n                    error=f\"MODEL_WARRANT_COMPUTATION_FAILED: {exc}\",\n                )\n            except Exception:\n                return None\n""",
          )

          # -----------------------------------------------------------------
          # 2. NO_CHANGE and routable workflow are mutually exclusive.
          # -----------------------------------------------------------------
          replace_once(
              "scripts/validate-brief.py",
              "NO_REPOSITORY_CHANGE_WARRANTED_OUTCOME = \"NO_REPOSITORY_CHANGE_WARRANTED\"\n",
              "NO_REPOSITORY_CHANGE_WARRANTED_OUTCOME = \"NO_REPOSITORY_CHANGE_WARRANTED\"\nNO_CHANGE_WORKFLOW_CONFLICT = \"NO_CHANGE_WORKFLOW_CONFLICT\"\n",
          )

          replace_once(
              "scripts/validate-brief.py",
              """        else:\n            workflow_id = artifact_data.get(\"recommended_workflow_id\")\n            # Truthful no-match (ADR 0014): `recommended_workflow_id: null` is\n""",
              """        else:\n            workflow_id = artifact_data.get(\"recommended_workflow_id\")\n            if no_change_outcome and workflow_id is not None:\n                errors.append(_code_error(\n                    NO_CHANGE_WORKFLOW_CONFLICT,\n                    \"outcome=NO_REPOSITORY_CHANGE_WARRANTED requires \"\n                    \"recommended_workflow_id to be absent or null; a routable \"\n                    \"workflow contradicts the explicit terminal no-change outcome.\",\n                    field=\"recommended_workflow_id\",\n                ))\n            # Truthful no-match (ADR 0014): `recommended_workflow_id: null` is\n""",
          )

          replace_once(
              "skills/repo-sensemaker/references/repo-analysis-template.md",
              "recommended_workflow_id: # MUST match an ID in workflow-registry.yaml\n",
              "recommended_workflow_id: # ACTION: MUST match an ID in workflow-registry.yaml; NO_REPOSITORY_CHANGE_WARRANTED: omit or null\n",
          )
          replace_once(
              "skills/repo-sensemaker/references/repo-analysis-template.md",
              "outcome: ACTION_REQUIRED | NO_REPOSITORY_CHANGE_WARRANTED # optional; omit for a normal action brief, set NO_REPOSITORY_CHANGE_WARRANTED for a first-class terminal success\n",
              "outcome: ACTION_REQUIRED | NO_REPOSITORY_CHANGE_WARRANTED # optional for a normal action brief; when NO_REPOSITORY_CHANGE_WARRANTED, recommended_workflow_id MUST be absent or null\n",
          )
          replace_once(
              "skills/repo-sensemaker/references/repo-analysis-template.md",
              """`representation_sufficiency` is the producer's semantic judgment about whether the\n""",
              """`outcome` and `recommended_workflow_id` are mutually constrained. For a normal\nACTION brief (whether `outcome` is omitted or explicitly `ACTION_REQUIRED`), emit a\nvalid registry workflow. For `NO_REPOSITORY_CHANGE_WARRANTED`, omit\n`recommended_workflow_id` or emit it as `null`; never emit a routable workflow. A\nmissing workflow by itself never implies NO_CHANGE.\n\n`representation_sufficiency` is the producer's semantic judgment about whether the\n""",
          )

          replace_once(
              "skills/repo-sensemaker/SKILL.md",
              """Do not infer sufficiency or insufficiency from evidence-line counts, missing files,\nor citation presence. Do not invent a gap or a bounded remedy to force PARTIAL.\n\n""",
              """Do not infer sufficiency or insufficiency from evidence-line counts, missing files,\nor citation presence. Do not invent a gap or a bounded remedy to force PARTIAL.\n\n### Repository-action outcome / workflow invariant\n\nKeep the repository-action outcome independent from MODEL_WARRANT. For a normal\naction brief, `recommended_workflow_id` must name a valid registry workflow. If\nSection 13 explicitly declares `outcome: NO_REPOSITORY_CHANGE_WARRANTED`, then\n`recommended_workflow_id` must be absent or `null` -- never emit a routable\nworkflow alongside the terminal no-change outcome. Conversely, a missing/null\nworkflow alone never implies NO_CHANGE; the outcome must be affirmative and explicit.\n\n""",
          )

          # -----------------------------------------------------------------
          # 3. Replace stale seam-failure qualification and add execute_step
          #    failure-closed regressions.
          # -----------------------------------------------------------------
          replace_once(
              "tests/test_warrant_seam_integration.py",
              """  4. A failure in the warrant gate never aborts brief production (returns None).\n""",
              """  4. An applicable enabled-seam failure returns a fail-closed INCONCLUSIVE\n     record; a non-applicable skill/artifact still returns None.\n""",
          )
          replace_once(
              "tests/test_warrant_seam_integration.py",
              """    def test_seam_warrant_gate_failure_never_aborts_brief(self):\n        \"\"\"Warrant gate failure returns None (log-and-continue), never raising.\"\"\"\n        runner = _make_runner(warrant_enabled=True)\n        with patch(\"sensemaking_skills.reasoning.warrant_gate.run_seam_warrant\",\n                   side_effect=RuntimeError(\"boom\")):\n            rec = runner._run_seam_warrant(\"repository_sensemaking_brief\", \"repo-sensemaker\")\n        self.assertIsNone(rec)  # no crash; brief production proceeds\n""",
              """    def test_applicable_seam_failure_returns_fail_closed_inconclusive_record(self):\n        \"\"\"An applicable enabled seam failure is an INCONCLUSIVE record, not None.\"\"\"\n        runner = _make_runner(warrant_enabled=True)\n        with patch(\"sensemaking_skills.reasoning.warrant_gate.run_seam_warrant\",\n                   side_effect=RuntimeError(\"boom\")):\n            rec = runner._run_seam_warrant(\"repository_sensemaking_brief\", \"repo-sensemaker\")\n        self.assertIsNotNone(rec)\n        self.assertEqual(rec.warrant, \"INCONCLUSIVE\")\n        self.assertFalse(rec.representation_materialized)\n        self.assertIn(\"MODEL_WARRANT_COMPUTATION_FAILED\", rec.error or \"\")\n""",
          )

          insert_before_once(
              "tests/test_runtime_remediation.py",
              "\n\nclass TestTargetRevisionIdentity(unittest.TestCase):\n",
              r'''

    def _execute_with_warrant_failure(self, brief_text, *, warrant_enabled=True):
        brief_path = os.path.abspath(os.path.join(
            "artifacts-test-warrant-failure", "repository_sensemaking_brief.md"))
        os.makedirs(os.path.dirname(brief_path), exist_ok=True)
        executor = FakeRealExecutor(brief_text)
        runner = self._runner(executor, brief_path)
        runner.warrant_enabled = warrant_enabled
        if os.path.exists(brief_path):
            os.remove(brief_path)
        step = {"skill": "repo-sensemaker",
                "output_artifact": "repository_sensemaking_brief",
                "step_type": "local_execution"}
        try:
            with patch("sensemaking_skills.reasoning.warrant_gate.run_seam_warrant",
                       side_effect=RuntimeError("boom")) as mocked:
                result = runner.execute_step(step, 1, 1)
            return result, mocked.call_count
        finally:
            import shutil
            shutil.rmtree(os.path.dirname(brief_path), ignore_errors=True)

    def test_enabled_seam_failure_blocks_action_routing(self):
        result, calls = self._execute_with_warrant_failure(VALID_BRIEF)
        self.assertEqual(calls, 1)
        self.assertEqual(result.get("warrant"), "INCONCLUSIVE")
        self.assertEqual(result.get("terminal_outcome"), "STOPPED_WITHOUT_ACTION")
        self.assertEqual(result.get("gate_result"), "blocked_inconclusive")
        self.assertNotEqual(result.get("status"), "SUCCESS_NO_CHANGE")

    def test_enabled_seam_failure_blocks_explicit_no_change_terminalization(self):
        no_change = VALID_BRIEF.replace(
            "recommended_workflow_id: docs-implementation-workflow",
            "recommended_workflow_id: null",
        ).replace(
            "immutable: true",
            "immutable: true\noutcome: NO_REPOSITORY_CHANGE_WARRANTED",
        )
        result, calls = self._execute_with_warrant_failure(no_change)
        self.assertEqual(calls, 1)
        self.assertEqual(result.get("warrant"), "INCONCLUSIVE")
        self.assertEqual(result.get("terminal_outcome"), "STOPPED_WITHOUT_ACTION")
        self.assertNotEqual(result.get("terminal_outcome"),
                            "NO_REPOSITORY_CHANGE_WARRANTED")
        self.assertNotEqual(result.get("status"), "SUCCESS_NO_CHANGE")

    def test_warrant_disabled_legacy_path_does_not_call_failing_seam(self):
        result, calls = self._execute_with_warrant_failure(
            VALID_BRIEF, warrant_enabled=False)
        self.assertEqual(calls, 0)
        self.assertNotEqual(result.get("terminal_outcome"), "STOPPED_WITHOUT_ACTION")
        self.assertNotIn("warrant", result)
''',
          )

          # -----------------------------------------------------------------
          # 4. Complete generic + specialized contract-agreement coverage.
