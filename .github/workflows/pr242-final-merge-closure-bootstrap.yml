name: PR 242 final merge-closure bootstrap

on:
  push:
    branches:
      - agent/pr242-final-merge-closure-bootstrap

permissions:
  contents: write

jobs:
  apply-qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: phb-conditional-representation-candidate
          fetch-depth: 0

      - name: Assert reviewed head has not moved
        run: |
          actual="$(git rev-parse HEAD)"
          expected="6580b8b149289d549851fddcc96c7ed7a2d86ba2"
          echo "Reviewed head: $actual"
          test "$actual" = "$expected" || {
            echo "::error::PR head moved; expected $expected, got $actual"
            exit 1
          }

      - name: Fetch temporary closure script
        run: git show origin/agent/pr242-final-merge-closure-bootstrap:scripts/pr242_merge_closure.py > /tmp/pr242_merge_closure.py

      - name: Apply bounded merge-closure patch
        run: python /tmp/pr242_merge_closure.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-subtests

      - name: Run bounded conditional-representation qualification
        run: |
          python -m pytest -q \
            tests/test_runtime_remediation.py \
            tests/test_artifact_contract_agreement.py \
            tests/test_warrant_authority_alignment.py \
            tests/test_warrant_evidence_contract.py \
            tests/test_warrant_seam_integration.py \
            tests/test_canonical_warrant_seam_alignment.py \
            tests/test_handoff_atomic_serialization.py \
            tests/test_section13_evidence_projection.py \
            tests/test_orthogonality_qualification.py \
            tests/test_s2_no_change_contract.py \
            tests/test_evidence_probes_qualification.py \
            tests/test_vertical_slice_qualification.py

      - name: Repository validation and diff hygiene
        run: |
          python scripts/validate-repo.py
          git diff --check
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git diff --check
          git status --short

      - name: Commit exactly one merge-closure commit and push PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent="$(git rev-parse HEAD)"
          test "$parent" = "6580b8b149289d549851fddcc96c7ed7a2d86ba2" || {
            echo "::error::parent moved before commit"
            exit 1
          }
          git add \
            scripts/workflow-runtime.py \
            scripts/validate-brief.py \
            skills/repo-sensemaker/SKILL.md \
            skills/repo-sensemaker/references/repo-analysis-template.md \
            tests/test_warrant_seam_integration.py \
            tests/test_runtime_remediation.py \
            tests/test_artifact_contract_agreement.py \
            .github/workflows/conditional-representation.yml
          git diff --cached --check
          git commit -m "fix: close conditional representation merge contract"
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "6580b8b149289d549851fddcc96c7ed7a2d86ba2"
          echo "New PR head: $new_head"
          git push origin HEAD:phb-conditional-representation-candidate

      - name: Delete one-shot staging branch
        if: success()
        run: git push origin --delete agent/pr242-final-merge-closure-bootstrap || true
