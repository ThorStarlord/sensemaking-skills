name: Actual alternative intervention comparison (execution branch only)
on:
  push:
    branches: [claude/existing-pack-codesign-execution-20261128]
permissions:
  contents: read
jobs:
  reviewed-feedback:
    if: github.ref == 'refs/heads/claude/existing-pack-codesign-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "31a2a511f27b1c5068de2ba7f4a745e3797ece25"
      CANDIDATE: "58d9a153bacddff53f1f9c24170911b5353716a2"
      BASE: "bfa213c6617000df84f09a3a81486408e0000a3c"
      PACK: ".sensemaking/knowledge/prospective-source-knowledge-codesign.json"
      FOCUS: "poss:existing-pack-source-knowledge-codesign"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify selected existing-pack contribution and retained comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/patch_rehearsal.py src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$CANDIDATE:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject "$FOCUS" --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] and not c["action_authorized"]
          assert c["claims_checked"]==8 and c["relations_checked"]==18
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked","affected_incoming_relations_checked")}))
          base=json.loads(subprocess.check_output(["git","show",os.environ["BASE"]+":"+os.environ["PACK"]]))
          prior=json.loads(subprocess.check_output(["git","show",os.environ["CANDIDATE"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          assert base["claims"]==new["claims"][:len(base["claims"])]
          assert base["relations"]==new["relations"][:len(base["relations"])]
          assert prior["relations"]==new["relations"][:len(prior["relations"])]
          pid="conseq:existing-pack-source-knowledge-codesign-value"
          pred=next(x for x in prior["claims"] if x["id"]==pid)
          assert pred==next(x for x in new["claims"] if x["id"]==pid)
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          eco=q["possibility_ecology"]
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]==os.environ["FOCUS"])
          f=next(x for x in e["predictions"] if x["prediction"]["id"]==pid)
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          assert eco["focus"]["claim_id"]==os.environ["FOCUS"]
          assert eco["focus"]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          assert f["prediction"]["attributes"]["value_frame"]==pred["attributes"]["value_frame"]
          selected=next(x for x in new["claims"] if x["id"]==os.environ["FOCUS"])
          assert [x["value"] for x in selected["attributes"]["disposition_history"]]==["EXPLORATORY","SELECTED"]
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"original_records_preserved":True,"original_prediction_preserved":True,"exact_tested_source":True,"realization":eco["focus"]["realization"]["value"],"disposition":"SELECTED"}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-existing-pack-comparison-feedback
          path: ${{ runner.temp }}/*.json
          retention-days: 14
