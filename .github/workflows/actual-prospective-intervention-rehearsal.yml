name: Actual prospective intervention rehearsal (execution branch only)
on:
  push:
    branches: [claude/prospective-intervention-rehearsal-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/prospective-intervention-rehearsal-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "97d4618445b24f6c9bc677254495ed9d47385092"
      BASE: "a9fc89c718e6bac3ee13fa7c7f32618b4b95ce2b"
      REPAIR: "8e93f127fce4f52a2f4943006e43e60df09104b5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Verify reviewed intervention lineage and exact repair integration
        run: |
          set -euo pipefail
          DRAFT="artifacts/history/2026-11-27-prospective-intervention-rehearsal-DRAFT.json"
          echo "acff445de7dac32957c088d17a8e463c90fd322f00b07b09c3c46fdcd2d557c2  $DRAFT" | sha256sum -c -
          FIX="src/sensemaking_skills/semantic_architecture/refactor_preview.py"
          test "$(git rev-parse "$SOURCE:$FIX")" = "$(git rev-parse "$REPAIR:$FIX")"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal .sensemaking/knowledge/prospective-intervention-rehearsal.json --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:prospective-intervention-rehearsal --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation explain --subject cap:source-contained-rename-preview --limit 80 --json > "$RUNNER_TEMP/containment-capability.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          old=json.loads(Path("artifacts/history/2026-11-27-prospective-intervention-rehearsal-DRAFT.json").read_text())
          reviewed=json.loads(Path(".sensemaking/knowledge/prospective-intervention-rehearsal.json").read_text())
          assert old["claims"][1]==reviewed["claims"][1]
          assert old["relations"]==reviewed["relations"][:len(old["relations"])]
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] is True and c["action_authorized"] is False
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          f=json.loads((p/"feedback.json").read_text())
          assert f["target_ref"]==os.environ["SOURCE"] and f["action_authorized"] is False
          e=f["possibility_ecology"]
          row=e["value_feedback"]["entries"][0]
          assert row["possibility_id"]=="poss:prospective-intervention-rehearsal"
          pred=row["predictions"][0]
          assert pred["standing"]=="PARTIALLY_OBSERVED" and pred["assessment_total"]==1
          assert pred["prediction"]["attributes"]["value_frame"]==old["claims"][1]["attributes"]["value_frame"]
          assert e["candidates"][0]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          q=json.loads((p/"containment-capability.json").read_text())
          cap=next(x for x in q["claims"] if x["id"]=="cap:source-contained-rename-preview")
          assert "file:src/sensemaking_skills/semantic_architecture/refactor_preview.py" in cap["evidence_refs"]
          print("ACTUAL_REVIEWED_FEEDBACK="+json.dumps({"standing":pred["standing"],"assessments":pred["assessment_total"],"original_frame_preserved":True,"realization":e["candidates"][0]["realization"]["value"],"repaired_file_cited":True}))
          print("REVIEWED_INTERVENTION=PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-prospective-intervention
          path: ${{ runner.temp }}/*.json
          retention-days: 14
