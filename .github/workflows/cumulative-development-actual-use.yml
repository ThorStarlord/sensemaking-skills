name: Cumulative development actual-use (execution branch only)
on:
  push:
    branches: [claude/cumulative-development-actual-execution-20261127]
permissions:
  contents: read
jobs:
  actual-reentry:
    if: github.ref == 'refs/heads/claude/cumulative-development-actual-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "b4b7dd676aab2ee0eb2dbee3c33a783dffcfce72"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Validate reviewed route and recover exact historical verification outcomes
        run: |
          set -euo pipefail
          sensemaking-skills semantic knowledge-proposal-check --repo . \
            --proposal .sensemaking/knowledge/sustained-reentry-verification.json --json > "$RUNNER_TEMP/preflight.json"
          RECEIPT=".sensemaking/receipts/2026-11-27-adaptive-intellectual-organization-actual-use.session.yaml"
          PRIOR=".sensemaking/receipts/2026-11-27-adaptive-cognitive-correction.session.yaml"
          sensemaking-skills handoff --repo . --output "$RUNNER_TEMP/actual-handoff" \
            --skill-path skills/using-sensemaking --expected-source-ref "$SOURCE" \
            --resume-from "$RECEIPT" --resume-from "$PRIOR" \
            --question "Which prior verified and unverified responsibilities govern the next development decision?" --json > "$RUNNER_TEMP/handoff-output.json"
          sensemaking-skills semantic verification-plan --repo . --ref "$SOURCE" \
            --path src/sensemaking_skills/reentry_context.py --symbol _project --limit 60 --json > "$RUNNER_TEMP/current-verification-plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          import yaml
          root=Path(os.environ["RUNNER_TEMP"])
          check=json.loads((root/"preflight.json").read_text())
          assert check["valid"] is True and check["action_authorized"] is False
          packet=json.loads((root/"actual-handoff"/"handoff.json").read_text())
          assert packet["target"]["git"]["head"]==os.environ["SOURCE"]
          assert packet["source_expectation"]["status"]=="MATCHES_COMMITTED_TREE"
          assert packet["action_authorized"] is False and packet["semantic_truth_established"] is False
          assert len(packet["continuity"]["selected_receipts"])==2
          results=set()
          for row in packet["continuity"]["selected_receipts"]:
              assert row["validation"]=="VALID" and row["projection_status"]=="AVAILABLE", row
              assert row["action_authorized"] is False
              source=yaml.safe_load(Path(row["path"]).read_text())
              projection=row["historical_projection"]
              assert projection["responsibilities_omitted"]==max(0,len(source["responsibilities"])-12)
              print("RECEIPT="+row["path"])
              for projected,authored in zip(projection["responsibilities"],source["responsibilities"][:12],strict=True):
                  assert projected["id"]==authored["id"]
                  assert projected["status"]==authored["status"]
                  assert projected["artifact_refs"]==authored["artifact_refs"][:12]
                  assert projected["validation"]==authored["validation"][:12]
                  assert projected["validation_omitted"]==max(0,len(authored["validation"])-12)
                  results.update(v["result"] for v in projected["validation"])
                  print("VERIFICATION="+json.dumps({"id":projected["id"],"validation":projected["validation"],"omitted":projected["validation_omitted"]}))
          assert results=={"PASS","FAIL","NOT_RUN"},results
          assert "handoff does not rerun them." in packet["prompt"]
          plan=json.loads((root/"current-verification-plan.json").read_text())
          assert plan["target_ref"]==os.environ["SOURCE"]
          route=next(c for c in plan["workflow_candidates"] if c["path"]==".github/workflows/semantic-context-reentry.yml")
          assert route["inspection_status"]=="NOT_ASSESSED" and route["execution_status"]=="NOT_RUN"
          assert "verification:sustained-reentry-hosted-context" in {s["claim_id"] for s in route["sources"]}
          assert plan["action_authorized"] is False and plan["coverage_established"] is False
          print("WORKFLOW_ROUTE="+json.dumps(route))
          print("PREFLIGHT="+json.dumps({k:check[k] for k in ("valid","claims_checked","relations_checked","existing_endpoints_checked")}))
          print("ACTUAL_HISTORICAL_VERIFICATION_CONTINUITY=PASS")
          PY
          python -m compileall -q src/sensemaking_skills/reentry_context.py src/sensemaking_skills/first_use.py
          test -z "$(git status --porcelain)"
      - name: Retain actual output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-cumulative-reentry
          path: |
            ${{ runner.temp }}/actual-handoff/handoff.json
            ${{ runner.temp }}/preflight.json
            ${{ runner.temp }}/*verification-plan.json
          retention-days: 14
