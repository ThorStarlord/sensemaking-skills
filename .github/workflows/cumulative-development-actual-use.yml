name: Cumulative development actual-use (execution branch only)
on:
  push:
    branches: [claude/cumulative-development-actual-execution-20261127]
permissions:
  contents: read
jobs:
  actual-reentry:
    if: github.ref == 'refs/heads/claude/cumulative-development-actual-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "79a2adc1a1fc1cb31d59a0c3af3c3bb21c427fd6"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Recover the preceding episode and its verification evidence
        run: |
          set -euo pipefail
          RECEIPT=".sensemaking/receipts/2026-11-27-adaptive-intellectual-organization-actual-use.session.yaml"
          sensemaking-skills handoff --repo . --output "$RUNNER_TEMP/actual-handoff" \
            --skill-path skills/using-sensemaking --expected-source-ref "$SOURCE" \
            --resume-from "$RECEIPT" \
            --question "Which verified or unverified prior responsibilities govern the next cumulative development decision?" --json > "$RUNNER_TEMP/handoff-output.json"
          sensemaking-skills semantic method context --repo . --ref "$SOURCE" \
            --question "How should a later agent recover prior verification limits and preserve conditional methodological experience before choosing work?" \
            --path src/sensemaking_skills/reentry_context.py --include-trials --limit 8 --json > "$RUNNER_TEMP/method-context.json"
          sensemaking-skills semantic verification-plan --repo . --ref "$SOURCE" \
            --path src/sensemaking_skills/semantic_cli.py --symbol register_semantic_commands --limit 60 --json > "$RUNNER_TEMP/previous-verification-plan.json"
          sensemaking-skills semantic verification-plan --repo . --ref "$SOURCE" \
            --path src/sensemaking_skills/reentry_context.py --symbol _project --limit 60 --json > "$RUNNER_TEMP/current-verification-plan.json"
          RECEIPT="$RECEIPT" python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          root=Path(os.environ["RUNNER_TEMP"])
          receipt=yaml.safe_load(Path(os.environ["RECEIPT"]).read_text())
          packet=json.loads((root/"actual-handoff"/"handoff.json").read_text())
          row=packet["continuity"]["selected_receipts"][0]
          assert row["path"] == os.environ["RECEIPT"]
          print("RECEIPT_VALIDATION="+json.dumps({k:row[k] for k in ("validation","projection_status","errors","errors_omitted")}))
          print("AUTHORED_VALIDATIONS="+json.dumps([{"id":r["id"],"validation":r["validation"]} for r in receipt["responsibilities"]]))
          if row["historical_projection"]:
              print("PROJECTED_RESPONSIBILITIES="+json.dumps(row["historical_projection"]["responsibilities"]))
          methods=json.loads((root/"method-context.json").read_text())
          assert methods["target_ref"]==os.environ["SOURCE"]
          print("METHOD_CANDIDATES="+json.dumps([{k:c[k] for k in ("id","procedure","recall_conditions","matched_paths","related_records_complete","applicability_to_present_task")} for c in methods["method_candidates"]]))
          for name in ("previous-verification-plan.json","current-verification-plan.json"):
              plan=json.loads((root/name).read_text())
              assert plan["target_ref"]==os.environ["SOURCE"]
              print(name+" CANDIDATES="+json.dumps({"pytest":plan["suggested_pytest"],"workflows":plan["workflow_candidates"],"counts":plan["counts"],"gaps":plan["gaps"]}))
          test_entries=[v for r in receipt["responsibilities"] for v in r["validation"]]
          print("AUTHORED_NOT_RUN_COUNT="+str(sum(v["result"]=="NOT_RUN" for v in test_entries)))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-cumulative-reentry
          path: |
            ${{ runner.temp }}/actual-handoff/handoff.json
            ${{ runner.temp }}/method-context.json
            ${{ runner.temp }}/*verification-plan.json
          retention-days: 14
