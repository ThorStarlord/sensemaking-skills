name: Actual architectural transformation (execution branch only)
on:
  push:
    branches: [claude/architectural-transformation-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/architectural-transformation-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: "6a89e6cd7c1e138f7e04cbcd16c90b03b421f73e"
      SOURCE: "8e3c85ed95aed81867113677a4a92e5548cd2520"
      CANDIDATE: "0521788a1882954838d8f86b345fa382e7e0f768"
      PACK: ".sensemaking/knowledge/committed-source-access-separation.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify reviewed knowledge and retained transformation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          DIR=src/sensemaking_skills/semantic_architecture
          for name in knowledge_sources source_access source_relationships refactor_preview knowledge_architecture knowledge_store; do
            test "$(git rev-parse "$SOURCE:$DIR/$name.py")" = "$(git rev-parse "$CANDIDATE:$DIR/$name.py")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:committed-source-access-separation --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] and not c["action_authorized"]
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          old=json.loads(subprocess.check_output(["git","show",os.environ["CANDIDATE"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          assert old["claims"][1]==new["claims"][1] and old["relations"]==new["relations"][:len(old["relations"])]
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          eco=q["possibility_ecology"]
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:committed-source-access-separation")
          f=e["predictions"][0]
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          assert eco["candidates"][0]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          assert f["prediction"]["attributes"]["value_frame"]==old["claims"][1]["attributes"]["value_frame"]
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"original_prediction_preserved":True,"exact_tested_source":True,"realization":eco["candidates"][0]["realization"]["value"]}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-architectural-transformation
          path: ${{ runner.temp }}/*.json
          retention-days: 14
