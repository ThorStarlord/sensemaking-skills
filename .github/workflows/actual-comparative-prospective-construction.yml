name: Actual comparative prospective construction (execution branch only)
on:
  push:
    branches: [claude/comparative-prospective-construction-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/comparative-prospective-construction-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: "c1f95ed50a0791a57faa4e96bba2e6415df446e8"
      SOURCE: "44d2d695dc94e5cbf013292c201eb06e4a47bf15"
      A: "5b610b350edce8497a39d44cd6d9adcd6a9a02b1"
      B: "d03f3ee8810fc254405db94f57ba1249f6ebd167"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check reviewed comparative contribution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          FILE=src/sensemaking_skills/patch_rehearsal.py
          test "$(git rev-parse "$SOURCE:$FILE")" = "$(git rev-parse "$B:$FILE")"
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal .sensemaking/knowledge/comparative-prospective-construction.json --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:prospective-intervention-rehearsal --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] is True and c["action_authorized"] is False
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and q["action_authorized"] is False
          e=q["possibility_ecology"]["value_feedback"]["entries"][0]
          assert e["possibility_id"]=="poss:prospective-intervention-rehearsal"
          f=e["predictions"][0]
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==2
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"selected_source_blob_matches":True}))
          PY
          python -m compileall -q "$FILE"
          test -z "$(git status --porcelain)"
      - name: Retain actual comparative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-comparative-prospective-construction
          path: ${{ runner.temp }}/*.json
          retention-days: 14
