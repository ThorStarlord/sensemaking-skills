name: Adaptive intellectual organization actual-use (execution branch only)
on:
  push:
    branches: [claude/adaptive-intellectual-organization-execution-20261127]
permissions:
  contents: read
jobs:
  decision-context:
    if: github.ref == 'refs/heads/claude/adaptive-intellectual-organization-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "ab180ba627e1a0f95406b74eb432268a7f13875f"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Inspect the actual file-level evidence omitted from the verification plan
        run: |
          set -euo pipefail
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation context-for src/sensemaking_skills/semantic_cli.py \
            --include-source-relationships --symbol register_semantic_commands --limit 60 --json > "$RUNNER_TEMP/actual-cli-context.json"
          sensemaking-skills semantic verification-plan --repo . --ref "$SOURCE" \
            --path src/sensemaking_skills/semantic_cli.py --symbol register_semantic_commands \
            --limit 60 --json > "$RUNNER_TEMP/actual-verification-plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"actual-cli-context.json").read_text())
          b=json.loads((root/"actual-verification-plan.json").read_text())
          assert a["target_ref"] == b["target_ref"] == os.environ["SOURCE"]
          rel=a["source_relationships"]
          print("FILE_TEST_REFERENCES="+json.dumps(rel["test_references"]))
          print("FILE_TEST_COUNTS="+json.dumps(rel["counts"]))
          existing={c["pytest_target"].split("::",1)[0] for c in b["pytest_candidates"]}
          print("PLAN_TEST_FILES="+json.dumps(sorted(existing)))
          print("ADDITIONAL_FILE_REFERENCES="+json.dumps([c for c in rel["test_references"] if c["path"] not in existing]))
          print("TRUNCATED="+json.dumps({"context":a["truncated"],"relationships":rel["truncated"],"plan":b["truncated"]}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual query output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-developmental-decision-context
          path: ${{ runner.temp }}/actual-*.json
          retention-days: 14
