name: Actual prospective value commitment (execution branch only)
on:
  push:
    branches: [claude/prospective-value-commitment-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/prospective-value-commitment-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: "71cf3c285fa81e6f9a1b8e28b5c33e210507788e"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          test -z "$(git status --porcelain)"
      - name: Recover reviewed original value frame before any later outcome
        run: |
          set -euo pipefail
          DRAFT="artifacts/history/2026-11-27-prospective-value-commitment-DRAFT.json"
          echo "6a5bb268c794cdc8d6a441a285668b236e139f50d841223b9a2f556fe79eb22e  $DRAFT" | sha256sum -c -
          sensemaking-skills semantic knowledge-proposal-check --repo . \
            --proposal .sensemaking/knowledge/prospective-value-commitment.json --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation possibility-ecology --subject poss:prospective-value-commitment --limit 80 \
            --json > "$RUNNER_TEMP/focused.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" \
            --operation possibility-ecology --subject goal:domain-general-cognitive-development \
            --method-question "How should value hypotheses and observed outcomes inform choosing useful construction without unnecessary retrieval or qualification?" \
            --include-method-trials --limit 150 --json > "$RUNNER_TEMP/family.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          old=json.loads(Path("artifacts/history/2026-11-27-prospective-value-commitment-DRAFT.json").read_text())
          reviewed=json.loads(Path(".sensemaking/knowledge/prospective-value-commitment.json").read_text())
          assert old["claims"][1]==reviewed["claims"][1] and old["relations"]==reviewed["relations"]
          check=json.loads((p/"preflight.json").read_text())
          assert check["valid"] is True and check["action_authorized"] is False
          print("REVIEWED_PREFLIGHT="+json.dumps({k:check[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          for name in ("focused.json","family.json"):
              q=json.loads((p/name).read_text())
              assert q["target_ref"]==os.environ["SOURCE"] and q["action_authorized"] is False
              e=q["possibility_ecology"]
              f=e["value_feedback"]
              x=next(v for v in f["entries"] if v["possibility_id"]=="poss:prospective-value-commitment")
              row=x["predictions"][0]
              assert row["prediction"]["statement"]==old["claims"][1]["statement"]
              assert row["prediction"]["attributes"]["value_frame"]==old["claims"][1]["attributes"]["value_frame"]
              assert row["standing"]=="NO_ASSESSMENT" and row["assessment_total"]==0
              assert row["prediction"]["epistemic_status"]=="hypothetical" and x["review_total"]==0
              cand=next(c for c in e["candidates"]+e["descendant_goal_candidates"] if c["claim_id"]=="poss:prospective-value-commitment")
              assert cand["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
              assert cand["realization"]["history"][-1]["value"]=="HYPOTHETICAL"
              print("VALUE_COMMITMENT="+json.dumps({"query":name,"candidates":f["visible_candidate_total"],"with_prediction":f["candidates_with_predictions"],"unassessed_candidates":f["candidates_without_predictions"],"standing":row["standing"],"assessment_total":row["assessment_total"],"original_frame_preserved":True,"realization":cand["realization"]["value"]}))
              if name=="family.json":
                  print("METHOD_PRECEDENTS="+json.dumps([c["id"] for c in q["method_precedents"]["method_candidates"]]))
                  other=next(v for v in f["entries"] if v["possibility_id"]=="poss:detached-possibility-stewardship")
                  assert other["predictions"][0]["standing"]=="PARTIALLY_OBSERVED" and other["review_total"]==1
          print("ACTUAL_PROSPECTIVE_FEEDBACK=PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-prospective-value-commitment
          path: ${{ runner.temp }}/*.json
          retention-days: 14
