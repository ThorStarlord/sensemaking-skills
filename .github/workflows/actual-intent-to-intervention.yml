name: Actual intent to intervention development (execution branch only)
on:
  push:
    branches: [claude/intent-to-intervention-execution-20261127]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/intent-to-intervention-execution-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: "4e071b2f7b0576107e868889ec69777a95b1cd59"
      CANDIDATE: "107bdeb2d9bbc8abc518817e349b394c5acd6a21"
      PACK: ".sensemaking/knowledge/architectural-source-route.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check reviewed architectural route lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python -m pip install -e .
          for path in src/sensemaking_skills/semantic_architecture/source_relationships.py src/sensemaking_skills/semantic_cli.py; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "$CANDIDATE:$path")"
          done
          sensemaking-skills semantic knowledge-proposal-check --repo . --proposal "$PACK" --json > "$RUNNER_TEMP/preflight.json"
          sensemaking-skills semantic workspace-query --repo . --ref "$SOURCE" --operation possibility-ecology --subject poss:architectural-source-route --limit 80 --json > "$RUNNER_TEMP/feedback.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          c=json.loads((p/"preflight.json").read_text())
          assert c["valid"] and c["action_authorized"] is False
          print("REVIEWED_PREFLIGHT="+json.dumps({k:c[k] for k in ("claims_checked","relations_checked","existing_endpoints_checked")}))
          old=json.loads(subprocess.check_output(["git","show",os.environ["CANDIDATE"]+":"+os.environ["PACK"]]))
          new=json.loads(Path(os.environ["PACK"]).read_text())
          assert old["claims"][1]==new["claims"][1] and old["relations"]==new["relations"][:len(old["relations"])]
          q=json.loads((p/"feedback.json").read_text())
          assert q["target_ref"]==os.environ["SOURCE"] and not q["action_authorized"]
          eco=q["possibility_ecology"]
          e=next(x for x in eco["value_feedback"]["entries"] if x["possibility_id"]=="poss:architectural-source-route")
          f=e["predictions"][0]
          assert f["standing"]=="PARTIALLY_OBSERVED" and f["assessment_total"]==1
          assert eco["candidates"][0]["realization"]["value"]=="PARTIALLY_IMPLEMENTED"
          assert f["prediction"]["attributes"]["value_frame"]==old["claims"][1]["attributes"]["value_frame"]
          print("REVIEWED_FEEDBACK="+json.dumps({"standing":f["standing"],"assessments":f["assessment_total"],"original_prediction_preserved":True,"exact_tested_source":True,"realization":eco["candidates"][0]["realization"]["value"]}))
          PY
          test -z "$(git status --porcelain)"
      - name: Retain actual intent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-intent-to-intervention
          path: ${{ runner.temp }}/*.json
          retention-days: 14
