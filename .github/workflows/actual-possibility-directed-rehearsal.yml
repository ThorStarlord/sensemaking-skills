name: Actual possibility-directed intervention (execution branch only)
on:
  push:
    branches: [claude/possibility-directed-rehearsal-execution-20261128]
permissions:
  contents: read
jobs:
  actual-use:
    if: github.ref == 'refs/heads/claude/possibility-directed-rehearsal-execution-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: "3bccadb5c31b59ebe7d5d7f461bd673e3d6bd48c"
      CANDIDATE: "64e432ebb2a8a375892d4a5a07a7874d1a6d86c4"
      OLD: "6a89e6cd7c1e138f7e04cbcd16c90b03b421f73e"
      TRANSFORMED: "7eae25dbf5f29280b1c1473d0c41c43839f7b034"
      PACK: ".sensemaking/knowledge/possibility-directed-intervention-rehearsal.json"
      FOCUS: "poss:prospective-source-knowledge-codesign"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rehearse actual candidate using canonical BASE implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m pip install -e .
          git diff --no-ext-diff --no-textconv --no-renames "$BASE" "$CANDIDATE" -- > "$RUNNER_TEMP/actual.patch"
          git worktree add --detach "$RUNNER_TEMP/target" "$BASE"
          sensemaking-skills semantic patch-rehearsal --repo "$RUNNER_TEMP/target" --ref "$BASE" --patch-file "$RUNNER_TEMP/actual.patch" --knowledge-proposal "$PACK" --limit 80 --json > "$RUNNER_TEMP/before.json"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          q=json.loads((p/"before.json").read_text())
          assert q["base_ref"]==os.environ["BASE"] and q["status"]=="REHEARSED"
          assert q["patch_sha256"]==hashlib.sha256((p/"actual.patch").read_bytes()).hexdigest()
          assert len(q["files"])==7
          for f in q["files"]:
              raw=subprocess.check_output(["git","show",os.environ["CANDIDATE"]+":"+f["path"]])
              assert hashlib.sha256(raw).hexdigest()==f["after_sha256"]
              if f["change_kind"]=="MODIFIED":
                  old=subprocess.check_output(["git","show",os.environ["BASE"]+":"+f["path"]])
                  assert hashlib.sha256(old).hexdigest()==f["before_sha256"]
              else:
                  assert f["before_sha256"] is None
              if f["path"].endswith(".py"):
                  assert f["python_syntax"]=="PASS"
          k=q["candidate_knowledge"]
          print("CODESIGN_PREFLIGHT="+json.dumps(k))
          assert k["status"]=="MECHANICALLY_VALID" and not k["accepted"]
          assert k["validation"]["claims_checked"]==3 and k["validation"]["relations_checked"]==7
          assert q["review"]["base_ref"]==q["review"]["target_ref"]==os.environ["BASE"]
          assert set(q["review"]["review_scope"]["selected_paths"])=={f["path"] for f in q["files"]}
          assert not q["review"]["review_scope"]["working_changes_indexed"]
          assert not any(q[x] for x in ("action_authorized","semantic_truth_established","active_checkout_patch_applied","target_code_executed","tests_executed","patched_bytes_indexed"))
          print("CODESIGN="+json.dumps({"patch_sha256":q["patch_sha256"],"files":len(q["files"]),"review_truncated":q["review"]["truncated"],"syntax_pass_count":sum(f["python_syntax"]=="PASS" for f in q["files"])}))
          PY
          test -z "$(git status --porcelain)"
      - name: Exercise possibility-directed construction on the actual patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/target"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          run() { sensemaking-skills semantic patch-rehearsal --repo "$TARGET" --ref "$BASE" --patch-file "$RUNNER_TEMP/actual.patch" --knowledge-proposal "$PACK" --limit 80 --json "$@"; }
          run > "$RUNNER_TEMP/after-default.json"
          run --possibility "$FOCUS" > "$RUNNER_TEMP/directed.json"
          sensemaking-skills semantic workspace-query --repo "$TARGET" --ref "$BASE" --operation possibility-ecology --subject "$FOCUS" --limit 80 --index-dir "$RUNNER_TEMP/standalone-index" --json > "$RUNNER_TEMP/ecology.json"
          # A real earlier source-transformation slice touches a declared component-owned file.
          FILE=src/sensemaking_skills/semantic_architecture/knowledge_architecture.py
          git diff --no-ext-diff --no-textconv --no-renames "$OLD" "$TRANSFORMED" -- "$FILE" > "$RUNNER_TEMP/owned.patch"
          test -s "$RUNNER_TEMP/owned.patch"
          sensemaking-skills semantic patch-rehearsal --repo "$TARGET" --ref "$OLD" --patch-file "$RUNNER_TEMP/owned.patch" --possibility poss:architectural-source-route --limit 80 --json > "$RUNNER_TEMP/ownership.json"
          if run --possibility goal:compounding-product-knowledge > "$RUNNER_TEMP/goal.json" 2>"$RUNNER_TEMP/goal.err"; then exit 1; fi
          if run --possibility poss:possibility-directed-intervention-rehearsal > "$RUNNER_TEMP/missing.json" 2>"$RUNNER_TEMP/missing.err"; then exit 1; fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          def read(name): return json.loads((p/(name+".json")).read_text())
          before,default,directed=read("before"),read("after-default"),read("directed")
          # Temporary cache paths are not returned by rehearsal. Disposable
          # worktree paths may occur in context metadata; compare after normalizing
          # only such exact path strings, not semantic payloads.
          def normalize(x):
              if isinstance(x,dict):
                  return {k:normalize(v) for k,v in x.items()}
              if isinstance(x,list): return [normalize(v) for v in x]
              if isinstance(x,str):
                  import re
                  return re.sub(r'/tmp/sensemaking-[^/\s]+/[^/\s]+', '<DISPOSABLE_CHECKOUT>', x)
              return x
          context=directed.pop("possibility_context")
          if normalize(before)!=normalize(default):
              print("DEFAULT_DIFFERING_KEYS="+json.dumps([k for k in set(before)|set(default) if normalize(before.get(k))!=normalize(default.get(k))]))
          assert normalize(before)==normalize(default), "default rehearsal changed"
          if normalize(directed)!=normalize(default):
              print("DIRECTED_DIFFERING_KEYS="+json.dumps([k for k in set(directed)|set(default) if normalize(directed.get(k))!=normalize(default.get(k))]))
          assert normalize(directed)==normalize(default), "opt-in altered existing rehearsal"
          assert context["base_ref"]==os.environ["BASE"] and context["possibility_id"]==os.environ["FOCUS"]
          assert context["review_index_reused"] and context["index_state"]=="reused"
          assert context["possibility_ecology"]==read("ecology")["possibility_ecology"]
          rows={f["path"]:f for f in context["patch_path_context"]}
          assert set(rows)=={f["path"] for f in default["files"]}
          match=rows["src/sensemaking_skills/patch_rehearsal.py"]
          assert match["base_tree_status"]=="REGULAR_FILE" and match["status"]=="AUTHORED_MATCH"
          caps={m["record_id"] for m in match["matches"] if m["basis"]=="REQUIRED_CAPABILITY_EVIDENCE"}
          assert {"cap:prospective-definition-comparison","cap:prospective-intervention-rehearsal"} <= caps, caps
          new=[rows[f["path"]] for f in default["files"] if f["change_kind"]=="ADDED"]
          assert len(new)==2 and all(x["base_tree_status"]=="ABSENT_FROM_TREE" and x["status"]=="NOT_ASSESSED" for x in new)
          assert not any(context[k] for k in ("coverage_complete","implementation_verified","action_authorized"))
          ownership=read("ownership")["possibility_context"]
          assert ownership["base_ref"]==os.environ["OLD"]
          owned=ownership["patch_path_context"][0]
          assert owned["path"]=="src/sensemaking_skills/semantic_architecture/knowledge_architecture.py"
          assert owned["base_tree_status"]=="REGULAR_FILE"
          assert any(m["basis"]=="COMPONENT_OWNED_PATH" and m["record_id"]=="component:semantic-knowledge-plane" for m in owned["matches"]), owned
          assert any(m["basis"]=="REQUIRED_CAPABILITY_EVIDENCE" and m["record_id"]=="cap:path-scoped-architecture-context" for m in owned["matches"]), owned
          assert "opportunity claim at BASE" in (p/"goal.err").read_text()
          assert "subject is not an indexed claim" in (p/"missing.err").read_text()
          print("DIRECTED="+json.dumps({"focus":context["possibility_id"],"base_ref":context["base_ref"],"index_state":context["index_state"],"standalone_ecology_equal":True,"default_payload_equal":True,"opt_in_preserves_default":True,"path_count":len(rows),"required_capability_evidence_matches":sorted(caps),"new_paths":new,"context_truncated":context["truncated"],"ownership_path":owned,"goal_refused":True,"candidate_only_possibility_refused":True}))
          PY
          test "$(git -C "$TARGET" rev-parse HEAD)" = "$BASE"
          test -z "$(git -C "$TARGET" status --porcelain)"
          test -z "$(git status --porcelain)"
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-possibility-directed-rehearsal
          path: ${{ runner.temp }}/*.json
          retention-days: 14
