name: Product Validation

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  campaign-product:
    name: Campaign product (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert exact-head checkout
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::exact-head checkout mismatch ($actual != $expected)"
            exit 1
          }

      - name: Install shipped product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests ruff

      - name: Version 1.0 release contract
        run: python scripts/validate-release-contract.py --repo-root .

      - name: Contract authority graph
        run: python scripts/validate-contract-authority.py --repo-root .

      - name: Current documentation
        run: python scripts/validate-docs-currentness.py --repo-root .

      - name: Product/lab boundary contract
        run: python scripts/validate-product-boundary.py

      - name: Frozen public Python API
        run: python -m pytest tests/test_public_api_contract.py tests/test_cli_contract.py tests/test_cli_json_contract.py -q

      - name: Shipped-source static quality
        run: >-
          ruff check
          src/sensemaking_skills/campaign_semantics
          src/sensemaking_skills/campaigns
          src/sensemaking_skills/commands
          src/sensemaking_skills/defaults
          src/sensemaking_skills/semantic_architecture
          src/sensemaking_skills/skills
          src/sensemaking_skills/setup_skills.py
          src/sensemaking_skills/cli.py
          src/sensemaking_skills/strategy_cli.py
          src/sensemaking_skills/organization.py
          src/sensemaking_skills/organization_cli.py
          --select E4,E7,E9,F

      - name: Error-boundary audit
        run: python scripts/validate-error-boundaries.py

      - name: Campaign product suite
        shell: bash
        run: |
          python -m pytest \
            tests/test_campaign_contract_roundtrip.py \
            tests/test_product_lab_boundary.py \
            tests/test_organization_tracer_v0.py \
            tests/campaign_validation/test_artifact_admission.py \
            tests/campaign_validation/test_campaign_*.py \
            tests/campaign_validation/test_pm_measurement.py \
            tests/campaign_validation/test_release_candidate_contract.py \
            tests/campaign_validation/test_repo_sensemaker_connector_probe_contract.py \
            tests/integration/test_external_golden_path_qualification.py \
            -q

      - name: Capability outcome binding and continuation projection
        shell: bash
        run: |
          WS="$RUNNER_TEMP/campaign-capability-outcome"
          rm -rf "$WS"
          sensemaking-skills campaign init \
            --workspace "$WS" \
            --campaign-id CMP-OUTCOME \
            --mission "Verify capability outcome binding" \
            --json >/dev/null
          sensemaking-skills campaign advance \
            --workspace "$WS" \
            --decision "Advance to a bounded responsibility" \
            --responsibility-id R-1 \
            --responsibility-statement "Probe the binding surface" \
            --decision-blocked "Whether the binding projects" \
            --scope "Hosted mechanical contract check" \
            --authority authorized_autonomously \
            --success-condition "The binding projects through both consumers" \
            --json >/dev/null
          sensemaking-skills campaign capability-outcome bind \
            --workspace "$WS" \
            --decision "Bind the selected outcome" \
            --possibility-id poss:test \
            --desired-behavior "Recover the governing outcome" \
            --completion-condition "A fresh consumer sees it" \
            --selection-basis "Mechanical contract check" \
            --source-ref "file:source.json" \
            --assumption "It is a hypothesis" \
            --counterevidence "It may be redundant" \
            --required-capability cap:test \
            --remaining-condition "Use it in a real decision" \
            --json > "$RUNNER_TEMP/capability-outcome-bind.json"
          sensemaking-skills campaign working-context \
            --workspace "$WS" --json > "$RUNNER_TEMP/capability-outcome-working.json"
          sensemaking-skills campaign resume-profile \
            --workspace "$WS" --profile working --json > "$RUNNER_TEMP/capability-outcome-resume.json"
          python - <<'PY'
          import json
          import os

          root = os.environ["RUNNER_TEMP"]
          with open(os.path.join(root, "capability-outcome-bind.json"), encoding="utf-8") as stream:
              bound = json.load(stream)
          with open(os.path.join(root, "capability-outcome-working.json"), encoding="utf-8") as stream:
              working = json.load(stream)
          with open(os.path.join(root, "capability-outcome-resume.json"), encoding="utf-8") as stream:
              resumed = json.load(stream)

          assert bound["code"] == "CAPABILITY_OUTCOME_BOUND"
          outcome = bound["state"]["extensions"]["capability_outcome"]
          assert outcome["possibility_id"] == "poss:test"
          assert outcome["epistemic_status"] == "selected_hypothesis"
          assert outcome["realization"] == "not_established"
          assert bound["state"]["active_responsibility"]["id"] == "R-1"
          assert working["capability_outcome"]["possibility_id"] == "poss:test"
          assert working["capability_outcome"]["remaining_conditions"] == ["Use it in a real decision"]
          assert resumed["capability_outcome"]["assumptions"] == ["It is a hypothesis"]
          assert resumed["active_responsibility"]["id"] == "R-1"
          assert resumed["semantic_recommendation_included"] is False
          print("Capability outcome binding is durable and projected without selecting an action.")
          PY
          sensemaking-skills campaign validate --workspace "$WS" --json >/dev/null

      - name: Assert tests did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::product tests dirtied the working tree"
            exit 1
          }

  installed-wheel:
    name: Installed core wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Core wheel excludes source-only lab
        run: python -m pytest tests/campaign_validation/test_installed_wheel_smoke.py -q -rs

      - name: Installed Campaign and harness-adapter regressions
        run: |
          python -m pytest tests/campaign_validation/test_installed_wheel_p9.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_p10.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_p11.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_setup_skills.py -q -rs

      - name: Assert tests did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::wheel tests dirtied the working tree"
            exit 1
          }

  repository-contracts:
    name: Repository and Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install product and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests

      - name: Repository structural validation
        run: python scripts/validate-repo.py

      - name: Strategic state contract validation
        run: python scripts/validate-strategic-state.py --repo-root .

      - name: Strategic candidate-directions boundary validation
        run: python scripts/validate-candidate-directions.py --repo-root .

      - name: Canonical Probe Engine gate
        run: |
          python scripts/probe-repo.py --repo-root . --output "$RUNNER_TEMP/probe-report.yaml"
          python scripts/validate-probe-report.py "$RUNNER_TEMP/probe-report.yaml" --repo-root .
          python scripts/gate_relationship_findings.py --report "$RUNNER_TEMP/probe-report.yaml"

      - name: Semantic manifest and domain-pack conformance
        run: |
          sensemaking-skills semantic conformance \
            --manifests-dir skill-manifests \
            --domain-packs-dir domain-packs \
            --repo-root . \
            --json

      - name: Stable repository assertion suite
        run: |
          python -m pytest \
            tests/test_repo_probes.py \
            tests/test_probe_report_cli.py \
            tests/test_probe_relationships.py \
            tests/test_skill_distribution_probe.py \
            tests/test_gate_relationship_findings.py \
            tests/test_path_drift.py \
            tests/test_cli.py \
            tests/test_operations_runbook_authority.py \
            tests/test_candidate_directions_validation.py \
            tests/test_semantic_reasoning_profile.py \
            tests/test_skill_registry_liveness.py \
            tests/test_strategic_state_validation.py \
            tests/test_strategic_repository_analysis_contract.py \
            tests/test_strategic_repository_analysis_integration.py \
            tests/test_strategic_repository_sensemaking_closeout.py \
            tests/test_strategic_continuity_v1.py \
            tests/test_strategic_companion_artifacts.py \
            tests/test_multi_repository_strategic_analysis.py \
            tests/test_change_impact_analysis.py \
            tests/test_policy_hierarchy_interface_clarification_v1.py \
            tests/test_strategic_continuity_refinement_v1.py \
            tests/test_decision_journey_productization_v1.py \
            tests/test_decision_journey_productization_v1_closeout.py \
            tests/test_experiment_economy_v1.py \
            tests/test_experiment_economy_v1_closeout.py \
            tests/test_experiment_responsibility_boundary_v1.py \
            tests/test_experiment_responsibility_boundary_v1_closeout.py \
            tests/test_strategic_sensemaking_loop.py \
            tests/test_using_sensemaking_delegation_guidance.py \
            tests/test_autonomous_terminal_mission_v1.py \
            tests/test_strategic_normal_use_observation_guide.py \
            tests/test_semantic_substrate.py \
            tests/test_semantic_reference_audit.py \
            tests/test_semantic_conformance.py \
            tests/test_semantic_cli.py \
            tests/test_semantic_catalog.py \
            tests/test_release_authority_audit.py \
            tests/test_release_readiness_gate.py \
            -q

      - name: Assert verification did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::repository validation dirtied the working tree"
            exit 1
          }

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install product, lab, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests pytest-xdist ruff
          # Lab deps the full suite exercises. They are declared in
          # requirements-lab.txt; installed here explicitly so the full-suite
          # gate does not silently skip tests that import them (the previous
          # blind spot: the curated product subset never ran them, so CI stayed
          # green while the full suite failed).
          python -m pip install "rfc8785>=0.1.4,<0.2" "jsonschema>=4.18,<5.0"

      - name: Full suite (same command as local)
        run: python -m pytest -q -n auto

      - name: Assert the full suite did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::full suite dirtied the working tree"
            exit 1
          }

  filesystem-security-linux:
    name: Filesystem security (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-subtests pyyaml click
      - name: Gate A containment contracts
        run: |
          python -m pytest tests/test_gate_a_authorization_consumer.py -q
          python -m pytest tests/test_gate_a_path_canonicalization.py -q
          python -m pytest tests/test_gate_a_physical_containment.py -q -rs

  filesystem-security-windows:
    name: Filesystem security (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-subtests pyyaml click
      - name: Gate A Windows containment contracts
        run: |
          python -m pytest tests/test_gate_a_authorization_consumer.py -q
          python -m pytest tests/test_gate_a_path_canonicalization.py -q
          python -m pytest tests/test_gate_a_physical_containment.py -q -rs