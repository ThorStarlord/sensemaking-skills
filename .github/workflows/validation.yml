name: Product Validation

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  campaign-product:
    name: Campaign product (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert exact-head checkout
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::exact-head checkout mismatch ($actual != $expected)"
            exit 1
          }

      - name: Install shipped product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests ruff

      - name: Version 1.0 release contract
        run: python scripts/validate-release-contract.py --repo-root .

      - name: Contract authority graph
        run: python scripts/validate-contract-authority.py --repo-root .

      - name: Current documentation
        run: python scripts/validate-docs-currentness.py --repo-root .

      - name: Product/lab boundary contract
        run: python scripts/validate-product-boundary.py

      - name: Frozen public Python API
        run: python -m pytest tests/test_public_api_contract.py tests/test_cli_contract.py tests/test_cli_json_contract.py -q

      - name: Shipped-source static quality
        run: >-
          ruff check
          src/sensemaking_skills/campaign_semantics
          src/sensemaking_skills/campaigns
          src/sensemaking_skills/commands
          src/sensemaking_skills/defaults
          src/sensemaking_skills/semantic_architecture
          src/sensemaking_skills/skills
          src/sensemaking_skills/setup_skills.py
          src/sensemaking_skills/cli.py
          src/sensemaking_skills/strategy_cli.py
          --select E4,E7,E9,F

      - name: Error-boundary audit
        run: python scripts/validate-error-boundaries.py

      - name: Campaign product suite
        shell: bash
        run: |
          python -m pytest \
            tests/test_campaign_contract_roundtrip.py \
            tests/test_product_lab_boundary.py \
            tests/campaign_validation/test_artifact_admission.py \
            tests/campaign_validation/test_campaign_*.py \
            tests/campaign_validation/test_release_candidate_contract.py \
            tests/campaign_validation/test_repo_sensemaker_connector_probe_contract.py \
            tests/integration/test_external_golden_path_qualification.py \
            -q

      - name: Assert tests did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::product tests dirtied the working tree"
            exit 1
          }

  installed-wheel:
    name: Installed core wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Core wheel excludes source-only lab
        run: python -m pytest tests/campaign_validation/test_installed_wheel_smoke.py -q -rs

      - name: Installed Campaign and harness-adapter regressions
        run: |
          python -m pytest tests/campaign_validation/test_installed_wheel_p9.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_p10.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_p11.py -q -rs
          python -m pytest tests/campaign_validation/test_installed_wheel_setup_skills.py -q -rs

      - name: Assert tests did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::wheel tests dirtied the working tree"
            exit 1
          }

  repository-contracts:
    name: Repository and Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install product and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests

      - name: Repository structural validation
        run: python scripts/validate-repo.py

      - name: Strategic state contract validation
        run: python scripts/validate-strategic-state.py --repo-root .

      - name: Strategic candidate-directions boundary validation
        run: python scripts/validate-candidate-directions.py --repo-root .

      - name: Canonical Probe Engine gate
        run: |
          python scripts/probe-repo.py --repo-root . --output "$RUNNER_TEMP/probe-report.yaml"
          python scripts/validate-probe-report.py "$RUNNER_TEMP/probe-report.yaml" --repo-root .
          python scripts/gate_relationship_findings.py --report "$RUNNER_TEMP/probe-report.yaml"

      - name: Semantic manifest and domain-pack conformance
        run: |
          sensemaking-skills semantic conformance \
            --manifests-dir skill-manifests \
            --domain-packs-dir domain-packs \
            --repo-root . \
            --json

      - name: Stable repository assertion suite
        run: |
          python -m pytest \
            tests/test_repo_probes.py \
            tests/test_probe_report_cli.py \
            tests/test_probe_relationships.py \
            tests/test_skill_distribution_probe.py \
            tests/test_gate_relationship_findings.py \
            tests/test_path_drift.py \
            tests/test_cli.py \
            tests/test_operations_runbook_authority.py \
            tests/test_candidate_directions_validation.py \
            tests/test_semantic_reasoning_profile.py \
            tests/test_skill_registry_liveness.py \
            tests/test_strategic_state_validation.py \
            tests/test_policy_hierarchy_contract.py \
            tests/test_strategic_repository_analysis_contract.py \
            tests/test_strategic_repository_analysis_integration.py \
            tests/test_strategic_repository_sensemaking_closeout.py \
            tests/test_strategic_continuity_v1.py \
            tests/test_strategic_companion_artifacts.py \
            tests/test_multi_repository_strategic_analysis.py \
            tests/test_semantic_substrate.py \
            tests/test_semantic_reference_audit.py \
            tests/test_semantic_conformance.py \
            tests/test_semantic_cli.py \
            tests/test_semantic_catalog.py \
            tests/test_release_authority_audit.py \
            tests/test_release_readiness_gate.py \
            tests/test_execution_interface_closeout.py \
            -q

      - name: Assert verification did not mutate tracked state
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::repository validation dirtied the working tree"
            exit 1
          }

  filesystem-security-linux:
    name: Filesystem security (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-subtests pyyaml click
      - name: Gate A containment contracts
        run: |
          python -m pytest tests/test_gate_a_authorization_consumer.py -q
          python -m pytest tests/test_gate_a_path_canonicalization.py -q
          python -m pytest tests/test_gate_a_physical_containment.py -q -rs

  filesystem-security-windows:
    name: Filesystem security (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-subtests pyyaml click
      - name: Gate A Windows containment contracts
        run: |
          python -m pytest tests/test_gate_a_authorization_consumer.py -q
          python -m pytest tests/test_gate_a_path_canonicalization.py -q
          python -m pytest tests/test_gate_a_physical_containment.py -q -rs