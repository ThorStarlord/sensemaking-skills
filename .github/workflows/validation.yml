name: Validator Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================================
  # Gate A pytest security suites (issue #108, third independent review).
  #
  # These are SEPARATE, clearly named checks. The repository-validation job
  # below runs validation SCRIPTS; it does not execute a single pytest test.
  # The current Gate A lane validates the retained authorization consumer,
  # path canonicalization, and physical containment. Historical Evidence 0016
  # preparation/run-control suites were bound to the programmatic second-model
  # executors retired under ADR 0013 and are no longer canonical runtime gates.
  # A security suite that is red or never runs cannot support a merge
  # decision, so the retained jobs below are the load-bearing current checks.
  # ==========================================================================
  gate-a-tests-linux:
    name: Gate A tests (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests pyyaml click

      - name: Probe POSIX symlink capability
        run: |
          python - <<'PY'
          import os, tempfile, sys
          d = tempfile.mkdtemp()
          t = os.path.join(d, "t"); os.mkdir(t)
          try:
              os.symlink(t, os.path.join(d, "l"))
          except OSError as e:
              sys.exit(f"runner cannot create symlinks: {e}")
          print("symlink capability: OK")
          PY

      - name: Gate A authorization consumer
        run: python -m pytest tests/test_gate_a_authorization_consumer.py -q

      - name: Gate A path canonicalization
        run: python -m pytest tests/test_gate_a_path_canonicalization.py -q

      - name: Gate A physical containment (symlink tests MUST execute)
        run: |
          set -o pipefail
          python -m pytest tests/test_gate_a_physical_containment.py -q -rs \
            | tee /tmp/phys.txt
          # A silently skipped symlink test is a security gap, not a pass.
          if grep -i "SKIPPED" /tmp/phys.txt | grep -i "symlink"; then
            echo "::error::symlink security tests were SKIPPED on Linux CI"
            exit 1
          fi
          python -m pytest tests/test_gate_a_physical_containment.py \
            -k "symlink" -q -rs | tee /tmp/sym.txt
          grep -qE "[1-9][0-9]* passed" /tmp/sym.txt || {
            echo "::error::no symlink security test executed"; exit 1; }

  gate-a-tests-windows:
    name: Gate A tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests pyyaml click

      - name: Probe Windows filesystem capabilities
        # bash, not pwsh: PowerShell has no heredoc, so `python - <<'PY'`
        # is a parse error there. git-bash ships on the windows runner.
        shell: bash
        run: |
          # Automated capability probes, so a skip in the log is explained
          # rather than assumed. Junctions need no privilege; symlinks and 8.3
          # short-name generation may be unavailable.
          python - <<'PY'
          import ctypes, os, subprocess, tempfile
          from ctypes import wintypes
          d = tempfile.mkdtemp()
          tgt = os.path.join(d, "target"); os.mkdir(tgt)
          j = subprocess.run(["cmd", "/c", "mklink", "/J",
                              os.path.join(d, "j"), tgt],
                             capture_output=True, text=True)
          print("junction capability:", j.returncode == 0, j.stdout.strip())
          try:
              os.symlink(tgt, os.path.join(d, "s"))
              print("symlink capability: True")
          except OSError as e:
              print("symlink capability: False --", e)
          f = ctypes.windll.kernel32.GetShortPathNameW
          f.argtypes = [wintypes.LPCWSTR, wintypes.LPWSTR, wintypes.DWORD]
          f.restype = wintypes.DWORD
          buf = ctypes.create_unicode_buffer(1024)
          n = f(tgt, buf, 1024)
          print("8.3 short-name generation:",
                bool(n) and buf.value.casefold() != tgt.casefold(), buf.value)
          PY

      - name: Gate A authorization consumer
        run: python -m pytest tests/test_gate_a_authorization_consumer.py -q

      - name: Gate A path canonicalization
        run: python -m pytest tests/test_gate_a_path_canonicalization.py -q

      - name: Gate A physical containment (trailing dot, junctions, 8.3, ADS)
        run: python -m pytest tests/test_gate_a_physical_containment.py -q -rs

      - name: Assert the repository tree was not mutated by the suites
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/evidence/0016-stage1-auteur-post-remediation-controlled-attempt" || {
            echo "::error::a real Evidence 0016 directory was created"; exit 1; }

  # ==========================================================================
  # Phase 2 campaign-policy-validation suites (Issue #118, program Issue
  # #116). These exercise the NEW sensemaking_skills.campaign_validation
  # package: the Two-Lane YAML Profile v1 parser, RFC 8785 (rfc8785)
  # digests, JSON Schema validation, deterministic failure-code precedence,
  # deep immutability, and the shared path-containment characterization
  # proof. Installed via package metadata (pip install -e .), not a
  # hand-maintained dependency list, so pyproject.toml's declared runtime
  # dependencies (PyYAML, jsonschema, rfc8785) are always exactly what CI
  # installs.
  # ==========================================================================
  phase2-campaign-validation:
    name: Phase 2 campaign validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # GitHub's `pull_request` trigger normally checks out a SYNTHETIC
      # merge-preview ref (refs/pull/<n>/merge), not the exact PR head
      # commit. Explicitly check out the real head SHA on pull_request
      # events (github.event.pull_request.head.sha) and github.sha on push
      # events, so this job's result can honestly be described as
      # "exact-head CI" -- never a synthetic merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-subtests

      - name: Campaign validation suite
        run: python -m pytest tests/campaign_validation -q

      - name: Two-Lane schema contract tests (Phase 1, must remain green)
        run: python -m pytest tests/test_two_lane_schema_contracts.py -q

      - name: Path-containment extraction characterization
        run: python -m pytest tests/test_path_containment_extraction_characterization.py -q

      - name: Assert no real experiment/approval state was created
        run: |
          # `pip install -e .` legitimately regenerates the tracked
          # src/sensemaking_skills.egg-info/ metadata files as a side effect
          # of installation, not of running the test suite -- restore them
          # before checking for a dirtied tree so this check reflects what
          # the TESTS did, not what the install step did.
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/evidence" -o -z "$(find experiments/evidence -maxdepth 1 -name 'EXP-*' 2>/dev/null)" || {
            echo "::error::an EXP-* campaign directory was created"; exit 1; }

  # ==========================================================================
  # Installed-wheel smoke test: builds the real wheel, installs it (plus its
  # declared runtime dependencies) into a clean venv, and exercises the
  # public API from a directory with no repository docs/ or scripts/
  # available -- proving the package works from a real installed
  # distribution, not merely "from the repo checkout with everything on
  # sys.path already". A separate job (not a step folded into the job
  # above) so a wheel-packaging regression is distinguished at a glance from
  # an ordinary test failure.
  # ==========================================================================
  phase2-wheel-smoke:
    name: Phase 2 installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      # See phase2-campaign-validation's checkout step comment: explicit
      # exact-head checkout, never a synthetic pull_request merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project (so the wheel-smoke test itself can run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run the installed-wheel bundle-validation smoke test
        run: python -m pytest tests/campaign_validation/test_installed_wheel_smoke.py -q -rs

      - name: Run the installed-wheel distribution regression test (Task P1-F)
        run: python -m pytest tests/campaign_validation/test_installed_wheel_setup_skills.py -q -rs

  # ==========================================================================
  # Phase 3 exploratory-authorization suites (Issue #119, program Issue
  # #116). These exercise the four-lane authorization model (ORDINARY /
  # CANONICAL / EXPLORATORY / AMBIGUOUS): lane derivation from the actual
  # invocation in scripts/gate_a_authorization.py and the exploratory
  # capability lifecycle in sensemaking_skills.exploratory_authorization
  # (mint / consume / burn). Programmatic executor/import-isolation proofs were
  # retired with the second-model executors under ADR 0013. No real model is
  # ever invoked by these tests.
  # ==========================================================================
  phase3-exploratory-authorization:
    name: Phase 3 exploratory authorization
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # See phase2-campaign-validation's checkout step comment: explicit
      # exact-head checkout, never a synthetic pull_request merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-subtests

      - name: Exploratory digests suite
        run: python -m pytest tests/test_exploratory_digests.py -q

      - name: Exploratory lane derivation suite
        run: python -m pytest tests/test_exploratory_lane_derivation.py -q

      - name: Exploratory capability lifecycle suite
        run: python -m pytest tests/test_exploratory_capability_lifecycle.py -q

      - name: Assert no real experiment/approval state was created
        run: |
          # `pip install -e .` legitimately regenerates the tracked
          # src/sensemaking_skills.egg-info/ metadata files as a side effect
          # of installation, not of running the test suite -- restore them
          # before checking for a dirtied tree so this check reflects what
          # the TESTS did, not what the install step did.
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/evidence" -o -z "$(find experiments/evidence -maxdepth 1 -name 'EXP-*' 2>/dev/null)" || {
            echo "::error::an EXP-* campaign directory was created"; exit 1; }

  # ==========================================================================
  # Phase 4 durable campaign-accounting suites (Issue #120, program Issue
  # #116). These exercise the append-only tamper-evident campaign ledger
  # (ledger.jsonl hash chain), durable attempt reservations and budgets,
  # the attempt state machine, atomic raw-output preservation, the
  # Phase 3 + Phase 4 provider boundary (invoke_exploratory_attempt with a
  # spy provider -- zero provider calls on every denial path), the derived
  # campaign summary (fail-closed on orphan results / missing attempt dirs /
  # malformed ledgers), crash recovery, and real subprocess kill tests
  # proving a process crash cannot erase an attempt. No real model is ever
  # invoked; no EXP-* campaign state is created.
  # ==========================================================================
  phase4-campaign-ledger:
    name: Phase 4 campaign ledger
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Exact-head checkout, never a synthetic pull_request merge ref (same
      # rationale as phase3-exploratory-authorization).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Campaign ledger suite
        run: python -m pytest tests/campaign_accounting/test_ledger.py -q

      - name: Durable reservation suite
        run: python -m pytest tests/campaign_accounting/test_reservation.py -q

      - name: Outcome recorder suite
        run: python -m pytest tests/campaign_accounting/test_recorder.py -q

      - name: Provider-boundary suite
        run: python -m pytest tests/campaign_accounting/test_boundary.py -q

      - name: Campaign summary suites
        run: |
          python -m pytest tests/campaign_accounting/test_summary.py -q
          python -m pytest tests/campaign_accounting/test_summary_integrity.py -q

      - name: Recovery and crash-safety suites
        run: |
          python -m pytest tests/campaign_accounting/test_recovery.py -q
          python -m pytest tests/campaign_accounting/test_crash_safety.py -q

      - name: Assert no real experiment/approval state was created
        run: |
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/evidence" -o -z "$(find experiments/evidence -maxdepth 1 -name 'EXP-*' 2>/dev/null)" || {
            echo "::error::an EXP-* campaign directory was created"; exit 1; }

  # ==========================================================================
  # Phase 4 Windows path confinement (Issue #120). The device-name defect is
  # Windows-specific (DOS device aliasing: con.md / nul / com1.log can block
  # or raise raw OSErrors inside the locked artifact-write path), so the
  # lexical and subprocess proof suites must run on windows-latest. Kept
  # structurally separate from the canonical Gate A Windows job. No
  # provider/network call is made; every probe is a local test double.
  # ==========================================================================
  phase4-windows-path-confinement:
    name: Phase 4 Windows path confinement
    runs-on: windows-latest
    steps:
      # Exact-head checkout, never a synthetic pull_request merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          $resolved = git rev-parse HEAD
          Write-Host "Resolved checkout SHA: $resolved"
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          Write-Host "Expected exact head SHA: $expected"
          if ($resolved -ne $expected) {
            Write-Error "checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Artifact path-confinement suite
        run: python -m pytest tests/campaign_accounting/test_artifact_path_confinement.py -q

      - name: Windows device-name subprocess proofs
        run: python -m pytest tests/campaign_accounting/test_artifact_path_confinement_windows.py -q

      - name: Assert no real experiment/approval state was created
        shell: bash
        run: |
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/evidence" -o -z "$(find experiments/evidence -maxdepth 1 -name 'EXP-*' 2>/dev/null)" || {
            echo "::error::an EXP-* campaign directory was created"; exit 1; }

  # ==========================================================================
  # Phase 5 EXP-0001 preparation package (Issue #121). The package is a
  # PROPOSAL: policy/configuration/digest materials plus a clearly
  # non-operative approval template. This job re-validates the written
  # package files with the real Phase 2 validators and proves the package
  # cannot become operative (no bundle, capability, reservation, or
  # provider path) and leaves zero execution residue. No provider/network
  # call is made.
  # ==========================================================================
  phase5-exp0001-preparation:
    name: Phase 5 EXP-0001 preparation package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Exact-head checkout, never a synthetic pull_request merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: EXP-0001 preparation package suite
        run: python -m pytest tests/campaign_preparation -q

      - name: Assert no runtime experiment/approval state was created
        run: |
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          # The tracked preparation package may exist; untracked runtime
          # state (ledgers, attempts, approvals) must not.
          test ! -e "experiments/evidence" -o -z "$(find experiments/evidence -maxdepth 1 -name 'EXP-*' 2>/dev/null)" || {
            echo "::error::an EXP-* campaign directory was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0001-stage1-auteur-autonomy-pilot/ledger.jsonl" || {
            echo "::error::a campaign ledger was created"; exit 1; }
          test ! -d "experiments/campaigns/EXP-0001-stage1-auteur-autonomy-pilot/attempts" || {
            echo "::error::an attempts directory was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/ledger.jsonl" || {
            echo "::error::an EXP-0002 campaign ledger was created"; exit 1; }
          test ! -d "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/attempts" || {
            echo "::error::an EXP-0002 attempts directory was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/approval.yaml" || {
            echo "::error::an EXP-0002 operative approval was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/approval.md" || {
            echo "::error::an EXP-0002 conversation receipt was created"; exit 1; }

  # ==========================================================================
  # Phase 6 correction -- framework-governed execution boundary (Issue #122).
  # The provider-permit matrix, the signed-commit approval-binding matrix
  # (real temp repos, signature seams stubbed), the target-checkout
  # materializer, the full-tree framework-drift proof, the governed runner
  # lifecycle (resume, mint-failure terminalization, per-attempt clock),
  # and the Issue #122 report completeness suite. No provider, approval,
  # reservation, or ledger is ever created.
  # ==========================================================================
  phase6-execution-boundary:
    name: Phase 6 execution boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Exact-head checkout, never a synthetic pull_request merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and assert the resolved checkout SHA
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "Resolved checkout SHA: $resolved"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected" || {
            echo "::error::checked-out HEAD ($resolved) does not match the expected exact head ($expected)"
            exit 1
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Phase 6 execution-boundary suite
        run: python -m pytest tests/execution_infra_tests -q

      - name: Assert no runtime experiment/approval state was created
        run: |
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::test run dirtied the working tree"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0001-stage1-auteur-autonomy-pilot/ledger.jsonl" || {
            echo "::error::a campaign ledger was created"; exit 1; }
          test ! -d "experiments/campaigns/EXP-0001-stage1-auteur-autonomy-pilot/attempts" || {
            echo "::error::an attempts directory was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/ledger.jsonl" || {
            echo "::error::an EXP-0002 campaign ledger was created"; exit 1; }
          test ! -d "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/attempts" || {
            echo "::error::an EXP-0002 attempts directory was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/approval.yaml" || {
            echo "::error::an EXP-0002 operative approval was created"; exit 1; }
          test ! -e "experiments/campaigns/EXP-0002-stage1-auteur-coding-agent-pilot/approval.md" || {
            echo "::error::an EXP-0002 conversation receipt was created"; exit 1; }

  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Level 1 — Repository structural validation
        run: python scripts/validate-repo.py

      - name: Level 2/3 — Validator Verification Suite
        run: python scripts/test-validators.py

      - name: Level 4 — Run Log Validation & Failure Analysis
        run: |
          echo "=== Validate all run logs (dynamically discovered) ==="
          # Discover all run logs by pattern — catches *run_log* files plus
          # the older completion-log naming convention. This stays current
          # as new workflow families add their evidence.
          find artifacts -maxdepth 1 \( -name '*run_log*' -o -name '*completion_log*' \) -type f | sort | while IFS= read -r f; do
            echo "  Validating: $f"
            python scripts/validate-run-log.py "$f" --repo-root . || exit 1
          done

          echo "=== Analyze failure ledger ==="
          python scripts/analyze-run-failures.py --logs-dir artifacts

      - name: Level 5 — Mode Coverage Self-Validation
        run: python scripts/validate-mode-coverage.py --repo-root .

  # ==========================================================================
  # Canonical enforcement gate (enforcement-gap diagnosis follow-up). The
  # repository has substantial verification machinery; these jobs make the
  # smallest reliable slice of it load-bearing on every push/PR. Contract
  # and promotion policy: docs/enforcement-contract.md.
  #
  # probe-gate: runs the CANONICAL Probe Engine (probe-repo.py) against the
  # checkout, validates the report shape, then applies the explicit
  # blocking policy (scripts/gate_relationship_findings.py). Only
  # mechanically decidable finding types block (currently: missing ADR
  # references, missing **Status** lines). Findings the probe flags as
  # requiring semantic review NEVER block - repo-sensemaker owns
  # interpretation, per the evidence-vs-diagnosis contract.
  #
  # core-assertions: the smallest stable pytest gate. Deliberately NOT
  # "run every pytest file": it covers the Probe Engine, the canonical
  # path/vocabulary drift detectors, and the CLI contract.
  # ==========================================================================
  probe-gate:
    name: Probe Engine enforcement gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest click

      - name: Run canonical Probe Engine (report to temp; never mutates tree)
        run: python scripts/probe-repo.py --repo-root . --output "$RUNNER_TEMP/probe-report.yaml"

      - name: Validate probe report shape
        run: python scripts/validate-probe-report.py "$RUNNER_TEMP/probe-report.yaml" --repo-root .

      - name: Apply blocking-findings policy
        run: python scripts/gate_relationship_findings.py --report "$RUNNER_TEMP/probe-report.yaml"

      - name: Assert the repository tree was not mutated
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::probe gate dirtied the working tree"; exit 1; }

  core-assertions:
    name: Core assertions (smallest stable pytest gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          pip install pytest pyyaml click

      - name: Core assertion suite
        run: python -m pytest tests/test_repo_probes.py tests/test_probe_report_cli.py tests/test_probe_relationships.py tests/test_skill_distribution_probe.py tests/test_gate_relationship_findings.py tests/test_path_drift.py tests/test_cli.py -q

      - name: Assert the repository tree was not mutated
        shell: bash
        run: |
          git checkout -- src/sensemaking_skills.egg-info/ 2>/dev/null || true
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::core assertions dirtied the working tree"; exit 1; }
