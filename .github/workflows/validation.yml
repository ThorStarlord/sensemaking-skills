name: Validator Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Level 1 — Repository structural validation
        run: python scripts/validate-repo.py

      - name: Level 2/3 — Validator Verification Suite
        run: python scripts/test-validators.py
