name: Release Candidate Distribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  distribution:
    name: v0.3 release distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact-head checkout
        run: |
          resolved="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Resolved checkout SHA: $resolved"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests build twine

      - name: Release baseline contracts
        run: |
          python scripts/validate-product-boundary.py
          python -m pytest \
            tests/campaign_validation/test_release_candidate_contract.py \
            tests/campaign_validation/test_campaign_schema_evolution.py \
            tests/integration/test_external_golden_path_qualification.py \
            -q

      - name: Build wheel and sdist
        run: |
          rm -rf build dist
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Assert v0.3.0 artifact identities
        run: |
          python - <<'PY'
          from pathlib import Path

          names = {path.name for path in Path("dist").iterdir() if path.is_file()}
          expected = {
              "sensemaking_skills-0.3.0-py3-none-any.whl",
              "sensemaking_skills-0.3.0.tar.gz",
          }
          assert names == expected, (names, expected)
          PY
          sha256sum dist/* | tee release-SHA256SUMS.txt

      - name: Fresh wheel install proof
        run: |
          python -m venv "$RUNNER_TEMP/sensemaking-wheel"
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" -m pip install dist/sensemaking_skills-0.3.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sensemaking-wheel/bin/sensemaking-skills" --version | tee wheel-version.txt
          grep -F "0.3.0" wheel-version.txt
          "$RUNNER_TEMP/sensemaking-wheel/bin/sensemaking-skills" campaign --help >/dev/null
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" - <<'PY'
          from importlib.resources import files
          from importlib.util import find_spec
          from sensemaking_skills.campaign_semantics import CURRENT_SCHEMA_VERSION
          from sensemaking_skills.external_qualification import PROTOCOL_ID

          assert CURRENT_SCHEMA_VERSION == "2"
          assert PROTOCOL_ID == "v0.3-external-golden-path-dogfood-v1"
          package = files("sensemaking_skills")
          assert package.joinpath("skill_trees", "repo-sensemaker", "SKILL.md").is_file()
          assert package.joinpath("validator_runtime", "scripts", "validate-and-report.py").is_file()
          assert package.joinpath("validator_runtime", "skills", "repo-sensemaker", "SKILL.md").is_file()
          assert find_spec("sensemaking_skills.campaign_validation") is None
          assert find_spec("sensemaking_skills.campaign_accounting") is None
          assert find_spec("sensemaking_skills.exploratory_authorization") is None
          assert find_spec("sensemaking_skills.exploratory_execution") is None
          PY

      - name: Fresh sdist install proof
        run: |
          python -m venv "$RUNNER_TEMP/sensemaking-sdist"
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" -m pip install dist/sensemaking_skills-0.3.0.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sensemaking-sdist/bin/sensemaking-skills" --version | tee sdist-version.txt
          grep -F "0.3.0" sdist-version.txt
          "$RUNNER_TEMP/sensemaking-sdist/bin/sensemaking-skills" campaign --help >/dev/null
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" - <<'PY'
          from importlib.resources import files
          from sensemaking_skills.campaign_semantics import CURRENT_SCHEMA_VERSION

          assert CURRENT_SCHEMA_VERSION == "2"
          package = files("sensemaking_skills")
          assert package.joinpath("validator_runtime", "scripts", "validate-and-report.py").is_file()
          PY

      - name: Upload candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: sensemaking-skills-v0.3.0-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*
            release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
