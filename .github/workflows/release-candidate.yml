name: Release Candidate Distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  distribution:
    name: v1.0 release distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact-head checkout
        run: |
          resolved="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Resolved checkout SHA: $resolved"
          echo "Expected exact head SHA: $expected"
          test "$resolved" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests build twine ruff

      - name: Resolve release identity
        id: release_identity
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import yaml

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          contract = yaml.safe_load(Path("release-v1.0.yaml").read_text(encoding="utf-8"))
          source_version = pyproject["project"]["version"]
          target_version = contract["release"]["version"]
          release_status = contract["release"]["status"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_version={source_version}\n")
              handle.write(f"target_version={target_version}\n")
              handle.write(f"release_status={release_status}\n")
          PY

      - name: Release phase
        run: |
          echo "Source version: ${{ steps.release_identity.outputs.source_version }}"
          echo "Release target: ${{ steps.release_identity.outputs.target_version }}"
          echo "Release status: ${{ steps.release_identity.outputs.release_status }}"
          if [ "${{ steps.release_identity.outputs.release_status }}" = "development" ]; then
            echo "Development distribution validation only; this run does not qualify a frozen release candidate."
          else
            echo "Frozen candidate distribution qualification for exact checked-out source."
          fi

      - name: Version 1.0 release contract
        run: python scripts/validate-release-contract.py --repo-root .

      - name: Contract authority graph
        run: python scripts/validate-contract-authority.py --repo-root .

      - name: Current documentation
        run: python scripts/validate-docs-currentness.py --repo-root .

      - name: Frozen public Python API
        run: python -m pytest tests/test_public_api_contract.py tests/test_cli_contract.py tests/test_cli_json_contract.py -q

      - name: Shipped-source static quality
        run: >-
          ruff check
          src/sensemaking_skills/campaign_semantics
          src/sensemaking_skills/campaigns
          src/sensemaking_skills/commands
          src/sensemaking_skills/defaults
          src/sensemaking_skills/semantic_architecture
          src/sensemaking_skills/skills
          src/sensemaking_skills/setup_skills.py
          src/sensemaking_skills/cli.py
          --select E4,E7,E9,F

      - name: Error-boundary audit
        run: python scripts/validate-error-boundaries.py

      - name: Release baseline contracts
        run: |
          python scripts/validate-product-boundary.py
          python -m pytest \
            tests/campaign_validation/test_release_candidate_contract.py \
            tests/campaign_validation/test_campaign_schema_evolution.py \
            tests/test_version_upgrade.py \
            tests/integration/test_external_golden_path_qualification.py \
            tests/test_release_authority_audit.py \
            -q

      - name: Build wheel and sdist
        run: |
          rm -rf build dist
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Assert current source artifact identities
        env:
          SOURCE_VERSION: ${{ steps.release_identity.outputs.source_version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["SOURCE_VERSION"]
          names = {path.name for path in Path("dist").iterdir() if path.is_file()}
          expected = {
              f"sensemaking_skills-{version}-py3-none-any.whl",
              f"sensemaking_skills-{version}.tar.gz",
          }
          assert names == expected, (names, expected)
          PY
          sha256sum dist/* | tee release-SHA256SUMS.txt

      - name: Fresh wheel install proof
        env:
          SOURCE_VERSION: ${{ steps.release_identity.outputs.source_version }}
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/sensemaking-wheel"
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sensemaking-wheel/bin/sensemaking-skills" --version | tee wheel-version.txt
          grep -F "$SOURCE_VERSION" wheel-version.txt
          "$RUNNER_TEMP/sensemaking-wheel/bin/sensemaking-skills" campaign --help >/dev/null
          "$RUNNER_TEMP/sensemaking-wheel/bin/python" - <<'PY'
          from importlib.resources import files
          from importlib.util import find_spec
          from sensemaking_skills.campaign_semantics import CURRENT_SCHEMA_VERSION
          from sensemaking_skills.external_qualification import PROTOCOL_ID

          assert CURRENT_SCHEMA_VERSION == "2"
          assert PROTOCOL_ID == "v0.3-external-golden-path-dogfood-v1"
          package = files("sensemaking_skills")
          assert package.joinpath("skill_trees", "repo-sensemaker", "SKILL.md").is_file()
          assert package.joinpath("validator_runtime", "scripts", "validate-and-report.py").is_file()
          assert package.joinpath("validator_runtime", "skills", "repo-sensemaker", "SKILL.md").is_file()
          assert find_spec("sensemaking_skills.campaign_validation") is None
          assert find_spec("sensemaking_skills.campaign_accounting") is None
          assert find_spec("sensemaking_skills.exploratory_authorization") is None
          assert find_spec("sensemaking_skills.exploratory_execution") is None
          PY

      - name: Fresh sdist install proof
        env:
          SOURCE_VERSION: ${{ steps.release_identity.outputs.source_version }}
        run: |
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m venv "$RUNNER_TEMP/sensemaking-sdist"
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" -m pip install "$sdist"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sensemaking-sdist/bin/sensemaking-skills" --version | tee sdist-version.txt
          grep -F "$SOURCE_VERSION" sdist-version.txt
          "$RUNNER_TEMP/sensemaking-sdist/bin/sensemaking-skills" campaign --help >/dev/null
          "$RUNNER_TEMP/sensemaking-sdist/bin/python" - <<'PY'
          from importlib.resources import files
          from sensemaking_skills.campaign_semantics import CURRENT_SCHEMA_VERSION

          assert CURRENT_SCHEMA_VERSION == "2"
          package = files("sensemaking_skills")
          assert package.joinpath("validator_runtime", "scripts", "validate-and-report.py").is_file()
          PY

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: sensemaking-skills-${{ steps.release_identity.outputs.source_version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*
            release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
