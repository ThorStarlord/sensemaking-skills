required_cases:
  - id: repo-sensemaker-workflow-id-hallucination
    validator: validate-brief
    fixture: tests/fixtures/validate-brief/invalid/repo-sensemaker-id-hallucination.md
    reason: Prevent regression of hallucinated workflow IDs such as wave-1-execution.

  - id: prompt-handoff-unknown-target-skill
    validator: validate-prompt-handoff
    fixture: tests/fixtures/validate-prompt-handoff/invalid/unknown-target-skill.md
    reason: Prevent regression of unknown target skill detection in prompt handoff artifacts.

excluded_validators:
  - validator: validate-repo
    reason: Repository-level meta-validator; not fixture-tested by the Validator Verification Suite.
  - validator: validate-output
    reason: Validator runner that delegates to registered validators via artifact-contracts.yaml; not a validator itself.
  - validator: validate-run-log
    reason: Run log meta-validator; validates dynamic run log documents, not static fixtures. Run logs are produced per-session and cannot be fixture-tested with static files.
  - validator: validate-mode-coverage
    reason: Mode coverage meta-validator; validates docs/mode-coverage.yaml against live run logs and failure ledger. Cannot be fixture-tested because its checks are dynamic (existence, consistency across actual run logs).
  - validator: analyze-run-failures
    reason: Failure ledger meta-validator; scans live run logs to build a failure ledger and detect repeatable failure boundaries. Cannot be fixture-tested because it operates on dynamic session data.

