improvement_gate:
  unsupported_claim_rate: "hardened < baseline"
  evidence_precision: "hardened > baseline"
  weakest_boundary_accuracy: "hardened > baseline"
  routing_accuracy: "hardened >= baseline"
  validation_pass_rate: "hardened >= baseline"
