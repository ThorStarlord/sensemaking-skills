## What failed and why (measurement evidence, three independent 25-run rounds)
1. Boundary-type accuracy DECLINED twice in different directions (0.52 round 1,
   0.44 round 2) under prose-guidance changes. Round 1: GAP-6 over-generalized
   Ghost Features. Round 2: the corrected bullets over-corrected OTHER repos
   (backend-service, strong-ui-fog: Zero Validation -> Implicit Dependencies;
   hidden-coupling: Implicit Dependencies -> Vocabulary Drift; full-stack,
   generated-heavy: Contract Mismatch -> Ghost Features). Prose guidance at
   this level of specificity does not move a 25-repo boundary-type accuracy
   distribution monotonically; each fix shifts an equivalent number of other
   repos off their frozen type.
2. Evidence metrics are FLAT (0.632/0.633, 0.844/0.835). The briefs got longer
   and better-labeled (inference labeling up) but the claim-level precision
   proxy did not move. No evidence of harm, no evidence of gain.
3. Fog accuracy net -1: the ghost-feature 3-way and entry-point rules fixed 3
   repos but flipped web-frontend (ui_fog -> architecture_fog, REPAIR-2
   tie-break was applied but the app-cannot-boot structural argument won),
   poorly-documented (docs -> arch), generated-heavy (arch -> product),
   unusual-layout (arch -> docs). The remaining 4 flips are all defensible
   diagnoses under the new rules - the frozen ground truth and the new
   guidance disagree on 4 of 25 repos, which is the honest signal that the
   guidance shifted the classifier's decision boundary, not that the new
   answers are wrong.
4. Three validation-pass-rate defects across rounds were YAML authoring bugs
   (unquoted colons in evidence supports_claim scalars), not skill failures;
   REPAIR-3 fixed them (validation 1.0) without touching diagnosis content.

## Interpretation
The hardening changed WHERE the classifier's decision boundary sits (fog and
weakness-type choices shifted on ~half the corpus) and improved the visible
reasoning discipline (inference labeling, conflict surfacing, routing/validation
stability), but it did NOT improve the frozen headline metrics, and the
boundary-type accuracy declined. At n=25 with model-run variance, the
remaining gap cannot be closed by another prose-guidance cycle without
overfitting to the corpus - which the charter prohibits.

## Recommendation (Phase 22/23 input)
DISPOSITION: REVISE (do not merge the candidate to main as-is).
Keep in the skill (proven): evidence authority model, deterministic
exploration protocol, registry authority + execution-mode rule, GAP-1 quote
modes, GAP-3 citation extensions, ghost-feature 3-way fog rule, entry-point
vs deliverable distinction, UI-fog tie-break, constrained GAP-6 mapping,
logic-trace/alternatives/confidence structure.
Requires a different mechanism (not prose): boundary-type selection should be
a deterministic decision procedure (checklist with binary gates mirroring the
mapping guidance) evaluated on a larger corpus before re-testing; the
semantic evidence metrics need a claim-level ground truth (the current proxy
cannot distinguish guidance quality from authoring style).
Open items for human disposition: (1) approve REVISE and file follow-up
workstream; (2) accept candidate with documented limitations (PASS_WITH_
REMAINING_LIMITATIONS); (3) commission a larger-corpus re-run before any
merge decision. automatic_merge remains prohibited.
