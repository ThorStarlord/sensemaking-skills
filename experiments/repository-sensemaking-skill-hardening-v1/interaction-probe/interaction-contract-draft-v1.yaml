schema: interaction-contract-draft-v1
frozen_at: "2026-08-07T02:20:00Z"
status: DRAFT — proposed, not adopted. Adoption requires the charter-approval
        gate; if adopted as a new acceptance criterion, it becomes a charter
        amendment requiring an explicit human decision (5A.6).

decision_5A4:
  machine_artifact: "the existing 14-section brief remains the machine artifact (validator, handoff, routing)"
  human_layer: "a compact human synthesis (15-30 lines) derived from the machine brief - never a second diagnosis"
  rationale: "deterministic machine handoff structure and excellent human UX do not need to be the same artifact"

user_experience:
  answer_repository_purpose_early: true
  identify_actual_runtime_shape: true
  distinguish_observation_from_inference: true
  expose_conflicting_evidence: true
  state_confidence: true
  present_alternatives_when_material: true
  identify_highest_value_next_work: true
  explain_why: true
  ask_before_consequential_action: true

human_synthesis_sections:
  - what_this_repository_is
  - how_it_actually_works (flow, not inventory)
  - the_one_important_weakness (why it matters)
  - evidence_basis (2-4 citations)
  - alternatives_considered (1-3, when material)
  - confidence (high/medium/low + what would raise it)
  - recommended_next_step (concrete, actionable)
  - ask_before (consequential action boundaries)

derivation_rule: "the synthesis is derived from the machine brief's evidence, boundary, and routing; it must not introduce claims absent from the brief or contradict its handoff"

fog_terminology_rule: "fog labels stay in the machine handoff; the human synthesis describes the concrete gap in plain language"

proposed_amendment (pending human decision):
  id: AMEND-1
  text: "add the human synthesis as a derived user-facing layer; interaction quality becomes a measured dimension (Phase 16) but does not replace any frozen numeric gate"
  status: proposed
