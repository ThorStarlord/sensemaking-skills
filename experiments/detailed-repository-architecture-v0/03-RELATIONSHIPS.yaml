# Typed, evidence-backed edges. Relationships are the primary object of interest.
# Each edge: from, rel, to, note, evidence[], grade.
# grade: DEMONSTRATED | DERIVED | INTERPRETIVE | HYPOTHESIS
#
# Relationship families used: STRUCTURAL, ARTIFACT, VALIDATION, AUTHORITY,
# PRODUCT, LIFECYCLE, RESEARCH. Edges added because they materially describe the
# repository, not to fill the vocabulary.

