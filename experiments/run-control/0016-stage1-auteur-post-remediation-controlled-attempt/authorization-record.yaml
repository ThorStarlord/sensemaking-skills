# not exist until this preparation branch itself is committed, so it cannot
# be pinned inside this digest-hashed file without creating a circular
# dependency (this file's bytes would need to contain a hash of a commit
# that itself contains this file's bytes). This is the same reasoning
# docs/experiments/STAGE-1-AUTEUR-POST-REMEDIATION-PREPARATION.md already
# applies to execution_framework_sha (section 2a): the record is authored
# after the revision it pins is already immutable. The operative
# run_control_commit_sha will therefore be supplied by the runtime at
# execution time, resolved against artifact_root's real HEAD -- never
# guessed or pre-written here.
