# run_control_commit_sha is never stored inside this record -- it is a
# runtime-resolved value on AuthorizationContext, supplied by the caller at
# authorize() time. With artifact_root set, it means exactly one thing: the
# artifact_root HEAD commit from which authorization-record.yaml,
# authorization-record.sha256, and owner-approval.md are all byte-proven
