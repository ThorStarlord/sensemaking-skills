# Workflow liveness is separate from registry identity.
#
# Registry membership preserves stable IDs and historical/compatibility provenance.
# Liveness controls whether a workflow is eligible for CURRENT recommendation,
# selection, planning, or execution. See ADR 0027 and the disposition audit.
#
# Simplification posture (2026-10-05): compatibility is the default. A workflow
# becomes active only through explicit evidence-backed promotion.
schema_version: 1
default_liveness: compatibility_only
allowed_liveness: [active, compatibility_only]

overrides:
  # The disposition audit found recurring successful evidence for this bounded
  # sequence. All other registered workflows remain addressable historical /
  # compatibility definitions but are excluded from current selection.
  docs-contract-reconciliation: active
