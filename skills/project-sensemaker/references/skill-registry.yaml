# Skill Registry & Routing Table

This registry defines the primary downstream skills and ecosystems that `project-sensemaker` routes to.

---

## Engineering Skills (Matt Pocock Ecosystem)

### grill-me
- **use_when**: Mental models are misaligned; user needs a "rubber duck" to challenge assumptions.
- **do_not_use_when**: You have enough clarity to start a PRD or issues.
- **expected_input**: A rough idea or goal.
- **expected_output**: A clarified, "grilled" version of the goal.
- **example_prompts**: "Use grill-me to challenge my assumptions about this new feature."

### grill-with-docs
- **use_when**: The project exists but has drifted from docs; need to align code with intent.
- **do_not_use_when**: No documentation exists yet.
- **expected_input**: Repository context + existing docs.
- **expected_output**: Updated context or a set of resolved contradictions.

### zoom-out
- **use_when**: Lost in implementation details; need a higher-level architectural or strategic view.
- **do_not_use_when**: You are just starting the project (use `project-sensemaker`).

### prototype
- **use_when**: Need to test a technical approach quickly without full TDD or production overhead.
- **do_not_use_when**: Implementation path is already clear and standard.

### tdd
- **use_when**: Ready to implement; logic is deterministic; want high confidence and vertical slices.
- **do_not_use_when**: The "how" is still unknown (use `prototype`).

### diagnose
- **use_when**: Facing a hard bug, regression, or "impossible" system state.

### to-issues
- **use_when**: PRD or spec is ready; need to break work into AFK-compatible vertical slices.

### handoff
- **use_when**: Ending a session; need a "Feature Completion Summary" for the next agent or session.

---

## Interface Skills (UI/UX Ecosystem)

### interface-skills-workflow
- **use_when**: Work is primarily about UI components, design systems, or frontend flows.
- **expected_output**: A validated Spec Package (Run Manifest + UI Spec).
- **skills**: [ui-brief, ui-blueprint, ui-inspector, ui-redline]

---

## Product Manager Skills (Discovery/Strategy Ecosystem)

### product-manager-discovery
- **use_when**: The "who" or "why" is missing; user/market problem is undefined.
- **expected_output**: Persona, Hypothesis, or Opportunity Tree.

### product-manager-prd
- **use_when**: Problem is understood; solution needs detailed requirements and acceptance criteria.
- **expected_output**: A production-ready PRD.

### product-manager-experiment
- **use_when**: High-risk assumption identified; need to design an A/B test or validation experiment.

---

## Ecosystem Overviews

### Interface Skills
- **Purpose**: Turn fuzzy UI work into explicit, testable Spec Packages.
- **Core Object**: Spec Package.

### Matt Pocock Skills
- **Purpose**: Engineering discipline, grilling, TDD, and architectural integrity.
- **Core Philosophy**: Pragmatic Programmer / DDD fundamentals.

### Product Manager Skills
- **Purpose**: Product discovery, delivery, strategy, and GTM.
- **Focus**: Solving for the user and the business.

