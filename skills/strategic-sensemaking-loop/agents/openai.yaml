interface:
  display_name: Strategic Sensemaking Loop
  short_description: Run or resume strategic repository Sensemaking from one prompt, including full-autonomy terminal missions.
  icon: 🔁
  color: purple

instructions: >
  Use SKILL.md as a thin orchestration front door over the existing strategic
  Sensemaking Skills. Reconstruct the current durable boundary, invoke only
  warranted specialized stages, continue through authorized repository-answerable
  work, reconcile consequential returned evidence, and continue across bounded
  responsibilities when an explicit terminal mission remains open. Stop only at
  genuine terminal, owner, Level-4, external, or authority boundaries. Never
  create a master state artifact, deterministic planner, backlog executor, or
  automatic protected-transition authority.

tools:
  - web_search
  - read_local_files
  - search_local_files
