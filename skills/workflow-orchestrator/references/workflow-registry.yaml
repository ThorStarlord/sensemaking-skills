workflows:
  - id: sensemaking-to-workflow
    display_name: Sensemaking to Workflow
    purpose: Move from raw fog to a selected workflow with approval gates.
    allowed_execution_modes:
      - plan_only
      - prompt_chain
      - guided_execution
      - autonomous_execution
      - yolo_execution
    requires_clean_worktree: true
    requires_run_log: true
    branch_policy:
      required: true
      pattern: "yolo/{workflow_id}/{timestamp}"
    steps:
      - id: 1
        skill: problem-framer
        gate: review_problem_frame
      - id: 2
        skill: unknowns-mapper
        gate: review_unknowns_map
      - id: 3
        skill: repo-sensemaker
        gate: review_sensemaking_brief
      - id: 4
        skill: workflow-orchestrator
        gate: review_workflow_plan
      - id: 5
        skill: prompt-handoff
        gate: review_final_prompt

  - id: fast-diagnostic
    display_name: Fast Diagnostic
    purpose: Quickly identify the weakest boundary in a repository.
    allowed_execution_modes:
      - plan_only
      - prompt_chain
      - guided_execution
      - autonomous_execution
      - yolo_execution
    requires_run_log: true
    branch_policy:
      required: true
      pattern: "yolo/{workflow_id}/{timestamp}"
    steps:
      - id: 1
        skill: repo-sensemaker
        gate: review_sensemaking_brief
      - id: 2
        skill: workflow-orchestrator
        gate: review_workflow_plan

  - id: experimental-autonomous-sprint
    display_name: Autonomous Sprint (Experimental)
    purpose: High-velocity execution using Matt Pocock skills.
    allowed_execution_modes:
      - plan_only
      - prompt_chain
      - guided_execution
      - autonomous_execution
    steps:
      - id: 1
        skill: grill-with-docs
        gate: review_domain_alignment
      - id: 2
        skill: to-prd
        gate: review_prd
      - id: 3
        skill: to-issues
        gate: review_issue_list
      - id: 4
        skill: triage
        gate: review_agent_briefs
      - id: 5
        skill: tdd
        gate: verify_tests
      - id: 6
        skill: handoff
        gate: session_close
