version: 1
ecosystems:
  matt_pocock:
    display_name: Matt Pocock Engineering Skills
    purpose: "Engineering discipline, mental model alignment, grilling, TDD, and architectural integrity."
    skills:
      - id: grill-me
        display_name: Grill Me
        use_when: ["Mental models are misaligned", "User needs assumptions challenged"]
        do_not_use_when: ["Enough clarity exists to start a PRD or issue breakdown"]
        expected_input: ["Rough idea or goal"]
        expected_output: ["Clarified and challenged goal"]
        example_prompt: "Use grill-me to challenge my assumptions about this feature."
      
      - id: grill-with-docs
        display_name: Grill With Docs
        use_when: ["Project exists but has drifted from docs", "Need to align code with intent"]
        do_not_use_when: ["No documentation exists yet"]
        expected_input: ["Repository context", "Existing docs"]
        expected_output: ["Updated context", "Resolved contradictions"]
        example_prompt: "Use grill-with-docs to align this new proposal with our existing CONTEXT.md."

      - id: tdd
        display_name: Test-Driven Development
        use_when: ["Ready to implement", "Logic is deterministic", "Want vertical slices"]
        do_not_use_when: ["The 'how' is still unknown"]
        expected_input: ["Issue list", "Agent Brief"]
        expected_output: ["Verified, committed code"]
        example_prompt: "Use tdd to implement the highest priority issue from the triage list."

  interface_skills:
    display_name: Interface Skills
    purpose: "Turn fuzzy UI work into explicit, testable Spec Packages."
    skills:
      - id: ui-brief
        display_name: UI Brief
        use_when: ["Starting a new UI feature", "Scope is undefined"]
        expected_output: ["UI Spec", "Run Manifest"]
      
  product_manager:
    display_name: Product Manager Skills
    purpose: "Product discovery, delivery, strategy, and validation."
    skills:
      - id: discovery
        display_name: Product Discovery
        use_when: ["The 'who' or 'why' is missing", "User problem is undefined"]
        expected_output: ["Persona", "Hypothesis", "Opportunity Tree"]

      - id: prd
        display_name: PRD Generation
        use_when: ["Problem is understood", "Solution needs detailed requirements"]
        expected_output: ["Production-ready PRD"]

routing_rules:
  tie_breakers:
    - rule: "If user lacks system understanding, route to /zoom-out."
    - rule: "If user has proposed change and existing docs, route to /grill-with-docs."
    - rule: "If multiple plausible solution shapes exist, route to /prototype."
    - rule: "If desired behavior is deterministic and testable, route to /tdd."
    - rule: "If issue is UI/spec drift, route to Interface Skills."
    - rule: "If user/customer/value prop is unclear, route to PM discovery."
  confidence_rules:
    - rule: "If unknowns are too fundamental to choose a downstream skill, do not route. Recommend a research path or problem frame instead."

