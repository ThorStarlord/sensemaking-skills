# Artifact Contracts: Sensemaking Pipeline

artifacts:
  - id: problem_frame
    produced_by: problem-framer
    consumed_by:
      - unknowns-mapper
      - repo-sensemaker
    required_sections:
      - raw_fog
      - problem_under_the_problem
      - object_under_pressure
      - failure_mode
      - success_condition
      - what_must_be_true
      - next_artifact

  - id: unknowns_map
    produced_by: unknowns-mapper
    consumed_by:
      - repo-sensemaker
      - prompt-handoff
    required_sections:
      - knowns
      - unknowns
      - assumptions
      - risks
      - research_paths
      - stopping_rule

  - id: repository_sensemaking_brief
    produced_by: repo-sensemaker
    consumed_by:
      - workflow-orchestrator
      - prompt-handoff
      - sensemaking-docs-reconciler
    required_sections:
      - repository_goal
      - current_shape
      - strong_signals
      - missing_pieces
      - improvement_opportunities
      - weakest_boundary
      - evidence
      - evidence_excerpts
      - why_this_boundary_matters
      - candidate_next_steps
      - recommended_next_step
      - recommended_workflow
      - machine_readable_handoff
      - ready_to_copy_prompt
    required_machine_fields:
      - recommended_workflow_id
      - recommended_execution_mode
      - weakest_boundary
      - required_inputs

  - id: discovery_findings
    produced_by: discovery
    consumed_by:
      - opportunity-tree
      - prompt-handoff

  - id: domain_alignment_report
    produced_by: grill-with-docs
    consumed_by:
      - to-prd
      - prompt-handoff

  - id: prd
    produced_by: to-prd
    consumed_by:
      - to-issues
      - prompt-handoff

  - id: issue_list
    produced_by: to-issues
    consumed_by:
      - triage

  - id: agent_brief
    produced_by: triage
    consumed_by:
      - tdd

  - id: code_patch
    produced_by: tdd
    consumed_by:
      - handoff

  - id: session_summary
    produced_by: handoff
    consumed_by:
      - workflow-orchestrator

  - id: okr_list
    produced_by: okr
    consumed_by:
      - roadmap

  - id: roadmap
    produced_by: roadmap
    consumed_by:
      - stakeholder-update
      - prompt-handoff

  - id: stakeholder_update
    produced_by: stakeholder-update
    consumed_by:
      - workflow-orchestrator

  - id: business_canvas
    produced_by: lean-canvas
    consumed_by:
      - product-manager

  - id: north_star_metric
    produced_by: north-star
    consumed_by:
      - okr

  - id: persona_definition
    produced_by: persona
    consumed_by:
      - discovery
      - customer-journey

  - id: synthesis_report
    produced_by: interview-synthesis
    consumed_by:
      - opportunity-tree

  - id: market_analysis
    produced_by: competitive-analysis
    consumed_by:
      - pricing
      - battlecard

  - id: opportunity_map
    produced_by: opportunity-tree
    consumed_by:
      - hypothesis

  - id: hypothesis_statement
    produced_by: hypothesis
    consumed_by:
      - experiment-design
      - prd

  - id: journey_map
    produced_by: customer-journey
    consumed_by:
      - product-manager

  - id: story_list
    produced_by: user-stories
    consumed_by:
      - acceptance-criteria
      - prioritize

  - id: criteria_list
    produced_by: acceptance-criteria
    consumed_by:
      - prompt-handoff

  - id: workflow_orchestration_plan
    produced_by: workflow-orchestrator
    consumed_by:
      - user
      - agents (autonomous_execution)
    required_sections:
      - brief_consumed
      - chosen_workflow
      - why_this_workflow
      - skills_in_sequence
      - inputs_and_outputs
      - approval_gates
      - stop_conditions
      - execution_mode
      - prompt_chain
      - run_log_template
      - machine_readable_plan
    required_machine_fields:
      - chosen_workflow_id
      - execution_mode
      - steps
      - approval_gates
      - stop_conditions

  - id: prompt_handoff
    produced_by: 
      - prompt-handoff
      - handoff
    consumed_by:
      - external_agent
    required_sections:
      - target_skill
      - context_to_preserve
      - task
      - constraints
      - inputs
      - expected_output
      - stop_condition
      - ready_to_copy_prompt

  - id: docs_contract_reconciliation_report
    produced_by: sensemaking-docs-reconciler
    consumed_by:
      - prompt-handoff
    required_sections:
      - drift_diagnosis
      - weakest_boundary
      - missing_instructions
      - missing_examples
      - validator_blind_spots
      - ambiguous_artifact_names
      - drift_risks
      - recommended_patches
      - mismatches_found
      - changes_required
      - patches_proposed
      - validation_result
      - next_handoff
