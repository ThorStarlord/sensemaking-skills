summary: "Fixed failing field-contract guardrail (tests/test_field_contract_agreement.py) by removing the non-canonical legacy alias 'fog_type' from OrchestrationRunner._FOG_TYPE_FIELDS in scripts/workflow-runtime.py (1 line replaced: 1 insertion, 1 deletion). Investigation showed 'fog_type' is not canonical: no artifact contract declares it (the repository_sensemaking_brief declares primary_fog_type as required and user_implied_fog_type as recommended; the workflow_orchestration_plan declares primary_fog_type), no producer emits it (all example briefs/plans use primary_fog_type), and validators (scripts/validate-plan.py) read primary_fog_type. Declaring 'fog_type' in the contract would have enshrined a field no producer writes; removing the dead alias preserves runtime behavior for all real artifacts (resolution falls through to primary_fog_type unchanged). Verified: pytest tests/test_field_contract_agreement.py -> 3 passed, 0 failed; scripts/test-validators.py -> 72/72 passed; scripts/validate-repo.py -> 'Validation passed!'. Note: the spike brief referenced 'defaults/artifact-contracts.yaml', but that path does not exist in this repo; the contract file loaded by the test is skills/workflow-planner/references/artifact-contracts.yaml, which required no changes."
